<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Jornada Espacial</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00d2ff">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: #070b14;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    #gameWrapper {
      position: relative;
      width: 100vw;
      height: 100dvh;
      background: #070b14;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #070b14;
    }

    .hud-bars {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 98px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
    }

    .bars-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 128px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: #7dd3fc;
    }

    .bar-label {
      width: 56px;
      text-transform: uppercase;
    }

    .bar-track {
      flex: 1;
      height: 6px;
      background: rgba(13, 17, 23, 0.9);
      border: 1px solid rgba(0, 210, 255, 0.35);
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d2ff, #00ffff);
      transition: width 0.12s linear;
    }

    .bar-val {
      font-size: 9px;
      color: #00ffff;
      min-width: 24px;
      text-align: right;
    }

    .stats-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      font-size: 10px;
      font-weight: 800;
      color: #00ffff;
      background: rgba(13, 17, 23, 0.72);
      border: 1px solid rgba(0, 210, 255, 0.28);
      border-radius: 6px;
      padding: 4px 7px;
    }

    .planet-tag {
      font-size: 10px;
      color: #ffd166;
      text-transform: uppercase;
    }

    .active-tags {
      position: absolute;
      top: 66px;
      left: 10px;
      right: 100px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      z-index: 12;
      pointer-events: none;
    }

    .fx-pill {
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid rgba(0, 255, 255, 0.45);
      color: #00ffff;
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .fx-pill.gold {
      border-color: rgba(255, 209, 102, 0.65);
      color: #ffd166;
    }

    .side-dock {
      position: absolute;
      top: 8px;
      right: 6px;
      bottom: 126px;
      width: 86px;
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid rgba(0, 210, 255, 0.35);
      border-radius: 10px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 15;
      overflow-y: auto;
    }

    .dock-title {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #00d2ff;
      text-align: center;
      font-weight: 800;
    }

    .dock-btn {
      background: #070b14;
      border: 1px solid rgba(0, 210, 255, 0.28);
      color: #e6edf3;
      border-radius: 6px;
      padding: 4px 2px;
      font-size: 9px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      line-height: 1.1;
    }

    .dock-btn.active {
      border-color: #00ffff;
      background: rgba(0, 210, 255, 0.2);
      color: #00ffff;
    }

    .divider {
      height: 1px;
      background: rgba(0, 210, 255, 0.2);
      margin: 2px 0;
    }

    #commanderBanner {
      position: absolute;
      top: 94px;
      left: 10px;
      right: 100px;
      background: rgba(13, 17, 23, 0.92);
      border-left: 3px solid #ffd166;
      border-top: 1px solid rgba(0, 210, 255, 0.35);
      border-right: 1px solid rgba(0, 210, 255, 0.35);
      border-bottom: 1px solid rgba(0, 210, 255, 0.35);
      border-radius: 8px;
      padding: 7px 9px;
      z-index: 20;
      display: none;
    }

    .cmd-header {
      font-size: 9px;
      font-weight: 800;
      color: #ffd166;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .cmd-text {
      font-size: 11px;
      font-weight: 600;
      color: #e6edf3;
    }

    #floatToast {
      position: absolute;
      bottom: 122px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 17, 23, 0.88);
      border: 1px solid #ffd166;
      color: #ffd166;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 800;
      z-index: 22;
      display: none;
      pointer-events: none;
    }

    .controls-bottom {
      position: absolute;
      bottom: calc(44px + env(safe-area-inset-bottom, 0px));
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }

    .move-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .pad-btn {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      border: 1px solid rgba(0, 210, 255, 0.55);
      background: rgba(13, 17, 23, 0.92);
      color: #00ffff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .orb-group {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .squad-orb {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(0, 210, 255, 0.55);
      background: rgba(16, 28, 38, 0.95);
      color: #00ffff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.28);
    }

    .squad-orb:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pronto-orb {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid #00ffff;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.38) 0%, rgba(7, 11, 20, 0.96) 75%);
      color: #ffd166;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 210, 255, 0.65);
    }

    .pronto-orb:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .pronto-bolt {
      font-size: 17px;
      line-height: 1;
    }

    .pronto-txt {
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #e6edf3;
      margin-top: 2px;
    }

    #gameOverModal {
      position: fixed;
      inset: 0;
      background: rgba(7, 11, 20, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 20px;
      text-align: center;
    }

    #gameOverModal h2 {
      color: #00ffff;
      margin: 0 0 10px;
    }

    #gameOverModal p {
      margin: 0 0 18px;
      color: #e6edf3;
    }

    #restartBtn {
      padding: 10px 22px;
      border-radius: 8px;
      border: 1px solid #00ffff;
      background: #00d2ff;
      color: #070b14;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="gameWrapper">
    <canvas id="gameCanvas"></canvas>

    <div class="hud-bars">
      <div class="bars-left">
        <div class="bar-row">
          <span class="bar-label">ESCUDO</span>
          <div class="bar-track"><div class="bar-fill" id="barShield" style="width:100%"></div></div>
          <span class="bar-val" id="valShield">100%</span>
        </div>
        <div class="bar-row">
          <span class="bar-label">ENERGIA</span>
          <div class="bar-track"><div class="bar-fill" id="barAmmo" style="width:100%"></div></div>
          <span class="bar-val" id="valAmmo">300</span>
        </div>
        <div class="bar-row">
          <span class="bar-label">OVERDRIVE</span>
          <div class="bar-track"><div class="bar-fill" id="barOverdrive" style="width:100%"></div></div>
          <span class="bar-val" id="valOverdrive">OK</span>
        </div>
      </div>

      <div class="stats-right">
        <span class="planet-tag" id="hudPlanet">DESTINO: MERCÚRIO</span>
        <span id="hudScore">PONTOS: 0</span>
        <span id="hudTimer">PRÓX: 60s</span>
      </div>
    </div>

    <div class="active-tags" id="activeTags"></div>

    <div id="commanderBanner">
      <div class="cmd-header">Comandante</div>
      <div class="cmd-text" id="commanderMsg"></div>
    </div>

    <div id="floatToast"></div>

    <aside class="side-dock">
      <div class="dock-title">Naves</div>
      <button class="dock-btn active" data-ship="falcon">Falcon V1</button>
      <button class="dock-btn" data-ship="interceptor">Interceptor</button>
      <button class="dock-btn" data-ship="titan">Titan X</button>

      <div class="divider"></div>

      <div class="dock-title">Armas</div>
      <button class="dock-btn active" data-weapon="laser">Laser Duplo</button>
      <button class="dock-btn" data-weapon="plasma">Plasma</button>
      <button class="dock-btn" data-weapon="spread">Triplo</button>

      <div class="divider"></div>

      <div class="dock-title">Modo</div>
      <button class="dock-btn" id="btnAiMode">PILOTO IA<br>DESLIGADO</button>
    </aside>

    <div class="controls-bottom">
      <div class="move-group">
        <button class="pad-btn" id="btnLeft">◀</button>
        <button class="pad-btn" id="btnRight">▶</button>
      </div>

      <div class="orb-group">
        <button class="squad-orb" id="btnSquadron" title="Esquadrão de Naves">✦</button>
        <button class="pronto-orb" id="btnRockCannon" title="Canhão Rocha">
          <span class="pronto-bolt">⚡</span>
          <span class="pronto-txt" id="prontoLabel">PRONTO</span>
        </button>
      </div>
    </div>
  </div>

  <div id="gameOverModal">
    <h2>Nave Avariada</h2>
    <p id="finalStats">Pontuação final: 0</p>
    <button id="restartBtn">Jogar Novamente</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const PLANET_DURATION_MS = 60000;
    const STAR_COLORS = ['#00ffff', '#ffd166', '#ff758f', '#7dd3fc', '#4ade80', '#f472b6', '#ffffff'];
    const ROCK_COLORS = ['#ff9e00', '#ff6b35', '#ffd166', '#fb7185', '#38bdf8', '#f59e0b'];

    const PLANETS = [
      {
        name: 'Mercúrio',
        theme: 'classic',
        bgTop: '#070b14',
        bgBottom: '#070b14',
        nebula: 'rgba(255, 179, 71, 0.14)',
        alert: 'Comandante: Atenção! Setor Mercúrio — aviso: cuidado com o desafio das rochas, asteroides e naves!'
      },
      {
        name: 'Vênus',
        theme: 'venus',
        bgTop: '#241608',
        bgBottom: '#070b14',
        nebula: 'rgba(255, 179, 71, 0.18)',
        alert: 'Comandante: Atenção! Etapa concluída, chegamos a Vênus — aviso: cuidado com o desafio de calor, rochas, satélites e naves hostis!'
      },
      {
        name: 'Marte',
        theme: 'mars',
        bgTop: '#290d0c',
        bgBottom: '#070b14',
        nebula: 'rgba(255, 77, 109, 0.16)',
        alert: 'Comandante: Atenção! Avistamos o Planeta Marte — aviso: cuidado com o desafio das tempestades e batalhas no espaço!'
      },
      {
        name: 'Júpiter',
        theme: 'jupiter',
        bgTop: '#161b33',
        bgBottom: '#070b14',
        nebula: 'rgba(56, 189, 248, 0.15)',
        alert: 'Comandante: Atenção! Entrando na órbita de Júpiter — aviso: cuidado com o desafio da gravidade e enxame de rochas!'
      },
      {
        name: 'Saturno',
        theme: 'saturn',
        bgTop: '#1b1330',
        bgBottom: '#070b14',
        nebula: 'rgba(192, 132, 252, 0.16)',
        alert: 'Comandante: Atenção! Aproximando dos anéis de Saturno — aviso: cuidado com o desafio dos satélites e naves em alta velocidade!'
      },
      {
        name: 'Netuno',
        theme: 'neptune',
        bgTop: '#071f2b',
        bgBottom: '#070b14',
        nebula: 'rgba(0, 255, 255, 0.15)',
        alert: 'Comandante: Atenção! Setor profundo de Netuno — aviso: cuidado com o desafio final do sistema!'
      }
    ];

    const SHIPS = {
      falcon: { name: 'Falcon V1', speed: 9.5, color: '#00ffff', canopy: '#a5f3fc', wing: '#0284c7', maxShield: 100 },
      interceptor: { name: 'Interceptor', speed: 11.5, color: '#38bdf8', canopy: '#ffd166', wing: '#2563eb', maxShield: 85 },
      titan: { name: 'Titan X', speed: 7.8, color: '#00ffff', canopy: '#67e8f9', wing: '#0e7490', maxShield: 140 }
    };

    const WEAPONS = {
      laser: { name: 'Laser Duplo', cost: 1, cooldown: 75, speed: 12.5, color: '#00ffff' },
      plasma: { name: 'Plasma', cost: 2, cooldown: 105, speed: 11.2, color: '#38bdf8' },
      spread: { name: 'Triplo', cost: 2, cooldown: 115, speed: 11.6, color: '#ffd166' }
    };

    const startTime = performance.now();

    let state = {
      running: true,
      aiMode: false,
      shipKey: 'falcon',
      weaponKey: 'laser',
      shield: 100,
      ammo: 300,
      maxAmmo: 300,
      score: 0,
      planetIndex: 0,
      planetEnteredAt: startTime,
      lastFire: 0,
      lastSpawn: 0,
      lastAsteroidSpawn: 0,
      lastEnemySpawn: 0,
      lastSatelliteSpawn: 0,
      cannonCooldownUntil: 0,
      squadronCooldownUntil: 0,
      bannerTimeout: null,
      toastTimeout: null
    };

    const player = {
      x: 150,
      y: 430,
      w: 48,
      h: 56
    };

    const input = {
      left: false,
      right: false
    };

    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let satellites = [];
    let comets = [];
    let asteroids = [];
    let yellowLights = [];
    let wingmen = [];
    let stars = [];
    let audioCtx = null;

    function showToast(text) {
      const el = document.getElementById('floatToast');
      el.textContent = text;
      el.style.display = 'block';
      clearTimeout(state.toastTimeout);
      state.toastTimeout = setTimeout(() => {
        el.style.display = 'none';
      }, 1500);
    }

    function playShotSound(kind = 'laser') {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioCtx) audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        if (kind === 'cannon') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.exponentialRampToValueAtTime(75, now + 0.16);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.17);
        } else if (kind === 'plasma') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(160, now + 0.11);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } else {
          osc.type = 'square';
          osc.frequency.setValueAtTime(760, now);
          osc.frequency.exponentialRampToValueAtTime(240, now + 0.07);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.075);
        }
      } catch (_) {}
    }

    function addEnergy(amount) {
      state.ammo += amount;
      state.maxAmmo = Math.max(state.maxAmmo, state.ammo);
    }

    function healPlayer(amount) {
      const maxS = SHIPS[state.shipKey].maxShield;
      state.shield = Math.min(maxS, state.shield + amount);
    }

    function spawnYellowLight(x, y) {
      yellowLights.push({
        x,
        y,
        r: 12,
        vy: 2.1,
        heal: 15,
        energy: 25,
        pulse: Math.random() * Math.PI * 2
      });
    }

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(canvas.clientWidth * dpr);
      canvas.height = Math.floor(canvas.clientHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      player.y = canvas.clientHeight - 175;
      player.x = Math.min(Math.max(player.x, 18), Math.max(canvas.clientWidth - 115, 18));
    }

    function initStars() {
      stars = Array.from({ length: 130 }, () => ({
        x: Math.random() * canvas.clientWidth,
        y: Math.random() * canvas.clientHeight,
        r: Math.random() * 2.1 + 0.7,
        v: Math.random() * 2.1 + 0.8,
        color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)]
      }));
    }

    function drawVideoStyleColumns(w, h, now) {
      ctx.save();
      const stepX = 52;
      const stepY = 58;
      const offset = (now * 0.045) % stepY;
      for (let gx = 26; gx < w - 98; gx += stepX) {
        for (let gy = offset; gy < h; gy += stepY) {
          ctx.fillStyle = 'rgba(0, 210, 255, 0.24)';
          ctx.fillRect(gx, gy, 2.5, 2.5);
        }
      }
      ctx.restore();
    }

    function drawStageScenario(w, h, now, planet) {
      if (planet.theme === 'classic') {
        ctx.fillStyle = '#070b14';
        ctx.fillRect(0, 0, w, h);

        const glowGrad = ctx.createRadialGradient(w * 0.55, h * 0.45, 20, w * 0.55, h * 0.45, Math.max(w, h) * 0.5);
        glowGrad.addColorStop(0, 'rgba(255, 179, 71, 0.16)');
        glowGrad.addColorStop(1, 'rgba(7, 11, 20, 0)');
        ctx.fillStyle = glowGrad;
        ctx.fillRect(0, 0, w, h);

        drawVideoStyleColumns(w, h, now);
        return;
      }

      const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
      bgGrad.addColorStop(0, planet.bgTop);
      bgGrad.addColorStop(1, planet.bgBottom);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      const cx = (w - 90) * 0.5;
      const cy = h * 0.34;
      const nebGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(w, h) * 0.45);
      nebGrad.addColorStop(0, planet.nebula);
      nebGrad.addColorStop(1, 'rgba(7, 11, 20, 0)');
      ctx.fillStyle = nebGrad;
      ctx.fillRect(0, 0, w, h);

      drawVideoStyleColumns(w, h, now);

      ctx.save();
      if (planet.theme === 'venus') {
        ctx.strokeStyle = 'rgba(255, 179, 71, 0.16)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
          const yOff = ((now * 0.04 + i * 110) % (h + 80)) - 40;
          ctx.beginPath();
          ctx.moveTo(0, yOff);
          ctx.bezierCurveTo(w * 0.3, yOff - 24, w * 0.6, yOff + 24, w, yOff);
          ctx.stroke();
        }
      } else if (planet.theme === 'mars') {
        ctx.fillStyle = 'rgba(255, 107, 107, 0.08)';
        for (let i = 0; i < 5; i++) {
          const bandY = ((now * 0.05 + i * 130) % (h + 60)) - 30;
          ctx.fillRect(0, bandY, w, 14);
        }
      } else if (planet.theme === 'jupiter') {
        const stripeColors = ['rgba(56, 189, 248, 0.09)', 'rgba(255, 209, 102, 0.07)'];
        for (let i = 0; i < 6; i++) {
          const yPos = ((now * 0.03 + i * 105) % (h + 60)) - 30;
          ctx.fillStyle = stripeColors[i % stripeColors.length];
          ctx.fillRect(0, yPos, w, 20);
        }
      } else if (planet.theme === 'saturn') {
        ctx.strokeStyle = 'rgba(192, 132, 252, 0.22)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(cx, cy, w * 0.44, 24, -0.22, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(0, 210, 255, 0.14)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(cx, cy, w * 0.52, 30, -0.22, 0, Math.PI * 2);
        ctx.stroke();
      } else if (planet.theme === 'neptune') {
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.12)';
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 6; i++) {
          const rx = ((now * 0.06 + i * 75) % (w - 90)) + 12;
          ctx.beginPath();
          ctx.moveTo(rx, 0);
          ctx.lineTo(rx, h);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function showCommanderAlert(message) {
      const banner = document.getElementById('commanderBanner');
      const msgEl = document.getElementById('commanderMsg');
      msgEl.textContent = message;
      banner.style.display = 'block';

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(message);
        utter.lang = 'pt-BR';
        utter.rate = 1.05;
        window.speechSynthesis.speak(utter);
      }

      clearTimeout(state.bannerTimeout);
      state.bannerTimeout = setTimeout(() => {
        banner.style.display = 'none';
      }, 4500);
    }

    function damagePlayer(amount) {
      state.shield -= amount;
      if (state.shield <= 0) {
        state.running = false;
        document.getElementById('finalStats').textContent =
          `Pontuação final: ${state.score} | Etapa alcançada: ${PLANETS[state.planetIndex % PLANETS.length].name}`;
        document.getElementById('gameOverModal').style.display = 'flex';
      }
    }

    function updateHUD(now = performance.now()) {
      const planet = PLANETS[state.planetIndex % PLANETS.length];
      const elapsedInPlanet = now - state.planetEnteredAt;
      const remainingSec = Math.max(0, Math.ceil((PLANET_DURATION_MS - elapsedInPlanet) / 1000));
      const maxShield = SHIPS[state.shipKey].maxShield;
      const shieldPct = Math.max(0, Math.round((state.shield / maxShield) * 100));
      const ammoPct = Math.max(0, Math.min(100, Math.round((state.ammo / state.maxAmmo) * 100)));

      document.getElementById('barShield').style.width = `${shieldPct}%`;
      document.getElementById('valShield').textContent = `${shieldPct}%`;

      document.getElementById('barAmmo').style.width = `${ammoPct}%`;
      document.getElementById('valAmmo').textContent = `${state.ammo}`;

      const cannonBtn = document.getElementById('btnRockCannon');
      const prontoLabel = document.getElementById('prontoLabel');
      const cannonLeft = Math.ceil((state.cannonCooldownUntil - now) / 1000);
      if (cannonLeft > 0) {
        cannonBtn.disabled = true;
        prontoLabel.textContent = `${cannonLeft}s`;
        document.getElementById('barOverdrive').style.width = '30%';
        document.getElementById('valOverdrive').textContent = `${cannonLeft}s`;
      } else {
        cannonBtn.disabled = false;
        prontoLabel.textContent = 'PRONTO';
        document.getElementById('barOverdrive').style.width = '100%';
        document.getElementById('valOverdrive').textContent = 'OK';
      }

      const sqBtn = document.getElementById('btnSquadron');
      const sqLeft = Math.ceil((state.squadronCooldownUntil - now) / 1000);
      if (sqLeft > 0) {
        sqBtn.disabled = true;
        sqBtn.textContent = `${sqLeft}s`;
      } else {
        sqBtn.disabled = false;
        sqBtn.textContent = '✦';
      }

      document.getElementById('hudPlanet').textContent = `DESTINO: ${planet.name.toUpperCase()}`;
      document.getElementById('hudScore').textContent = `PONTOS: ${state.score}`;
      document.getElementById('hudTimer').textContent = `PRÓX: ${remainingSec}s`;

      const tagsEl = document.getElementById('activeTags');
      const tags = [];
      if (cannonLeft > 0) tags.push('<span class="fx-pill gold">OVERDRIVE</span>');
      if (sqLeft > 0) tags.push('<span class="fx-pill">REFORÇO FROTA</span>');
      if (state.weaponKey === 'spread') tags.push('<span class="fx-pill gold">TRIPLO</span>');
      if (state.weaponKey === 'plasma') tags.push('<span class="fx-pill">PLASMA</span>');
      if (state.aiMode) tags.push('<span class="fx-pill gold">PILOTO IA</span>');
      tagsEl.innerHTML = tags.join('');
    }

    function checkPlanetProgression(now) {
      if (now - state.planetEnteredAt >= PLANET_DURATION_MS) {
        state.planetIndex += 1;
        state.planetEnteredAt = now;
        addEnergy(120);
        healPlayer(20);
        const planet = PLANETS[state.planetIndex % PLANETS.length];
        showCommanderAlert(planet.alert);
      }
    }

    function fireWeapon(now) {
      const weapon = WEAPONS[state.weaponKey];
      if (now - state.lastFire < weapon.cooldown) return;

      if (state.ammo <= 0) {
        addEnergy(100);
      }

      const shotCost = Math.min(weapon.cost, state.ammo);
      state.ammo = Math.max(0, state.ammo - shotCost);
      state.lastFire = now;

      playShotSound(state.weaponKey);

      const centerX = player.x + player.w / 2;
      const topY = player.y;

      if (state.weaponKey === 'laser') {
        bullets.push({ x: centerX - 13, y: topY + 6, vx: 0, vy: -weapon.speed, dmg: 1, color: '#00ffff', len: 18 });
        bullets.push({ x: centerX + 13, y: topY + 6, vx: 0, vy: -weapon.speed, dmg: 1, color: '#00ffff', len: 18 });
      } else if (state.weaponKey === 'plasma') {
        bullets.push({ x: centerX, y: topY - 4, vx: 0, vy: -weapon.speed, dmg: 2.5, color: '#38bdf8', len: 24 });
      } else if (state.weaponKey === 'spread') {
        bullets.push({ x: centerX, y: topY, vx: 0, vy: -weapon.speed, dmg: 1.2, color: '#ffd166', len: 20 });
        bullets.push({ x: centerX - 10, y: topY + 5, vx: -2.4, vy: -weapon.speed, dmg: 1.2, color: '#00ffff', len: 18 });
        bullets.push({ x: centerX + 10, y: topY + 5, vx: 2.4, vy: -weapon.speed, dmg: 1.2, color: '#00ffff', len: 18 });
      }
    }

    function triggerRockCannon(now) {
      if (!state.running || now < state.cannonCooldownUntil) return;
      state.cannonCooldownUntil = now + 2200;
      playShotSound('cannon');
      showToast('OVERDRIVE ATIVADO');

      const centerX = player.x + player.w / 2;
      const topY = player.y - 6;

      bullets.push({ x: centerX, y: topY, vx: 0, vy: -14.5, dmg: 10, color: '#ffd166', len: 30, isCannon: true });
      bullets.push({ x: centerX - 18, y: topY + 8, vx: -1.5, vy: -13.5, dmg: 8, color: '#00ffff', len: 26, isCannon: true });
      bullets.push({ x: centerX + 18, y: topY + 8, vx: 1.5, vy: -13.5, dmg: 8, color: '#00ffff', len: 26, isCannon: true });
    }

    function triggerAllySquadron(now) {
      if (!state.running || now < state.squadronCooldownUntil) return;
      state.squadronCooldownUntil = now + 7000;
      showToast('REFORÇO FROTA');

      const playableWidth = Math.max(canvas.clientWidth - 104, 120);
      const count = 4;
      for (let i = 0; i < count; i++) {
        const laneX = 14 + ((playableWidth - 32) / (count - 1)) * i;
        wingmen.push({
          x: laneX,
          y: canvas.clientHeight + 25 + i * 14,
          targetY: player.y - 75 - (i % 2) * 28,
          w: 28,
          h: 32,
          vx: (i % 2 === 0 ? 1 : -1) * 5.2,
          lastShot: now,
          expiresAt: now + 6500
        });
      }
    }

    function runAiPilot(now, w) {
      const ship = SHIPS[state.shipKey];
      const cx = player.x + player.w / 2;
      const minX = 12;
      const maxX = Math.max(w - 100 - player.w, minX);

      let danger = 0;
      for (const c of comets) {
        if (c.y > player.y - 210 && c.y < player.y + 40) {
          const dx = c.x - cx;
          if (Math.abs(dx) < c.r + 36) {
            danger += dx >= 0 ? -1.4 : 1.4;
          }
        }
      }
      for (const a of asteroids) {
        if (a.y > player.y - 210 && a.y < player.y + 40) {
          const dx = a.x - cx;
          if (Math.abs(dx) < a.r + 36) {
            danger += dx >= 0 ? -1.5 : 1.5;
          }
        }
      }
      for (const eb of enemyBullets) {
        if (eb.y > player.y - 190 && eb.y < player.y + 30) {
          const dx = eb.x - cx;
          if (Math.abs(dx) < eb.r + 28) {
            danger += dx >= 0 ? -1.6 : 1.6;
          }
        }
      }

      if (Math.abs(danger) > 0.25) {
        player.x += Math.sign(danger) * ship.speed;
      } else if (yellowLights.length > 0) {
        const targetLight = yellowLights[0];
        const diff = targetLight.x - cx;
        if (Math.abs(diff) > 6) {
          player.x += Math.sign(diff) * ship.speed * 0.85;
        }
      } else if (comets.length > 0) {
        const targetComet = comets[0];
        const diff = targetComet.x - cx;
        if (Math.abs(diff) > 8) {
          player.x += Math.sign(diff) * ship.speed * 0.7;
        }
      }

      player.x = Math.min(Math.max(player.x, minX), maxX);

      if (now >= state.cannonCooldownUntil && comets.length + enemies.length + asteroids.length >= 4) {
        triggerRockCannon(now);
      }
      if (now >= state.squadronCooldownUntil && comets.length + enemies.length + asteroids.length >= 5) {
        triggerAllySquadron(now);
      }
    }

    function spawnAsteroid(now) {
      const difficulty = state.planetIndex;
      const spawnInterval = Math.max(650, 1550 - difficulty * 160);
      if (now - state.lastAsteroidSpawn < spawnInterval) return;
      state.lastAsteroidSpawn = now;

      const playableWidth = Math.max(canvas.clientWidth - 114, 100);
      const startX = Math.random() * playableWidth + 20;
      const startY = -24;
      const targetX = player.x + player.w / 2 + (Math.random() - 0.5) * 60;
      const targetY = player.y + player.h / 2;
      const dx = targetX - startX;
      const dy = Math.max(120, targetY - startY);
      const speed = 3.2 + difficulty * 0.65 + Math.random() * 1.2;
      const len = Math.hypot(dx, dy) || 1;

      asteroids.push({
        x: startX,
        y: startY,
        r: Math.random() * 7 + 12,
        vx: (dx / len) * speed,
        vy: (dy / len) * speed,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.09,
        hp: 1.5 + Math.floor(difficulty / 2)
      });
    }

    function spawnEnemyShip(now) {
      const difficulty = state.planetIndex;
      const spawnInterval = Math.max(1050, 2400 - difficulty * 240);
      if (now - state.lastEnemySpawn < spawnInterval) return;
      state.lastEnemySpawn = now;

      const playableWidth = Math.max(canvas.clientWidth - 114, 100);
      const w = 36;
      const h = 38;
      enemies.push({
        x: Math.random() * playableWidth + 14,
        y: -h,
        targetY: 85 + Math.random() * 140,
        w,
        h,
        vx: (Math.random() < 0.5 ? -1 : 1) * (1.6 + difficulty * 0.35),
        vy: 2.2,
        hp: 2 + Math.floor(difficulty / 2),
        lastShot: now + 400
      });
    }

    function spawnSatellite(now) {
      const difficulty = state.planetIndex;
      const spawnInterval = Math.max(1800, 3600 - difficulty * 300);
      if (now - state.lastSatelliteSpawn < spawnInterval) return;
      state.lastSatelliteSpawn = now;

      const playableWidth = Math.max(canvas.clientWidth - 118, 100);
      satellites.push({
        x: Math.random() * playableWidth + 24,
        y: -26,
        targetY: 60 + Math.random() * 110,
        r: 15,
        vx: (Math.random() < 0.5 ? -1 : 1) * (1.3 + difficulty * 0.25),
        vy: 1.9,
        angle: 0,
        hp: 2 + Math.floor(difficulty / 2),
        lastShot: now + 600
      });
    }

    function spawnComet(now) {
      const difficulty = state.planetIndex;
      const spawnInterval = Math.max(260, 820 - difficulty * 110);
      if (now - state.lastSpawn < spawnInterval) return;
      state.lastSpawn = now;

      const playableWidth = Math.max(canvas.clientWidth - 114, 120);
      const radius = Math.random() * 11 + 13;
      const baseSpeed = 2.4 + difficulty * 0.75 + Math.random() * 1.6;
      const driftX = (Math.random() - 0.5) * 1.1;
      const hp = 1 + Math.floor(difficulty / 2);
      const color = ROCK_COLORS[Math.floor(Math.random() * ROCK_COLORS.length)];

      comets.push({
        x: Math.random() * playableWidth + 24,
        y: -radius * 2,
        r: radius,
        vx: driftX,
        vy: baseSpeed,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.06,
        color,
        hp
      });
    }

    function drawAsteroid(a) {
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.angle);
      ctx.fillStyle = 'rgba(251, 113, 133, 0.2)';
      ctx.strokeStyle = '#fb7185';
      ctx.shadowColor = '#fb7185';
      ctx.shadowBlur = 7;
      ctx.lineWidth = 2;

      ctx.beginPath();
      const verts = 6;
      for (let i = 0; i < verts; i++) {
        const ang = (i / verts) * Math.PI * 2;
        const rad = a.r * (i % 2 === 0 ? 1.05 : 0.78);
        const px = Math.cos(ang) * rad;
        const py = Math.sin(ang) * rad;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawYellowLight(light, now) {
      const glow = 1 + Math.sin(now * 0.01 + light.pulse) * 0.22;
      const rad = light.r * glow;

      ctx.save();
      const grad = ctx.createRadialGradient(light.x, light.y, 2, light.x, light.y, rad * 2.2);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.35, '#ffe066');
      grad.addColorStop(0.75, 'rgba(255, 209, 102, 0.45)');
      grad.addColorStop(1, 'rgba(255, 209, 102, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(light.x, light.y, rad * 2.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fff3b0';
      ctx.beginPath();
      ctx.arc(light.x, light.y, rad * 0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawSatellite(sat) {
      ctx.save();
      ctx.translate(sat.x, sat.y);
      ctx.rotate(sat.angle);

      ctx.fillStyle = 'rgba(0, 210, 255, 0.22)';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.6;
      ctx.fillRect(-sat.r - 12, -5, 10, 10);
      ctx.strokeRect(-sat.r - 12, -5, 10, 10);
      ctx.fillRect(sat.r + 2, -5, 10, 10);
      ctx.strokeRect(sat.r + 2, -5, 10, 10);

      ctx.fillStyle = '#0d1117';
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, sat.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ff4d6d';
      ctx.beginPath();
      ctx.arc(0, 4, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawEnemyShip(e) {
      const cx = e.x + e.w / 2;
      ctx.save();
      ctx.strokeStyle = '#ff4d6d';
      ctx.fillStyle = 'rgba(255, 77, 109, 0.14)';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(cx, e.y + e.h);
      ctx.lineTo(e.x + e.w, e.y);
      ctx.lineTo(cx, e.y + 10);
      ctx.lineTo(e.x, e.y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ff4d6d';
      ctx.beginPath();
      ctx.arc(cx, e.y + e.h * 0.45, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawComet(c) {
      ctx.save();
      const tailGrad = ctx.createLinearGradient(c.x, c.y, c.x - c.vx * 18, c.y - c.r * 3.4);
      tailGrad.addColorStop(0, c.color + '88');
      tailGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = tailGrad;
      ctx.beginPath();
      ctx.moveTo(c.x - c.r * 0.85, c.y);
      ctx.lineTo(c.x - c.vx * 18, c.y - c.r * 3.4);
      ctx.lineTo(c.x + c.r * 0.85, c.y);
      ctx.closePath();
      ctx.fill();

      ctx.translate(c.x, c.y);
      ctx.rotate(c.angle);
      ctx.fillStyle = c.color + '33';
      ctx.strokeStyle = c.color;
      ctx.shadowColor = c.color;
      ctx.shadowBlur = 8;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      const sides = 7;
      for (let i = 0; i < sides; i++) {
        const a = (i / sides) * Math.PI * 2;
        const rad = c.r * (i % 2 === 0 ? 1 : 0.82);
        const px = Math.cos(a) * rad;
        const py = Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(-c.r * 0.22, -c.r * 0.15, c.r * 0.28, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawShip() {
      const ship = SHIPS[state.shipKey];
      const mainColor = state.aiMode ? '#ffd166' : ship.color;
      const cx = player.x + player.w / 2;
      const topY = player.y;
      const botY = player.y + player.h;

      ctx.save();
      ctx.shadowColor = mainColor;
      ctx.shadowBlur = 10;

      const flameLen = 9 + Math.random() * 7;
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.moveTo(cx - 12, botY - 4);
      ctx.lineTo(cx - 8, botY + flameLen);
      ctx.lineTo(cx - 4, botY - 4);
      ctx.moveTo(cx + 4, botY - 4);
      ctx.lineTo(cx + 8, botY + flameLen);
      ctx.lineTo(cx + 12, botY - 4);
      ctx.fill();

      ctx.fillStyle = ship.wing;
      ctx.strokeStyle = mainColor;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(cx - 8, topY + 22);
      ctx.lineTo(player.x - 4, botY - 2);
      ctx.lineTo(cx - 10, botY - 8);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + 8, topY + 22);
      ctx.lineTo(player.x + player.w + 4, botY - 2);
      ctx.lineTo(cx + 10, botY - 8);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0d1117';
      ctx.strokeStyle = mainColor;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(cx, topY - 2);
      ctx.lineTo(cx + 12, topY + 24);
      ctx.lineTo(cx + 9, botY - 4);
      ctx.lineTo(cx - 9, botY - 4);
      ctx.lineTo(cx - 12, topY + 24);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.fillStyle = ship.canopy;
      ctx.beginPath();
      ctx.ellipse(cx, topY + 20, 4.5, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#00ffff';
      ctx.beginPath();
      ctx.arc(player.x - 4, botY - 2, 2.5, 0, Math.PI * 2);
      ctx.arc(player.x + player.w + 4, botY - 2, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawWingman(wg) {
      const cx = wg.x + wg.w / 2;
      const topY = wg.y;
      const botY = wg.y + wg.h;

      ctx.save();
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 7;

      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.moveTo(cx - 3, botY - 2);
      ctx.lineTo(cx, botY + 6 + Math.random() * 4);
      ctx.lineTo(cx + 3, botY - 2);
      ctx.fill();

      ctx.fillStyle = '#092032';
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(cx, topY);
      ctx.lineTo(wg.x + wg.w, botY - 4);
      ctx.lineTo(cx, botY - 9);
      ctx.lineTo(wg.x, botY - 4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#7dd3fc';
      ctx.beginPath();
      ctx.arc(cx, topY + 12, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function loop(now) {
      if (!state.running) return;

      checkPlanetProgression(now);

      const planet = PLANETS[state.planetIndex % PLANETS.length];
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      drawStageScenario(w, h, now, planet);

      for (const s of stars) {
        s.y += s.v + state.planetIndex * 0.35;
        if (s.y > h) {
          s.y = 0;
          s.x = Math.random() * w;
          s.color = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];
        }
        ctx.save();
        ctx.fillStyle = s.color;
        ctx.shadowColor = s.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      const ship = SHIPS[state.shipKey];
      if (state.aiMode) {
        runAiPilot(now, w);
      } else {
        if (input.left) player.x -= ship.speed;
        if (input.right) player.x += ship.speed;
        player.x = Math.min(Math.max(player.x, 8), Math.max(w - 96 - player.w, 8));
      }

      fireWeapon(now);
      spawnComet(now);
      spawnAsteroid(now);
      spawnEnemyShip(now);
      spawnSatellite(now);

      for (let i = wingmen.length - 1; i >= 0; i--) {
        const wg = wingmen[i];
        if (now > wg.expiresAt) {
          wingmen.splice(i, 1);
          continue;
        }
        if (wg.y > wg.targetY) {
          wg.y -= 8.5;
        } else {
          wg.y = wg.targetY + Math.sin(now / 120 + i) * 7;
          wg.x += wg.vx;
          if (wg.x < 10 || wg.x + wg.w > w - 98) {
            wg.vx *= -1;
          }
        }

        if (now - wg.lastShot > 125) {
          wg.lastShot = now;
          playShotSound('laser');
          bullets.push({
            x: wg.x + wg.w / 2,
            y: wg.y,
            vx: 0,
            vy: -13,
            dmg: 1.8,
            color: '#00ffff',
            len: 16
          });
        }

        drawWingman(wg);
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        ctx.save();
        ctx.strokeStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 8;
        ctx.lineWidth = b.isCannon ? 5 : 3;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x - b.vx * 1.5, b.y + (b.len || 16));
        ctx.stroke();
        ctx.restore();

        if (b.y < -35) bullets.splice(i, 1);
      }

      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.x += a.vx;
        a.y += a.vy;
        a.angle += a.spin;

        drawAsteroid(a);

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const hitR = (b.isCannon ? 10 : 5) + a.r;
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          if (dx * dx + dy * dy <= hitR * hitR) {
            a.hp -= b.dmg;
            if (!b.isCannon) bullets.splice(j, 1);
            if (a.hp <= 0) {
              state.score += 20;
              healPlayer(6);
              asteroids.splice(i, 1);
              break;
            }
          }
        }

        if (!asteroids[i]) continue;

        const playerCx = player.x + player.w / 2;
        const playerCy = player.y + player.h / 2;
        const distX = Math.abs(a.x - playerCx);
        const distY = Math.abs(a.y - playerCy);
        const hitPlayer = distX < player.w * 0.42 + a.r && distY < player.h * 0.42 + a.r;

        if (hitPlayer) {
          asteroids.splice(i, 1);
          damagePlayer(14);
          if (!state.running) return;
          continue;
        }

        if (a.y > h + 40 || a.x < -40 || a.x > w + 40) {
          asteroids.splice(i, 1);
        }
      }

      for (let i = yellowLights.length - 1; i >= 0; i--) {
        const light = yellowLights[i];
        light.y += light.vy;
        drawYellowLight(light, now);

        const hitPlayer =
          light.x + light.r > player.x &&
          light.x - light.r < player.x + player.w &&
          light.y + light.r > player.y &&
          light.y - light.r < player.y + player.h;

        if (hitPlayer) {
          healPlayer(light.heal);
          addEnergy(light.energy);
          showToast(`+${light.energy}% ENERGIA`);
          yellowLights.splice(i, 1);
          continue;
        }

        if (light.y > h + 30) {
          yellowLights.splice(i, 1);
        }
      }

      for (let i = satellites.length - 1; i >= 0; i--) {
        const sat = satellites[i];
        if (sat.y < sat.targetY) {
          sat.y += sat.vy;
        } else {
          sat.x += sat.vx;
          if (sat.x < sat.r + 16 || sat.x + sat.r + 16 > w - 98) {
            sat.vx *= -1;
          }
        }
        sat.angle += 0.03;

        const satFireInterval = Math.max(950, 1800 - state.planetIndex * 150);
        if (now - sat.lastShot > satFireInterval) {
          sat.lastShot = now;
          const playerCx = player.x + player.w / 2;
          const aimX = Math.max(-2.6, Math.min(2.6, (playerCx - sat.x) * 0.014));
          enemyBullets.push({
            x: sat.x,
            y: sat.y + sat.r,
            vx: aimX,
            vy: 5.5 + state.planetIndex * 0.45,
            r: 4.5,
            color: '#ffd166',
            dmg: 10 + state.planetIndex * 2
          });
          if (enemies.length > 0) {
            const targetEnemy = enemies[0];
            const ex = targetEnemy.x + targetEnemy.w / 2;
            enemyBullets.push({
              x: sat.x,
              y: sat.y + sat.r,
              vx: Math.max(-2.5, Math.min(2.5, (ex - sat.x) * 0.015)),
              vy: 5.0,
              r: 4,
              color: '#38bdf8',
              dmg: 4
            });
          }
        }

        drawSatellite(sat);

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const hitR = (b.isCannon ? 10 : 5) + sat.r;
          const dx = b.x - sat.x;
          const dy = b.y - sat.y;
          if (dx * dx + dy * dy <= hitR * hitR) {
            sat.hp -= b.dmg;
            if (!b.isCannon) bullets.splice(j, 1);
            if (sat.hp <= 0) {
              state.score += 35;
              addEnergy(15);
              spawnYellowLight(sat.x, sat.y);
              satellites.splice(i, 1);
              break;
            }
          }
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.y < e.targetY) {
          e.y += e.vy;
        } else {
          e.x += e.vx;
          if (e.x < 10 || e.x + e.w > w - 98) {
            e.vx *= -1;
          }
        }

        const fireInterval = Math.max(700, 1450 - state.planetIndex * 140);
        if (now - e.lastShot > fireInterval) {
          e.lastShot = now;
          const enemyCx = e.x + e.w / 2;
          const playerCx = player.x + player.w / 2;
          const aimX = Math.max(-2.2, Math.min(2.2, (playerCx - enemyCx) * 0.012));
          enemyBullets.push({
            x: enemyCx,
            y: e.y + e.h,
            vx: aimX,
            vy: 5.2 + state.planetIndex * 0.45,
            r: 4.5,
            color: '#ff4d6d',
            dmg: 10 + state.planetIndex * 2
          });
        }

        for (let k = enemies.length - 1; k >= 0; k--) {
          if (k === i) continue;
          const other = enemies[k];
          if (e.x < other.x + other.w && e.x + e.w > other.x && e.y < other.y + other.h && e.y + e.h > other.y) {
            other.hp -= 1;
            e.vx *= -1;
            if (other.hp <= 0) {
              enemies.splice(k, 1);
              if (k < i) i--;
            }
          }
        }

        for (let sIdx = satellites.length - 1; sIdx >= 0; sIdx--) {
          const sat = satellites[sIdx];
          if (e.x < sat.x + sat.r && e.x + e.w > sat.x - sat.r && e.y < sat.y + sat.r && e.y + e.h > sat.y - sat.r) {
            sat.hp -= 1;
            e.hp -= 1;
            if (sat.hp <= 0) satellites.splice(sIdx, 1);
            if (e.hp <= 0) {
              enemies.splice(i, 1);
              break;
            }
          }
        }

        if (!enemies[i]) continue;

        drawEnemyShip(e);

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const hitPad = b.isCannon ? 10 : 5;
          if (
            b.x + hitPad > e.x &&
            b.x - hitPad < e.x + e.w &&
            b.y + hitPad > e.y &&
            b.y - hitPad < e.y + e.h
          ) {
            e.hp -= b.dmg;
            if (!b.isCannon) bullets.splice(j, 1);
            if (e.hp <= 0) {
              state.score += 40;
              addEnergy(15);
              enemies.splice(i, 1);
              break;
            }
          }
        }

        if (!enemies[i]) continue;

        const hitPlayer =
          player.x < e.x + e.w &&
          player.x + player.w > e.x &&
          player.y < e.y + e.h &&
          player.y + player.h > e.y;

        if (hitPlayer) {
          enemies.splice(i, 1);
          damagePlayer(20 + state.planetIndex * 3);
          if (!state.running) return;
        }
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;

        ctx.save();
        ctx.fillStyle = eb.color || '#ff4d6d';
        ctx.shadowColor = eb.color || '#ff4d6d';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const hitPlayer =
          eb.x + eb.r > player.x &&
          eb.x - eb.r < player.x + player.w &&
          eb.y + eb.r > player.y &&
          eb.y - eb.r < player.y + player.h;

        if (hitPlayer) {
          enemyBullets.splice(i, 1);
          damagePlayer(eb.dmg);
          if (!state.running) return;
          continue;
        }

        if (eb.y > h + 30) enemyBullets.splice(i, 1);
      }

      for (let i = comets.length - 1; i >= 0; i--) {
        const c = comets[i];
        c.x += c.vx;
        c.y += c.vy;
        c.angle += c.spin;

        if (c.x < c.r + 6 || c.x > w - 98 - c.r) {
          c.vx *= -1;
        }

        drawComet(c);

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const hitRadius = (b.isCannon ? 10 : 5) + c.r;
          const dx = b.x - c.x;
          const dy = b.y - c.y;
          if (dx * dx + dy * dy <= hitRadius * hitRadius) {
            c.hp -= b.dmg;
            if (!b.isCannon) {
              bullets.splice(j, 1);
            }
            if (c.hp <= 0) {
              state.score += 25;
              addEnergy(15);
              spawnYellowLight(c.x, c.y);
              comets.splice(i, 1);
              break;
            }
          }
        }

        if (!comets[i]) continue;

        const playerCx = player.x + player.w / 2;
        const playerCy = player.y + player.h / 2;
        const distX = Math.abs(c.x - playerCx);
        const distY = Math.abs(c.y - playerCy);
        const collided = distX < player.w * 0.42 + c.r && distY < player.h * 0.42 + c.r;

        if (collided) {
          comets.splice(i, 1);
          damagePlayer(22 + state.planetIndex * 3);
          if (!state.running) return;
          continue;
        }

        if (c.y > h + 40) {
          state.score += 5;
          comets.splice(i, 1);
        }
      }

      drawShip();
      updateHUD(now);
      requestAnimationFrame(loop);
    }

    document.querySelectorAll('[data-ship]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-ship]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        state.shipKey = btn.dataset.ship;
        state.shield = Math.min(SHIPS[state.shipKey].maxShield, Math.max(state.shield, 50));
      });
    });

    document.querySelectorAll('[data-weapon]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-weapon]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        state.weaponKey = btn.dataset.weapon;
      });
    });

    document.getElementById('btnAiMode').addEventListener('click', (e) => {
      state.aiMode = !state.aiMode;
      e.currentTarget.classList.toggle('active', state.aiMode);
      e.currentTarget.innerHTML = state.aiMode ? 'PILOTO IA<br>LIGADO' : 'PILOTO IA<br>DESLIGADO';
    });

    document.getElementById('btnRockCannon').addEventListener('click', () => {
      triggerRockCannon(performance.now());
    });

    document.getElementById('btnSquadron').addEventListener('click', () => {
      triggerAllySquadron(performance.now());
    });

    function bindHold(el, prop) {
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        state.aiMode = false;
        const aiBtn = document.getElementById('btnAiMode');
        aiBtn.classList.remove('active');
        aiBtn.innerHTML = 'PILOTO IA<br>DESLIGADO';
        input[prop] = true;
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => {
        el.addEventListener(ev, () => {
          input[prop] = false;
        });
      });
    }

    bindHold(document.getElementById('btnLeft'), 'left');
    bindHold(document.getElementById('btnRight'), 'right');

    canvas.addEventListener('pointermove', (e) => {
      if (!state.aiMode && (e.buttons > 0 || e.pointerType === 'touch')) {
        const w = canvas.clientWidth;
        player.x = Math.min(Math.max(e.clientX - player.w / 2, 8), Math.max(w - 96 - player.w, 8));
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') input.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') input.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') input.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') input.right = false;
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
      const now = performance.now();
      state.running = true;
      state.score = 0;
      state.planetIndex = 0;
      state.planetEnteredAt = now;
      state.ammo = 300;
      state.maxAmmo = 300;
      state.shield = SHIPS[state.shipKey].maxShield;
      state.cannonCooldownUntil = 0;
      state.squadronCooldownUntil = 0;
      bullets = [];
      enemyBullets = [];
      enemies = [];
      satellites = [];
      comets = [];
      asteroids = [];
      yellowLights = [];
      document.getElementById('gameOverModal').style.display = 'none';
      showCommanderAlert(PLANETS[0].alert);
      requestAnimationFrame(loop);
    });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    initStars();
    updateHUD();
    showCommanderAlert(PLANETS[0].alert);
    requestAnimationFrame(loop);
  </script>
