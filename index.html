<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070b14">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Jornada Espacial — Comandante de Frota</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #070b14;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #e2e8f0;
    }

    canvas#game-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      touch-action: none;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .hud-box {
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid #00d2ff;
      border-radius: 10px;
      padding: 6px 12px;
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.25);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .cyan { color: #00ffff; }
    .gold { color: #fbbf24; }
    .danger { color: #f87171; }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(7, 11, 20, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .hidden { display: none !important; }

    .card {
      background: #0d1117;
      border: 1px solid #00d2ff;
      border-radius: 16px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.3);
    }

    h1 {
      font-size: 24px;
      color: #00ffff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }

    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .stats-row {
      display: flex;
      justify-content: space-around;
      background: #070b14;
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .stat-item span {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .stat-item strong {
      font-size: 18px;
      color: #00ffff;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #00d2ff, #00ffff);
      color: #070b14;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 210, 255, 0.5);
      margin-bottom: 10px;
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      width: 100%;
      padding: 11px;
      background: transparent;
      color: #00ffff;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid #00d2ff;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <!-- HUD Superior -->
  <div id="hud" class="hidden">
    <div class="hud-box">PONTOS: <span id="score-val" class="cyan">0</span></div>
    <div class="hud-box">NÍVEL: <span id="level-val" class="gold">1</span></div>
    <div class="hud-box">ESCUDO: <span id="hp-val" class="cyan">100%</span></div>
  </div>

  <!-- Tela Inicial -->
  <div id="start-screen" class="overlay">
    <div class="card">
      <h1>Jornada Espacial</h1>
      <p>Deslize o dedo na tela para pilotar sua nave estelar, destruir asteroides e coletar cristais de energia.</p>
      <div class="stats-row">
        <div class="stat-item">
          <span>Recorde</span>
          <strong id="best-score-menu">0</strong>
        </div>
        <div class="stat-item">
          <span>Cristais</span>
          <strong id="crystals-menu" class="gold">0</strong>
        </div>
      </div>
      <button type="button" class="btn-primary" onclick="startGame()">Iniciar Missão</button>
      <button type="button" class="btn-secondary" onclick="upgradeWeapon()">Melhorar Canhão (<span id="upgrade-cost">50</span> 💎)</button>
    </div>
  </div>

  <!-- Tela Game Over -->
  <div id="gameover-screen" class="overlay hidden">
    <div class="card">
      <h1 style="color: #f87171;">Nave Destruída</h1>
      <p>Sua frota sofreu danos críticos no setor profundo.</p>
      <div class="stats-row">
        <div class="stat-item">
          <span>Pontuação</span>
          <strong id="final-score">0</strong>
        </div>
        <div class="stat-item">
          <span>Recorde</span>
          <strong id="best-score-over">0</strong>
        </div>
      </div>
      <button type="button" class="btn-primary" onclick="startGame()">Jogar Novamente</button>
      <button type="button" class="btn-secondary" onclick="backToMenu()">Hangar Principal</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    // Dados salvos localmente
    let bestScore = parseInt(localStorage.getItem('je_best') || '0', 10);
    let crystals = parseInt(localStorage.getItem('je_crystals') || '0', 10);
    let weaponLevel = parseInt(localStorage.getItem('je_weapon') || '1', 10);

    function updateMenuUI() {
      document.getElementById('best-score-menu').textContent = bestScore;
      document.getElementById('crystals-menu').textContent = crystals;
      document.getElementById('upgrade-cost').textContent = weaponLevel * 50;
    }
    updateMenuUI();

    function upgradeWeapon() {
      const cost = weaponLevel * 50;
      if (crystals >= cost) {
        crystals -= cost;
        weaponLevel++;
        localStorage.setItem('je_crystals', crystals);
        localStorage.setItem('je_weapon', weaponLevel);
        updateMenuUI();
      } else {
        alert('Cristais insuficientes! Colete mais cristais dourados nas missões.');
      }
    }

    // Estado do jogo
    let gameRunning = false;
    let score = 0;
    let level = 1;
    let frameCount = 0;

    const player = {
      x: W / 2,
      y: H - 140,
      targetX: W / 2,
      targetY: H - 140,
      radius: 18,
      hp: 100
    };

    let stars = [];
    let bullets = [];
    let enemies = [];
    let gems = [];
    let particles = [];

    for (let i = 0; i < 65; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 2.5 + 0.5
      });
    }

    // Controles Touch & Mouse
    function handleMove(clientX, clientY) {
      if (!gameRunning) return;
      player.targetX = Math.max(24, Math.min(W - 24, clientX));
      player.targetY = Math.max(70, Math.min(H - 85, clientY - 35));
    }

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    canvas.addEventListener('mousemove', (e) => {
      if (e.buttons === 1) handleMove(e.clientX, e.clientY);
    });

    function startGame() {
      score = 0;
      level = 1;
      frameCount = 0;
      player.hp = 100;
      player.x = W / 2;
      player.y = H - 140;
      player.targetX = W / 2;
      player.targetY = H - 140;
      bullets = [];
      enemies = [];
      gems = [];
      particles = [];

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('gameover-screen').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');

      gameRunning = true;
      updateHUD();
    }

    function backToMenu() {
      document.getElementById('gameover-screen').classList.add('hidden');
      document.getElementById('hud').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
      updateMenuUI();
    }

    function updateHUD() {
      document.getElementById('score-val').textContent = score;
      document.getElementById('level-val').textContent = level;
      const hpEl = document.getElementById('hp-val');
      hpEl.textContent = Math.max(0, player.hp) + '%';
      hpEl.className = player.hp <= 30 ? 'danger' : 'cyan';
    }

    function spawnExplosion(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 4 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 25 + Math.random() * 15,
          color
        });
      }
    }

    function shoot() {
      const speed = -11;
      if (weaponLevel === 1) {
        bullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: speed });
      } else if (weaponLevel === 2) {
        bullets.push({ x: player.x - 10, y: player.y - 16, vx: 0, vy: speed });
        bullets.push({ x: player.x + 10, y: player.y - 16, vx: 0, vy: speed });
      } else {
        bullets.push({ x: player.x, y: player.y - 22, vx: 0, vy: speed });
        bullets.push({ x: player.x - 14, y: player.y - 12, vx: -1.5, vy: speed });
        bullets.push({ x: player.x + 14, y: player.y - 12, vx: 1.5, vy: speed });
      }
    }

    function spawnEnemy() {
      const isBoss = Math.random() < 0.15;
      const radius = isBoss ? 28 : 16 + Math.random() * 8;
      enemies.push({
        x: Math.random() * (W - 60) + 30,
        y: -40,
        radius,
        hp: isBoss ? 3 + level : 1 + Math.floor(level / 2),
        speed: (isBoss ? 1.8 : 2.8) + Math.random() * 1.5 + level * 0.25,
        isBoss
      });
    }

    function loop() {
      ctx.fillStyle = '#070b14';
      ctx.fillRect(0, 0, W, H);

      // Estrelas de fundo
      ctx.fillStyle = '#ffffff';
      for (let s of stars) {
        s.y += s.speed * (gameRunning ? 1.4 : 0.5);
        if (s.y > H) {
          s.y = 0;
          s.x = Math.random() * W;
        }
        ctx.globalAlpha = s.size / 3;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }
      ctx.globalAlpha = 1;

      if (gameRunning) {
        frameCount++;
        level = 1 + Math.floor(score / 300);

        // Movimento suave da nave
        player.x += (player.targetX - player.x) * 0.22;
        player.y += (player.targetY - player.y) * 0.22;

        // Disparo automático
        const fireRate = Math.max(8, 15 - weaponLevel);
        if (frameCount % fireRate === 0) shoot();

        // Surgimento de inimigos
        const spawnRate = Math.max(18, 42 - level * 2);
        if (frameCount % spawnRate === 0) spawnEnemy();

        // Atualizar projéteis
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.x += b.vx;
          b.y += b.vy;
          ctx.fillStyle = '#00ffff';
          ctx.shadowBlur = 8;
          ctx.shadowColor = '#00ffff';
          ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
          ctx.shadowBlur = 0;
          if (b.y < -20) bullets.splice(i, 1);
        }

        // Atualizar inimigos
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          e.y += e.speed;

          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
          ctx.fillStyle = e.isBoss ? '#7f1d1d' : '#1e293b';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = e.isBoss ? '#f87171' : '#00d2ff';
          ctx.stroke();

          // Colisão bala -> inimigo
          for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            const dist = Math.hypot(b.x - e.x, b.y - e.y);
            if (dist < e.radius + 6) {
              bullets.splice(j, 1);
              e.hp--;
              spawnExplosion(b.x, b.y, '#00ffff', 4);
              if (e.hp <= 0) {
                score += e.isBoss ? 50 : 15;
                spawnExplosion(e.x, e.y, e.isBoss ? '#f87171' : '#00d2ff', 14);
                if (Math.random() < 0.45 || e.isBoss) {
                  gems.push({ x: e.x, y: e.y, vy: 2.5 });
                }
                enemies.splice(i, 1);
                updateHUD();
              }
              break;
            }
          }

          if (!enemies[i]) continue;

          // Colisão nave -> inimigo
          const playerDist = Math.hypot(player.x - e.x, player.y - e.y);
          if (playerDist < player.radius + e.radius - 4) {
            player.hp -= e.isBoss ? 40 : 25;
            spawnExplosion(e.x, e.y, '#f87171', 16);
            enemies.splice(i, 1);
            updateHUD();

            if (player.hp <= 0) {
              gameRunning = false;
              if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('je_best', bestScore);
              }
              localStorage.setItem('je_crystals', crystals);
              document.getElementById('final-score').textContent = score;
              document.getElementById('best-score-over').textContent = bestScore;
              document.getElementById('gameover-screen').classList.remove('hidden');
            }
            continue;
          }

          if (e.y > H + 50) enemies.splice(i, 1);
        }

        // Atualizar cristais
        for (let i = gems.length - 1; i >= 0; i--) {
          const g = gems[i];
          g.y += g.vy;
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.moveTo(g.x, g.y - 8);
          ctx.lineTo(g.x + 6, g.y);
          ctx.lineTo(g.x, g.y + 8);
          ctx.lineTo(g.x - 6, g.y);
          ctx.closePath();
          ctx.fill();

          if (Math.hypot(player.x - g.x, player.y - g.y) < player.radius + 14) {
            crystals += 5;
            score += 10;
            spawnExplosion(g.x, g.y, '#fbbf24', 6);
            gems.splice(i, 1);
            updateHUD();
            continue;
          }
          if (g.y > H + 20) gems.splice(i, 1);
        }

        // Desenhar Nave do Jogador
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.beginPath();
        ctx.moveTo(0, -22);
        ctx.lineTo(16, 16);
        ctx.lineTo(0, 9);
        ctx.lineTo(-16, 16);
        ctx.closePath();
        ctx.fillStyle = '#00d2ff';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00ffff';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      }

      // Partículas de explosão
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 35);
        ctx.fillRect(p.x, p.y, 3, 3);
        if (p.life <= 0) particles.splice(i, 1);
      }
      ctx.globalAlpha = 1;

      requestAnimationFrame(loop);
    }

    loop();
  </script>
