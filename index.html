<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jornada Espacial</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00d2ff">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: #070b14;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    #gameWrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #070b14;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #070b14;
    }

    /* HUD superior estilo barras finas da foto */
    .hud-bars {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 98px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
    }

    .bars-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 128px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: #7dd3fc;
    }

    .bar-label {
      width: 56px;
      text-transform: uppercase;
    }

    .bar-track {
      flex: 1;
      height: 6px;
      background: rgba(13, 17, 23, 0.9);
      border: 1px solid rgba(0, 210, 255, 0.35);
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d2ff, #00ffff);
      transition: width 0.12s linear;
    }

    .bar-val {
      font-size: 9px;
      color: #00ffff;
      min-width: 24px;
      text-align: right;
    }

    .stats-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      font-size: 10px;
      font-weight: 800;
      color: #00ffff;
      background: rgba(13, 17, 23, 0.72);
      border: 1px solid rgba(0, 210, 255, 0.28);
      border-radius: 6px;
      padding: 4px 7px;
    }

    .planet-tag {
      font-size: 10px;
      color: #ffd166;
      text-transform: uppercase;
    }

    /* Barra lateral discreta para Naves e Armas */
    .side-dock {
      position: absolute;
      top: 8px;
      right: 6px;
      bottom: 84px;
      width: 86px;
      background: rgba(13, 17, 23, 0.82);
      border: 1px solid rgba(0, 210, 255, 0.32);
      border-radius: 10px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 15;
      overflow-y: auto;
    }

    .dock-title {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #00d2ff;
      text-align: center;
      font-weight: 800;
    }

    .dock-btn {
      background: #070b14;
      border: 1px solid rgba(0, 210, 255, 0.28);
      color: #e6edf3;
      border-radius: 6px;
      padding: 4px 2px;
      font-size: 9px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      line-height: 1.1;
    }

    .dock-btn.active {
      border-color: #00ffff;
      background: rgba(0, 210, 255, 0.2);
      color: #00ffff;
    }

    .divider {
      height: 1px;
      background: rgba(0, 210, 255, 0.2);
      margin: 2px 0;
    }

    /* Aviso do Comandante */
    #commanderBanner {
      position: absolute;
      top: 76px;
      left: 10px;
      right: 100px;
      background: rgba(13, 17, 23, 0.92);
      border-left: 3px solid #00ffff;
      border-top: 1px solid rgba(0, 210, 255, 0.35);
      border-right: 1px solid rgba(0, 210, 255, 0.35);
      border-bottom: 1px solid rgba(0, 210, 255, 0.35);
      border-radius: 8px;
      padding: 7px 9px;
      z-index: 20;
      display: none;
    }

    .cmd-header {
      font-size: 9px;
      font-weight: 800;
      color: #00ffff;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .cmd-text {
      font-size: 11px;
      font-weight: 600;
      color: #e6edf3;
    }

    /* Botões circulares estilo foto + direcionais */
    .controls-bottom {
      position: absolute;
      bottom: 12px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 16;
      pointer-events: none;
    }

    .move-group {
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .pad-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid rgba(0, 210, 255, 0.45);
      background: rgba(13, 17, 23, 0.85);
      color: #00ffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .orb-group {
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: auto;
    }

    .squad-orb {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 1px solid rgba(0, 210, 255, 0.45);
      background: rgba(16, 28, 38, 0.92);
      color: #00ffff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.25);
    }

    .squad-orb:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pronto-orb {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid #00ffff;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.35) 0%, rgba(7, 11, 20, 0.95) 75%);
      color: #ffd166;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 210, 255, 0.65);
    }

    .pronto-orb:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .pronto-bolt {
      font-size: 18px;
      line-height: 1;
    }

    .pronto-txt {
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #e6edf3;
      margin-top: 2px;
    }

    #gameOverModal {
      position: fixed;
      inset: 0;
      background: rgba(7, 11, 20, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 20px;
      text-align: center;
    }

    #gameOverModal h2 {
      color: #00ffff;
      margin: 0 0 10px;
    }

    #gameOverModal p {
      margin: 0 0 18px;
      color: #e6edf3;
    }

    #restartBtn {
      padding: 10px 22px;
      border-radius: 8px;
      border: 1px solid #00ffff;
      background: #00d2ff;
      color: #070b14;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="gameWrapper">
    <canvas id="gameCanvas"></canvas>

    <div class="hud-bars">
      <div class="bars-left">
        <div class="bar-row">
          <span class="bar-label">ESCUDO</span>
          <div class="bar-track"><div class="bar-fill" id="barShield" style="width:100%"></div></div>
          <span class="bar-val" id="valShield">100%</span>
        </div>
        <div class="bar-row">
          <span class="bar-label">ENERGIA</span>
          <div class="bar-track"><div class="bar-fill" id="barAmmo" style="width:100%"></div></div>
          <span class="bar-val" id="valAmmo">300</span>
        </div>
        <div class="bar-row">
          <span class="bar-label">OVERDRIVE</span>
          <div class="bar-track"><div class="bar-fill" id="barOverdrive" style="width:100%"></div></div>
          <span class="bar-val" id="valOverdrive">OK</span>
        </div>
      </div>

      <div class="stats-right">
        <span class="planet-tag" id="hudPlanet">DESTINO: VÊNUS</span>
        <span id="hudScore">PONTOS: 0</span>
        <span id="hudTimer">PRÓX: 60s</span>
      </div>
    </div>

    <div id="commanderBanner">
      <div class="cmd-header">Comandante</div>
      <div class="cmd-text" id="commanderMsg"></div>
    </div>

    <aside class="side-dock">
      <div class="dock-title">Naves</div>
      <button class="dock-btn active" data-ship="falcon">Falcon V1</button>
      <button class="dock-btn" data-ship="interceptor">Interceptor</button>
      <button class="dock-btn" data-ship="titan">Titan X</button>

      <div class="divider"></div>

      <div class="dock-title">Armas</div>
      <button class="dock-btn active" data-weapon="laser">Laser Duplo</button>
      <button class="dock-btn" data-weapon="plasma">Plasma</button>
      <button class="dock-btn" data-weapon="spread">Triplo</button>
    </aside>

    <div class="controls-bottom">
      <div class="move-group">
        <button class="pad-btn" id="btnLeft">◀</button>
        <button class="pad-btn" id="btnRight">▶</button>
      </div>

      <div class="orb-group">
        <button class="squad-orb" id="btnSquadron" title="Esquadrão de Naves">✦</button>
        <button class="pronto-orb" id="btnRockCannon" title="Canhão Rocha">
          <span class="pronto-bolt">⚡</span>
          <span class="pronto-txt" id="prontoLabel">PRONTO</span>
        </button>
      </div>
    </div>
  </div>

  <div id="gameOverModal">
    <h2>Nave Avariada</h2>
    <p id="finalStats">Pontuação final: 0</p>
    <button id="restartBtn">Jogar Novamente</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const PLANET_DURATION_MS = 60000;

    const PLANETS = [
      { name: 'Vênus', alert: 'Comandante: Atenção! Rumo a Vênus — aviso: cuidado com o desafio de calor, cometas e naves hostis!' },
      { name: 'Marte', alert: 'Comandante: Atenção! Avistamos o Planeta Marte — aviso: cuidado com o desafio das tempestades e cometas!' },
      { name: 'Júpiter', alert: 'Comandante: Atenção! Entrando na órbita de Júpiter — aviso: cuidado com o desafio da gravidade e enxame de cometas!' },
      { name: 'Saturno', alert: 'Comandante: Atenção! Aproximando dos anéis de Saturno — aviso: cuidado com o desafio dos cometas em alta velocidade!' },
      { name: 'Netuno', alert: 'Comandante: Atenção! Setor profundo de Netuno — aviso: cuidado com o desafio final do sistema!' }
    ];

    const SHIPS = {
      falcon: { name: 'Falcon V1', speed: 6.2, color: '#00ffff', maxShield: 100 },
      interceptor: { name: 'Interceptor', speed: 7.8, color: '#00d2ff', maxShield: 85 },
      titan: { name: 'Titan X', speed: 4.8, color: '#38bdf8', maxShield: 140 }
    };

    const WEAPONS = {
      laser: { name: 'Laser Duplo', cost: 1, cooldown: 145, speed: 10, color: '#00ffff' },
      plasma: { name: 'Plasma', cost: 2, cooldown: 195, speed: 8.8, color: '#00d2ff' },
      spread: { name: 'Triplo', cost: 2, cooldown: 210, speed: 9.2, color: '#7dd3fc' }
    };

    const startTime = performance.now();

    let state = {
      running: true,
      shipKey: 'falcon',
      weaponKey: 'laser',
      shield: 100,
      ammo: 300,
      maxAmmo: 300,
      score: 0,
      planetIndex: 0,
      planetEnteredAt: startTime,
      lastFire: 0,
      lastSpawn: 0,
      lastEnemySpawn: 0,
      lastAmmoDrop: 0,
      cannonCooldownUntil: 0,
      squadronCooldownUntil: 0,
      bannerTimeout: null
    };

    const player = {
      x: 160,
      y: 470,
      w: 44,
      h: 52
    };

    const input = {
      left: false,
      right: false
    };

    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let comets = [];
    let ammoPickups = [];
    let wingmen = [];
    let stars = [];

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(canvas.clientWidth * dpr);
      canvas.height = Math.floor(canvas.clientHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      player.y = canvas.clientHeight - 130;
      player.x = Math.min(Math.max(player.x, 18), Math.max(canvas.clientWidth - 115, 18));
    }

    function initStars() {
      stars = Array.from({ length: 65 }, () => ({
        x: Math.random() * canvas.clientWidth,
        y: Math.random() * canvas.clientHeight,
        r: Math.random() * 1.7 + 0.6,
        v: Math.random() * 1.8 + 0.8
      }));
    }

    function showCommanderAlert(message) {
      const banner = document.getElementById('commanderBanner');
      const msgEl = document.getElementById('commanderMsg');
      msgEl.textContent = message;
      banner.style.display = 'block';

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(message);
        utter.lang = 'pt-PT';
        utter.rate = 1.05;
        window.speechSynthesis.speak(utter);
      }

      clearTimeout(state.bannerTimeout);
      state.bannerTimeout = setTimeout(() => {
        banner.style.display = 'none';
      }, 4500);
    }

    function damagePlayer(amount) {
      state.shield -= amount;
      if (state.shield <= 0) {
        state.running = false;
        document.getElementById('finalStats').textContent =
          `Pontuação final: ${state.score} | Planeta alcançado: ${PLANETS[state.planetIndex % PLANETS.length].name}`;
        document.getElementById('gameOverModal').style.display = 'flex';
      }
    }

    function updateHUD(now = performance.now()) {
      const planet = PLANETS[state.planetIndex % PLANETS.length];
      const elapsedInPlanet = now - state.planetEnteredAt;
      const remainingSec = Math.max(0, Math.ceil((PLANET_DURATION_MS - elapsedInPlanet) / 1000));
      const maxShield = SHIPS[state.shipKey].maxShield;
      const shieldPct = Math.max(0, Math.round((state.shield / maxShield) * 100));
      const ammoPct = Math.max(0, Math.min(100, Math.round((state.ammo / state.maxAmmo) * 100)));

      document.getElementById('barShield').style.width = `${shieldPct}%`;
      document.getElementById('valShield').textContent = `${shieldPct}%`;

      document.getElementById('barAmmo').style.width = `${ammoPct}%`;
      document.getElementById('valAmmo').textContent = `${state.ammo}`;

      const cannonBtn = document.getElementById('btnRockCannon');
      const prontoLabel = document.getElementById('prontoLabel');
      const cannonLeft = Math.ceil((state.cannonCooldownUntil - now) / 1000);
      if (cannonLeft > 0) {
        cannonBtn.disabled = true;
        prontoLabel.textContent = `${cannonLeft}s`;
        document.getElementById('barOverdrive').style.width = '30%';
        document.getElementById('valOverdrive').textContent = `${cannonLeft}s`;
      } else {
        cannonBtn.disabled = false;
        prontoLabel.textContent = 'PRONTO';
        document.getElementById('barOverdrive').style.width = '100%';
        document.getElementById('valOverdrive').textContent = 'OK';
      }

      const sqBtn = document.getElementById('btnSquadron');
      const sqLeft = Math.ceil((state.squadronCooldownUntil - now) / 1000);
      if (sqLeft > 0) {
        sqBtn.disabled = true;
        sqBtn.textContent = `${sqLeft}s`;
      } else {
        sqBtn.disabled = false;
        sqBtn.textContent = '✦';
      }

      document.getElementById('hudPlanet').textContent = `DESTINO: ${planet.name.toUpperCase()}`;
      document.getElementById('hudScore').textContent = `PONTOS: ${state.score}`;
      document.getElementById('hudTimer').textContent = `PRÓX: ${remainingSec}s`;
    }

    function checkPlanetProgression(now) {
      if (now - state.planetEnteredAt >= PLANET_DURATION_MS) {
        state.planetIndex += 1;
        state.planetEnteredAt = now;
        state.ammo += 120;
        state.maxAmmo = Math.max(state.maxAmmo, state.ammo);
        const maxS = SHIPS[state.shipKey].maxShield;
        state.shield = Math.min(maxS, state.shield + 20);
        const planet = PLANETS[state.planetIndex % PLANETS.length];
        showCommanderAlert(planet.alert);
      }
    }

    function fireWeapon(now) {
      const weapon = WEAPONS[state.weaponKey];
      if (now - state.lastFire < weapon.cooldown) return;

      if (state.ammo <= 0) {
        state.ammo = 100;
      }

      const shotCost = Math.min(weapon.cost, state.ammo);
      state.ammo = Math.max(0, state.ammo - shotCost);
      state.lastFire = now;

      const centerX = player.x + player.w / 2;
      const topY = player.y;

      if (state.weaponKey === 'laser') {
        bullets.push({ x: centerX - 10, y: topY, vx: 0, vy: -weapon.speed, dmg: 1, color: weapon.color });
        bullets.push({ x: centerX + 10, y: topY, vx: 0, vy: -weapon.speed, dmg: 1, color: weapon.color });
      } else if (state.weaponKey === 'plasma') {
        bullets.push({ x: centerX, y: topY - 4, vx: 0, vy: -weapon.speed, dmg: 2.5, color: weapon.color, radius: 6 });
      } else if (state.weaponKey === 'spread') {
        bullets.push({ x: centerX, y: topY, vx: 0, vy: -weapon.speed, dmg: 1.2, color: weapon.color });
        bullets.push({ x: centerX - 8, y: topY + 4, vx: -2.2, vy: -weapon.speed, dmg: 1.2, color: weapon.color });
        bullets.push({ x: centerX + 8, y: topY + 4, vx: 2.2, vy: -weapon.speed, dmg: 1.2, color: weapon.color });
      }
    }

    function triggerRockCannon(now) {
      if (!state.running || now < state.cannonCooldownUntil) return;
      state.cannonCooldownUntil = now + 2200;

      const centerX = player.x + player.w / 2;
      const topY = player.y - 6;

      bullets.push({ x: centerX, y: topY, vx: 0, vy: -13, dmg: 10, color: '#00ffff', radius: 11, isCannon: true });
      bullets.push({ x: centerX - 18, y: topY + 8, vx: -1.4, vy: -12, dmg: 8, color: '#00d2ff', radius: 8, isCannon: true });
      bullets.push({ x: centerX + 18, y: topY + 8, vx: 1.4, vy: -12, dmg: 8, color: '#00d2ff', radius: 8, isCannon: true });
    }

    function triggerAllySquadron(now) {
      if (!state.running || now < state.squadronCooldownUntil) return;
      state.squadronCooldownUntil = now + 7000;

      const playableWidth = Math.max(canvas.clientWidth - 104, 120);
      const count = 4;
      for (let i = 0; i < count; i++) {
        const laneX = 14 + ((playableWidth - 28) / (count - 1)) * i;
        wingmen.push({
          x: laneX,
          y: canvas.clientHeight + 25 + i * 14,
          targetY: player.y - 75 - (i % 2) * 28,
          w: 22,
          h: 26,
          lastShot: now,
          expiresAt: now + 6500
        });
      }
    }

    function spawnEnemyShip(now) {
      const difficulty = state.planetIndex;
      const spawnInterval = Math.max(1100, 2600 - difficulty * 260);
      if (now - state.lastEnemySpawn < spawnInterval) return;
      state.lastEnemySpawn = now;

      const playableWidth = Math.max(canvas.clientWidth - 114, 100);
      const w = 36;
      const h = 38;
      enemies.push({
        x: Math.random() * playableWidth + 14,
        y: -h,
        targetY: 85 + Math.random() * 140,
        w,
        h,
        vx: (Math.random() < 0.5 ? -1 : 1) * (1.5 + difficulty * 0.35),
        vy: 2.2,
        hp: 2 + Math.floor(difficulty / 2),
        lastShot: now + 450
      });
    }

    function spawnComet(now) {
      const difficulty = state.planetIndex;
      const spawnInterval = Math.max(260, 820 - difficulty * 110);
      if (now - state.lastSpawn < spawnInterval) return;
      state.lastSpawn = now;

      const playableWidth = Math.max(canvas.clientWidth - 114, 120);
      const radius = Math.random() * 11 + 13;
      const baseSpeed = 2.4 + difficulty * 0.75 + Math.random() * 1.6;
      const driftX = (Math.random() - 0.5) * 1.1;
      const hp = 1 + Math.floor(difficulty / 2);

      comets.push({
        x: Math.random() * playableWidth + 24,
        y: -radius * 2,
        r: radius,
        vx: driftX,
        vy: baseSpeed,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.06,
        hp
      });
    }

    function spawnAmmoPickup(now) {
      if (now - state.lastAmmoDrop < 4000) return;
      state.lastAmmoDrop = now;
      const playableWidth = Math.max(canvas.clientWidth - 114, 120);
      ammoPickups.push({
        x: Math.random() * playableWidth + 15,
        y: -20,
        r: 11,
        vy: 2.2,
        amount: 90
      });
    }

    function drawRadarGrid(w, h, now) {
      ctx.save();
      ctx.fillStyle = 'rgba(0, 210, 255, 0.22)';
      const stepX = 56;
      const stepY = 56;
      const offset = (now * 0.03) % stepY;
      for (let gx = 24; gx < w - 95; gx += stepX) {
        for (let gy = offset; gy < h; gy += stepY) {
          ctx.fillRect(gx, gy, 2, 2);
        }
      }
      ctx.restore();
    }

    function drawEnemyShip(e) {
      const cx = e.x + e.w / 2;
      ctx.save();
      ctx.strokeStyle = '#ff4d6d';
      ctx.fillStyle = 'rgba(255, 77, 109, 0.14)';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(cx, e.y + e.h);
      ctx.lineTo(e.x + e.w, e.y);
      ctx.lineTo(cx, e.y + 10);
      ctx.lineTo(e.x, e.y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ff4d6d';
      ctx.beginPath();
      ctx.arc(cx, e.y + e.h * 0.45, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawComet(c) {
      ctx.save();
      const tailGrad = ctx.createLinearGradient(c.x, c.y, c.x - c.vx * 18, c.y - c.r * 3.4);
      tailGrad.addColorStop(0, 'rgba(0, 210, 255, 0.45)');
      tailGrad.addColorStop(1, 'rgba(0, 210, 255, 0)');
      ctx.fillStyle = tailGrad;
      ctx.beginPath();
      ctx.moveTo(c.x - c.r * 0.85, c.y);
      ctx.lineTo(c.x - c.vx * 18, c.y - c.r * 3.4);
      ctx.lineTo(c.x + c.r * 0.85, c.y);
      ctx.closePath();
      ctx.fill();

      ctx.translate(c.x, c.y);
      ctx.rotate(c.angle);
      ctx.fillStyle = '#0d1117';
      ctx.strokeStyle = '#00d2ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      const sides = 7;
      for (let i = 0; i < sides; i++) {
        const a = (i / sides) * Math.PI * 2;
        const rad = c.r * (i % 2 === 0 ? 1 : 0.82);
        const px = Math.cos(a) * rad;
        const py = Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawShip() {
      const ship = SHIPS[state.shipKey];
      const cx = player.x + player.w / 2;

      ctx.save();
      ctx.strokeStyle = ship.color;
      ctx.fillStyle = 'rgba(0, 210, 255, 0.14)';
      ctx.lineWidth = 2.2;

      ctx.beginPath();
      ctx.moveTo(cx, player.y);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.lineTo(cx, player.y + player.h - 12);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#00ffff';
      ctx.beginPath();
      ctx.arc(cx, player.y + player.h - 6, 4 + Math.random() * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawWingman(w) {
      const cx = w.x + w.w / 2;
      ctx.save();
      ctx.strokeStyle = '#00ffff';
      ctx.fillStyle = '#0d1117';
      ctx.lineWidth = 1.8;

      ctx.beginPath();
      ctx.moveTo(cx, w.y);
      ctx.lineTo(w.x + w.w, w.y + w.h);
      ctx.lineTo(cx, w.y + w.h - 6);
      ctx.lineTo(w.x, w.y + w.h);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function loop(now) {
      if (!state.running) return;

      checkPlanetProgression(now);

      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.fillStyle = '#070b14';
      ctx.fillRect(0, 0, w, h);

      drawRadarGrid(w, h, now);

      ctx.fillStyle = '#00d2ff';
      for (const s of stars) {
        s.y += s.v + state.planetIndex * 0.35;
        if (s.y > h) {
          s.y = 0;
          s.x = Math.random() * w;
        }
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      const ship = SHIPS[state.shipKey];
      if (input.left) player.x -= ship.speed;
      if (input.right) player.x += ship.speed;
      player.x = Math.min(Math.max(player.x, 8), Math.max(w - 96 - player.w, 8));

      fireWeapon(now);
      spawnComet(now);
      spawnEnemyShip(now);
      spawnAmmoPickup(now);

      for (let i = wingmen.length - 1; i >= 0; i--) {
        const wg = wingmen[i];
        if (now > wg.expiresAt) {
          wingmen.splice(i, 1);
          continue;
        }
        if (wg.y > wg.targetY) {
          wg.y -= 5.5;
        } else {
          wg.y = wg.targetY + Math.sin(now / 180 + i) * 8;
        }

        if (now - wg.lastShot > 240) {
          wg.lastShot = now;
          bullets.push({
            x: wg.x + wg.w / 2,
            y: wg.y,
            vx: 0,
            vy: -10.5,
            dmg: 1.5,
            color: '#00ffff',
            radius: 3.5
          });
        }

        drawWingman(wg);
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        ctx.save();
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius || 3.5, 0, Math.PI * 2);
        ctx.fill();
        if (b.isCannon) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        ctx.restore();

        if (b.y < -30) bullets.splice(i, 1);
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.y < e.targetY) {
          e.y += e.vy;
        } else {
          e.x += e.vx;
          if (e.x < 10 || e.x + e.w > w - 98) {
            e.vx *= -1;
          }
        }

        const fireInterval = Math.max(700, 1450 - state.planetIndex * 140);
        if (now - e.lastShot > fireInterval) {
          e.lastShot = now;
          const enemyCx = e.x + e.w / 2;
          const playerCx = player.x + player.w / 2;
          const aimX = Math.max(-2.2, Math.min(2.2, (playerCx - enemyCx) * 0.012));
          enemyBullets.push({
            x: enemyCx,
            y: e.y + e.h,
            vx: aimX,
            vy: 5.2 + state.planetIndex * 0.45,
            r: 4.5,
            dmg: 10 + state.planetIndex * 2
          });
        }

        drawEnemyShip(e);

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const hitPad = b.radius || 4;
          if (
            b.x + hitPad > e.x &&
            b.x - hitPad < e.x + e.w &&
            b.y + hitPad > e.y &&
            b.y - hitPad < e.y + e.h
          ) {
            e.hp -= b.dmg;
            if (!b.isCannon) bullets.splice(j, 1);
            if (e.hp <= 0) {
              state.score += 40;
              enemies.splice(i, 1);
              break;
            }
          }
        }

        if (!enemies[i]) continue;

        const hitPlayer =
          player.x < e.x + e.w &&
          player.x + player.w > e.x &&
          player.y < e.y + e.h &&
          player.y + player.h > e.y;

        if (hitPlayer) {
          enemies.splice(i, 1);
          damagePlayer(20 + state.planetIndex * 3);
          if (!state.running) return;
        }
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;

        ctx.save();
        ctx.fillStyle = '#ff4d6d';
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const hitPlayer =
          eb.x + eb.r > player.x &&
          eb.x - eb.r < player.x + player.w &&
          eb.y + eb.r > player.y &&
          eb.y - eb.r < player.y + player.h;

        if (hitPlayer) {
          enemyBullets.splice(i, 1);
          damagePlayer(eb.dmg);
          if (!state.running) return;
          continue;
        }

        if (eb.y > h + 30) enemyBullets.splice(i, 1);
      }

      for (let i = ammoPickups.length - 1; i >= 0; i--) {
        const p = ammoPickups[i];
        p.y += p.vy;

        ctx.strokeStyle = '#00ffff';
        ctx.fillStyle = 'rgba(0, 210, 255, 0.2)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        const hitPlayer =
          p.x + p.r > player.x &&
          p.x - p.r < player.x + player.w &&
          p.y + p.r > player.y &&
          p.y - p.r < player.y + player.h;

        if (hitPlayer) {
          state.ammo += p.amount;
          state.maxAmmo = Math.max(state.maxAmmo, state.ammo);
          ammoPickups.splice(i, 1);
          continue;
        }
        if (p.y > h + 30) ammoPickups.splice(i, 1);
      }

      for (let i = comets.length - 1; i >= 0; i--) {
        const c = comets[i];
        c.x += c.vx;
        c.y += c.vy;
        c.angle += c.spin;

        if (c.x < c.r + 6 || c.x > w - 98 - c.r) {
          c.vx *= -1;
        }

        drawComet(c);

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const hitRadius = (b.radius || 4) + c.r;
          const dx = b.x - c.x;
          const dy = b.y - c.y;
          if (dx * dx + dy * dy <= hitRadius * hitRadius) {
            c.hp -= b.dmg;
            if (!b.isCannon) {
              bullets.splice(j, 1);
            }
            if (c.hp <= 0) {
              state.score += 25;
              comets.splice(i, 1);
              break;
            }
          }
        }

        if (!comets[i]) continue;

        const playerCx = player.x + player.w / 2;
        const playerCy = player.y + player.h / 2;
        const distX = Math.abs(c.x - playerCx);
        const distY = Math.abs(c.y - playerCy);
        const collided = distX < player.w * 0.42 + c.r && distY < player.h * 0.42 + c.r;

        if (collided) {
          comets.splice(i, 1);
          damagePlayer(22 + state.planetIndex * 3);
          if (!state.running) return;
          continue;
        }

        if (c.y > h + 40) {
          state.score += 5;
          comets.splice(i, 1);
        }
      }

      drawShip();
      updateHUD(now);
      requestAnimationFrame(loop);
    }

    document.querySelectorAll('[data-ship]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-ship]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        state.shipKey = btn.dataset.ship;
        state.shield = Math.min(SHIPS[state.shipKey].maxShield, Math.max(state.shield, 50));
      });
    });

    document.querySelectorAll('[data-weapon]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-weapon]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        state.weaponKey = btn.dataset.weapon;
      });
    });

    document.getElementById('btnRockCannon').addEventListener('click', () => {
      triggerRockCannon(performance.now());
    });

    document.getElementById('btnSquadron').addEventListener('click', () => {
      triggerAllySquadron(performance.now());
    });

    function bindHold(el, prop) {
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        input[prop] = true;
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => {
        el.addEventListener(ev, () => {
          input[prop] = false;
        });
      });
    }

    bindHold(document.getElementById('btnLeft'), 'left');
    bindHold(document.getElementById('btnRight'), 'right');

    canvas.addEventListener('pointermove', (e) => {
      if (e.buttons > 0 || e.pointerType === 'touch') {
        const w = canvas.clientWidth;
        player.x = Math.min(Math.max(e.clientX - player.w / 2, 8), Math.max(w - 96 - player.w, 8));
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') input.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') input.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') input.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') input.right = false;
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
      const now = performance.now();
      state.running = true;
      state.score = 0;
      state.planetIndex = 0;
      state.planetEnteredAt = now;
      state.ammo = 300;
      state.maxAmmo = 300;
      state.shield = SHIPS[state.shipKey].maxShield;
      state.cannonCooldownUntil = 0;
      state.squadronCooldownUntil = 0;
      bullets = [];
      enemyBullets = [];
      enemies = [];
      comets = [];
      ammoPickups = [];
      wingmen = [];
      document.getElementById('gameOverModal').style.display = 'none';
      showCommanderAlert(PLANETS[0].alert);
      requestAnimationFrame(loop);
    });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    initStars();
    updateHUD();
    showCommanderAlert(PLANETS[0].alert);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
