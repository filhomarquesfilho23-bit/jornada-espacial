<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#070b14" />
  <title>Jornada Espacial - Edição Comandante de Frota</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #070b14;
      color: #f0f9ff;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
    }
    .orbitron {
      font-family: 'Orbitron', sans-serif;
    }
    #game-wrapper {
      position: relative;
      width: 100%;
      height: 100dvh;
      max-width: 540px;
      margin: 0 auto;
      background: radial-gradient(circle at 50% 20%, #0c192c 0%, #070b14 70%, #03050a 100%);
      box-shadow: 0 0 40px rgba(0, 210, 255, 0.15);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* MENU OVERLAY COM ROLAGEM + BOTÃO FIXO */
    #menu-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: rgba(7, 11, 20, 0.94);
      z-index: 20;
    }
    .menu-header {
      padding: 16px 16px 10px;
      text-align: center;
      border-bottom: 1px solid rgba(0, 210, 255, 0.2);
      background: #070b14;
    }
    .menu-header h1 {
      margin: 0;
      font-size: 22px;
      color: #00ffff;
      text-shadow: 0 0 12px rgba(0, 255, 255, 0.6);
      letter-spacing: 1.5px;
    }
    .menu-header p {
      margin: 4px 0 10px;
      font-size: 13px;
      color: #94a3b8;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .stat-pill {
      flex: 1;
      background: #0d1117;
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .stat-pill.cyan { color: #00ffff; }
    .stat-pill.gold { color: #fbbf24; border-color: rgba(251, 191, 36, 0.4); }

    .menu-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 100px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #00d2ff;
      letter-spacing: 1px;
      margin: 8px 0;
      text-transform: uppercase;
    }
    .planet-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .card {
      background: #0d1117;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .card.active {
      border: 1.5px solid #00ffff;
      background: linear-gradient(180deg, rgba(0, 210, 255, 0.16), rgba(13, 17, 23, 0.95));
      box-shadow: 0 0 14px rgba(0, 255, 255, 0.25);
    }
    .card.locked {
      opacity: 0.55;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 15px;
      color: #e2e8f0;
    }
    .badge-mult {
      font-size: 11px;
      color: #f43f5e;
      background: rgba(244, 63, 94, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .card-desc {
      font-size: 12px;
      color: #94a3b8;
      margin: 4px 0;
    }
    .card-bonus {
      font-size: 12px;
      font-weight: 700;
      color: #fbbf24;
    }

    .ship-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ship-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .ship-btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .ship-btn.equipped {
      background: rgba(0, 255, 255, 0.18);
      color: #00ffff;
      border: 1px solid #00ffff;
    }
    .ship-btn.select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
    }
    .ship-btn.buy {
      background: linear-gradient(90deg, #f59e0b, #d97706);
      color: #070b14;
    }

    /* RODAPÉ FIXO COM O BOTÃO DE JOGAR */
    .menu-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(180deg, rgba(7, 11, 20, 0.85) 0%, #070b14 35%);
      border-top: 1px solid rgba(0, 255, 255, 0.25);
      z-index: 30;
    }
    #start-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #00d2ff 0%, #00ffff 100%);
      color: #070b14;
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 0 22px rgba(0, 255, 255, 0.5);
      transition: transform 0.1s;
    }
    #start-btn:active {
      transform: scale(0.97);
    }

    /* HUD DURANTE O JOGO */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      display: none;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(7, 11, 20, 0.9) 0%, transparent 100%);
      pointer-events: none;
      z-index: 10;
    }
    .hud-box {
      font-size: 13px;
      font-weight: 700;
    }
    .hp-bar-bg {
      width: 110px;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
      border: 1px solid rgba(0, 255, 255, 0.3);
    }
    #hp-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #00d2ff, #00ffff);
      transition: width 0.15s;
    }

    /* MODAL FIM DE MISSÃO */
    #end-modal {
      position: absolute;
      inset: 0;
      background: rgba(7, 11, 20, 0.92);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      z-index: 40;
    }
    #end-title {
      font-size: 26px;
      margin: 0 0 8px;
    }
    #end-msg {
      color: #cbd5e1;
      font-size: 16px;
      margin-bottom: 20px;
    }
    #back-menu-btn {
      padding: 14px 28px;
      border-radius: 10px;
      border: none;
      background: #00ffff;
      color: #070b14;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-box">
        <div id="hud-planet" class="orbitron" style="color:#00ffff;">MERCÚRIO</div>
        <div class="hp-bar-bg"><div id="hp-fill"></div></div>
      </div>
      <div class="hud-box" style="text-align:right;">
        <div id="hud-progress" style="color:#e2e8f0;">INIMIGOS: 0/15</div>
        <div id="hud-credits" style="color:#fbbf24;">+CR$ 0</div>
      </div>
    </div>

    <!-- MENU -->
    <div id="menu-screen">
      <div class="menu-header">
        <h1 class="orbitron">JORNADA ESPACIAL</h1>
        <p>Conquiste planetas, desbloqueie naves e sobreviva à frota</p>
        <div class="stats-bar">
          <div class="stat-pill cyan" id="stat-planets">PLANETAS: 1/6</div>
          <div class="stat-pill gold" id="stat-credits">CRÉDITOS: CR$ 150</div>
        </div>
      </div>

      <div class="menu-scroll">
        <div class="section-title">1. Escolha o Planeta (Risco & Recompensa)</div>
        <div class="planet-grid" id="planet-list"></div>

        <div class="section-title">2. Hangar de Naves</div>
        <div class="ship-list" id="ship-list"></div>
      </div>

      <div class="menu-footer">
        <button id="start-btn">🚀 INICIAR MISSÃO</button>
      </div>
    </div>

    <!-- FIM DE PARTIDA -->
    <div id="end-modal">
      <h2 id="end-title" class="orbitron">MISSÃO CONCLUÍDA</h2>
      <p id="end-msg"></p>
      <button id="back-menu-btn">VOLTAR AO HANGAR</button>
    </div>
  </div>

  <script>
    const PLANETS = [
      { id: 0, name: "Mercúrio", mult: "1.0x", desc: "Órbita escaldante. Ideal para coletar recursos.", bonus: 250, hpScale: 1, enemies: 15, color: "#f59e0b" },
      { id: 1, name: "Vênus", mult: "1.3x", desc: "Nuvens ácidas e patrulhas rápidas.", bonus: 450, hpScale: 1.3, enemies: 20, color: "#eab308" },
      { id: 2, name: "Terra", mult: "1.7x", desc: "Bloqueio orbital pesado.", bonus: 750, hpScale: 1.7, enemies: 25, color: "#00d2ff" },
      { id: 3, name: "Marte", mult: "2.1x", desc: "Frota vermelha de elite.", bonus: 1100, hpScale: 2.1, enemies: 30, color: "#ef4444" },
      { id: 4, name: "Júpiter", mult: "2.6x", desc: "Tempestade gravitacional e cruzadores.", bonus: 1700, hpScale: 2.6, enemies: 36, color: "#f97316" },
      { id: 5, name: "Saturno", mult: "3.2x", desc: "Anéis mortais. Desafio supremo.", bonus: 3000, hpScale: 3.2, enemies: 45, color: "#a855f7" }
    ];

    const SHIPS = [
      { id: "falcon", name: "Falcon V1", desc: "Equilibrada • Canhão de Plasma Rápido • HP 100", price: 0, hp: 100, fireRate: 14, damage: 12, spread: 1, color: "#00ffff" },
      { id: "interceptor", name: "Interceptor", desc: "Alta Cadência • Tiro Duplo Paralelo • HP 115", price: 400, hp: 115, fireRate: 11, damage: 10, spread: 2, color: "#38bdf8" },
      { id: "titan", name: "Titan X", desc: "Blindagem Pesada • Impacto Alto • HP 160", price: 950, hp: 160, fireRate: 16, damage: 24, spread: 1, color: "#fbbf24" },
      { id: "valkyrie", name: "Valkyrie Neon", desc: "Tri-Laser em Leque • Limpa Ondas • HP 145", price: 1800, hp: 145, fireRate: 13, damage: 15, spread: 3, color: "#e879f9" },
      { id: "omega", name: "Omega Supreme", desc: "4 Canhões Quânticos • Poder Supremo • HP 210", price: 3200, hp: 210, fireRate: 10, damage: 20, spread: 4, color: "#f43f5e" }
    ];

    let state = JSON.parse(localStorage.getItem("jornada_save_v2")) || {
      credits: 150,
      unlockedPlanets: 1,
      selectedPlanet: 0,
      ownedShips: ["falcon"],
      equippedShip: "falcon"
    };

    function saveState() {
      localStorage.setItem("jornada_save_v2", JSON.stringify(state));
    }

    function renderMenu() {
      document.getElementById("stat-planets").textContent = `PLANETAS: ${state.unlockedPlanets}/${PLANETS.length}`;
      document.getElementById("stat-credits").textContent = `CRÉDITOS: CR$ ${state.credits}`;

      const planetList = document.getElementById("planet-list");
      planetList.innerHTML = "";
      PLANETS.forEach((p, idx) => {
        const unlocked = idx < state.unlockedPlanets;
        const active = state.selectedPlanet === idx;
        const div = document.createElement("div");
        div.className = `card ${active ? "active" : ""} ${!unlocked ? "locked" : ""}`;
        div.innerHTML = `
          <div class="card-top">
            <span>${unlocked ? "" : "🔒 "}${p.name}</span>
            <span class="badge-mult">${p.mult}</span>
          </div>
          <div class="card-desc">${unlocked ? p.desc : `Vença ${PLANETS[idx - 1].name} para liberar`}</div>
          <div class="card-bonus">Bônus: +CR$ ${p.bonus}</div>
        `;
        if (unlocked) {
          div.onclick = () => {
            state.selectedPlanet = idx;
            saveState();
            renderMenu();
          };
        }
        planetList.appendChild(div);
      });

      const shipList = document.getElementById("ship-list");
      shipList.innerHTML = "";
      SHIPS.forEach((s) => {
        const owned = state.ownedShips.includes(s.id);
        const equipped = state.equippedShip === s.id;
        const div = document.createElement("div");
        div.className = `card ship-card ${equipped ? "active" : ""}`;

        let btnClass = "buy";
        let btnText = `CR$ ${s.price}`;
        if (equipped) {
          btnClass = "equipped";
          btnText = "EQUIPADA";
        } else if (owned) {
          btnClass = "select";
          btnText = "EQUIPAR";
        }

        div.innerHTML = `
          <div>
            <div class="card-top" style="color:${s.color};">${s.name}</div>
            <div class="card-desc" style="margin:2px 0 0;">${s.desc}</div>
          </div>
          <button class="ship-btn ${btnClass}">${btnText}</button>
        `;

        div.querySelector("button").onclick = () => {
          if (equipped) return;
          if (owned) {
            state.equippedShip = s.id;
            saveState();
            renderMenu();
          } else if (state.credits >= s.price) {
            state.credits -= s.price;
            state.ownedShips.push(s.id);
            state.equippedShip = s.id;
            saveState();
            renderMenu();
          } else {
            alert("Créditos insuficientes! Complete missões para ganhar mais CR$.");
          }
        };
        shipList.appendChild(div);
      });
    }

    // MOTOR DO JOGO
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let animId = null;
    let gameRunning = false;

    let width = 360, height = 640;
    function resizeCanvas() {
      const rect = document.getElementById("game-wrapper").getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    let player, bullets, enemies, particles, stars, frame, killed, targetKills, earnedCredits, currentPlanet, currentShip;

    function initStars() {
      stars = Array.from({ length: 65 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 2.5 + 0.8
      }));
    }

    function startMission() {
      resizeCanvas();
      currentPlanet = PLANETS[state.selectedPlanet];
      currentShip = SHIPS.find(s => s.id === state.equippedShip) || SHIPS[0];

      player = {
        x: width / 2,
        y: height - 110,
        targetX: width / 2,
        targetY: height - 110,
        r: 20,
        hp: currentShip.hp,
        maxHp: currentShip.hp
      };

      bullets = [];
      enemies = [];
      particles = [];
      frame = 0;
      killed = 0;
      targetKills = currentPlanet.enemies;
      earnedCredits = 0;
      gameRunning = true;

      document.getElementById("menu-screen").style.display = "none";
      document.getElementById("end-modal").style.display = "none";
      document.getElementById("hud").style.display = "flex";
      document.getElementById("hud-planet").textContent = currentPlanet.name.toUpperCase();
      updateHud();

      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    function updateHud() {
      const pct = Math.max(0, (player.hp / player.maxHp) * 100);
      document.getElementById("hp-fill").style.width = pct + "%";
      document.getElementById("hud-progress").textContent = `ALVOS: ${killed}/${targetKills}`;
      document.getElementById("hud-credits").textContent = `+CR$ ${earnedCredits}`;
    }

    function spawnBullets() {
      const s = currentShip;
      if (s.spread === 1) {
        bullets.push({ x: player.x, y: player.y - 22, vx: 0, vy: -11, dmg: s.damage, color: s.color });
      } else if (s.spread === 2) {
        bullets.push({ x: player.x - 10, y: player.y - 18, vx: 0, vy: -11, dmg: s.damage, color: s.color });
        bullets.push({ x: player.x + 10, y: player.y - 18, vx: 0, vy: -11, dmg: s.damage, color: s.color });
      } else if (s.spread === 3) {
        bullets.push({ x: player.x, y: player.y - 22, vx: 0, vy: -11, dmg: s.damage, color: s.color });
        bullets.push({ x: player.x - 12, y: player.y - 16, vx: -1.6, vy: -10.5, dmg: s.damage, color: s.color });
        bullets.push({ x: player.x + 12, y: player.y - 16, vx: 1.6, vy: -10.5, dmg: s.damage, color: s.color });
      } else {
        [-16, -6, 6, 16].forEach((offset, i) => {
          bullets.push({ x: player.x + offset, y: player.y - 18, vx: (i - 1.5) * 0.5, vy: -12, dmg: s.damage, color: s.color });
        });
      }
    }

    function spawnEnemy() {
      const isHeavy = Math.random() < 0.25;
      const r = isHeavy ? 24 : 16;
      const baseHp = isHeavy ? 42 : 18;
      enemies.push({
        x: Math.random() * (width - 60) + 30,
        y: -30,
        r: r,
        hp: Math.round(baseHp * currentPlanet.hpScale),
        vy: (isHeavy ? 1.8 : 2.9) + Math.random() * 1.2,
        vx: (Math.random() - 0.5) * 1.6,
        color: isHeavy ? "#f43f5e" : "#fb923c",
        reward: isHeavy ? 25 : 10
      });
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 24,
          color
        });
      }
    }

    function finishGame(victory) {
      gameRunning = false;
      document.getElementById("hud").style.display = "none";
      const modal = document.getElementById("end-modal");
      const title = document.getElementById("end-title");
      const msg = document.getElementById("end-msg");

      if (victory) {
        const total = earnedCredits + currentPlanet.bonus;
        state.credits += total;
        if (state.selectedPlanet + 1 >= state.unlockedPlanets && state.unlockedPlanets < PLANETS.length) {
          state.unlockedPlanets++;
        }
        saveState();
        title.textContent = "PLANETA CONQUISTADO!";
        title.style.color = "#00ffff";
        msg.innerHTML = `Você limpou a órbita de <b>${currentPlanet.name}</b>!<br>Recompensa total: <b style="color:#fbbf24;">+CR$ ${total}</b>`;
      } else {
        state.credits += earnedCredits;
        saveState();
        title.textContent = "NAVE DESTRUÍDA";
        title.style.color = "#f43f5e";
        msg.innerHTML = `Sua blindagem falhou em <b>${currentPlanet.name}</b>.<br>Você resgatou: <b style="color:#fbbf24;">+CR$ ${earnedCredits}</b>`;
      }
      modal.style.display = "flex";
    }

    function drawShip(x, y, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.shadowBlur = 14;
      ctx.shadowColor = color;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, -24);
      ctx.lineTo(18, 16);
      ctx.lineTo(0, 8);
      ctx.lineTo(-18, 16);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#070b14";
      ctx.beginPath();
      ctx.moveTo(0, -10);
      ctx.lineTo(5, 4);
      ctx.lineTo(-5, 4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function loop() {
      if (!gameRunning) return;
      frame++;
      ctx.clearRect(0, 0, width, height);

      // Estrelas
      ctx.fillStyle = "#94a3b8";
      stars.forEach(st => {
        st.y += st.speed;
        if (st.y > height) { st.y = 0; st.x = Math.random() * width; }
        ctx.fillRect(st.x, st.y, st.size, st.size);
      });

      // Movimento suave da nave
      player.x += (player.targetX - player.x) * 0.25;
      player.y += (player.targetY - player.y) * 0.25;
      player.x = Math.max(24, Math.min(width - 24, player.x));
      player.y = Math.max(60, Math.min(height - 30, player.y));

      // Disparo automático
      if (frame % currentShip.fireRate === 0) spawnBullets();

      // Spawn de inimigos
      const spawnInterval = Math.max(24, 52 - state.selectedPlanet * 5);
      if (frame % spawnInterval === 0 && (killed + enemies.length) < targetKills) {
        spawnEnemy();
      }

      // Tiros
      bullets.forEach((b, i) => {
        b.x += b.vx;
        b.y += b.vy;
        ctx.fillStyle = b.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = b.color;
        ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
        ctx.shadowBlur = 0;
        if (b.y < -20) bullets.splice(i, 1);
      });

      // Inimigos
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x += e.vx;
        e.y += e.vy;
        if (e.x < e.r || e.x > width - e.r) e.vx *= -1;

        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.fillStyle = e.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = e.color;
        ctx.beginPath();
        ctx.moveTo(0, e.r);
        ctx.lineTo(e.r, -e.r * 0.7);
        ctx.lineTo(-e.r, -e.r * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // Colisão tiro x inimigo
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 6) {
            e.hp -= b.dmg;
            bullets.splice(j, 1);
            if (e.hp <= 0) {
              createExplosion(e.x, e.y, e.color);
              earnedCredits += e.reward;
              killed++;
              enemies.splice(i, 1);
              updateHud();
              if (killed >= targetKills) {
                finishGame(true);
                return;
              }
            }
            break;
          }
        }

        // Colisão inimigo x jogador ou escapou
        if (enemies[i]) {
          if (Math.hypot(player.x - e.x, player.y - e.y) < player.r + e.r - 4) {
            player.hp -= 25;
            createExplosion(e.x, e.y, "#f43f5e");
            enemies.splice(i, 1);
            updateHud();
            if (player.hp <= 0) {
              finishGame(false);
              return;
            }
          } else if (e.y > height + 30) {
            e.y = -30;
          }
        }
      }

      // Partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 24;
        ctx.fillRect(p.x, p.y, 3, 3);
        ctx.globalAlpha = 1;
        if (p.life <= 0) particles.splice(i, 1);
      }

      drawShip(player.x, player.y, currentShip.color);
      animId = requestAnimationFrame(loop);
    }

    // CONTROLES TOQUE & MOUSE
    function updatePointer(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      player.targetX = clientX - rect.left;
      player.targetY = clientY - rect.top - 45; // Fica um pouco acima do dedo para não tampar a nave
    }

    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      if (e.touches[0]) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    canvas.addEventListener("touchstart", (e) => {
      if (e.touches[0]) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    canvas.addEventListener("mousemove", (e) => {
      if (gameRunning) updatePointer(e.clientX, e.clientY);
    });

    document.getElementById("start-btn").onclick = startMission;
    document.getElementById("back-menu-btn").onclick = () => {
      document.getElementById("end-modal").style.display = "none";
      document.getElementById("menu-screen").style.display = "flex";
      renderMenu();
    };

    initStars();
    renderMenu();
  </script>
</body>
</html>
