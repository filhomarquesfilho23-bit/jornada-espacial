<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Central Neon Rally — Campanha 2H</title>
  <meta name="theme-color" content="#070b14" />
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: #070b14;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    #gameWrapper {
      position: relative;
      width: 100vw;
      height: 100dvh;
      background: #070b14;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud-top {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      z-index: 10;
      pointer-events: none;
    }

    .hud-box {
      background: rgba(13, 17, 23, 0.88);
      border: 1px solid rgba(0, 210, 255, 0.45);
      border-radius: 10px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.15);
      pointer-events: auto;
    }

    .hud-box span {
      color: #00ffff;
    }

    #aiToggleBtn {
      background: #0d1117;
      color: #00ffff;
      border: 1.5px solid #00ffff;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.25);
    }

    #aiToggleBtn.active {
      background: #00ffff;
      color: #070b14;
      box-shadow: 0 0 16px rgba(0, 255, 255, 0.7);
    }

    #curveAlert {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 17, 23, 0.86);
      border: 1px solid rgba(255, 209, 102, 0.75);
      color: #ffd166;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 12px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      z-index: 9;
      display: none;
      white-space: nowrap;
    }

    .controls {
      position: absolute;
      bottom: 62px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 12;
      pointer-events: none;
    }

    .ctrl-group {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .ctrl-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(13, 17, 23, 0.84);
      border: 2px solid #00d2ff;
      color: #00ffff;
      font-size: 20px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(0, 210, 255, 0.28);
      touch-action: manipulation;
    }

    .ctrl-btn:active {
      background: rgba(0, 210, 255, 0.28);
      transform: scale(0.95);
    }

    .ctrl-btn.nitro {
      border-color: #ffd166;
      color: #ffd166;
      font-size: 12px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 11, 20, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 20;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #0d1117;
      border: 1.5px solid #00d2ff;
      border-radius: 16px;
      padding: 20px 16px;
      box-shadow: 0 0 28px rgba(0, 210, 255, 0.22);
    }

    .card h1 {
      margin: 0 0 6px;
      font-size: 22px;
      color: #00ffff;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }

    .card p {
      margin: 0 0 14px;
      font-size: 13px;
      color: #94a3b8;
    }

    .car-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .car-option {
      background: #070b14;
      border: 1.5px solid #1e293b;
      border-radius: 12px;
      padding: 10px 6px;
      cursor: pointer;
    }

    .car-option.selected {
      border-color: #00ffff;
      box-shadow: 0 0 14px rgba(0, 255, 255, 0.35);
    }

    .car-num {
      font-size: 18px;
      font-weight: 900;
      color: #ffd166;
    }

    .car-name {
      font-size: 11px;
      font-weight: 700;
      margin-top: 3px;
      color: #e6edf3;
    }

    .car-spec {
      font-size: 10px;
      color: #00d2ff;
      margin-top: 2px;
    }

    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .primary-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 900;
      background: linear-gradient(90deg, #00d2ff, #00ffff);
      color: #070b14;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(0, 255, 255, 0.4);
    }

    .ai-start-btn {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #ffd166;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 900;
      background: #070b14;
      color: #ffd166;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="gameWrapper">
    <canvas id="gameCanvas"></canvas>

    <div class="hud-top" id="hudTop" style="display:none;">
      <div class="hud-box">
        ETAPA <span id="stageNum">1/4</span> • <span id="stageName">SERTÃO NEON</span><br/>
        TEMPO: <span id="campTimer">02:00:00</span> | KM: <span id="distKm">0.0</span>
      </div>
      <button id="aiToggleBtn">🤖 IA: OFF</button>
      <div class="hud-box">
        VEL: <span id="speedVal">0</span> KM/H<br/>
        POS: <span id="posVal">1º</span> • PTS: <span id="scoreVal">0</span>
      </div>
    </div>

    <div id="curveAlert">↪️ CURVA À FRENTE</div>

    <div class="controls" id="touchControls" style="display:none;">
      <div class="ctrl-group">
        <button class="ctrl-btn" id="btnLeft">◀</button>
        <button class="ctrl-btn" id="btnRight">▶</button>
      </div>
      <div class="ctrl-group">
        <button class="ctrl-btn nitro" id="btnNitro">NITRO</button>
        <button class="ctrl-btn" id="btnGas">▲</button>
      </div>
    </div>

    <div class="overlay" id="startOverlay">
      <div class="card">
        <h1>CENTRAL NEON RALLY</h1>
        <p>Estrada com curvas suaves, rios, pontes, buracos, helicóptero e campanha de 2 horas</p>

        <div class="car-grid" id="carGrid">
          <div class="car-option selected" data-car="0">
            <div class="car-num">#10</div>
            <div class="car-name">FALCON CYAN</div>
            <div class="car-spec">Curva Ágil</div>
          </div>
          <div class="car-option" data-car="1">
            <div class="car-num">#23</div>
            <div class="car-name">SERTÃO TURBO</div>
            <div class="car-spec">Motor Forte</div>
          </div>
          <div class="car-option" data-car="2">
            <div class="car-num">#77</div>
            <div class="car-name">VIPER NEON</div>
            <div class="car-spec">Nitro Rápido</div>
          </div>
        </div>

        <div class="btn-row">
          <button class="primary-btn" id="startManualBtn">🏁 CORRER AGORA</button>
          <button class="ai-start-btn" id="startAiBtn">🤖 JOGAR COM IA (PILOTO AUTOMÁTICO)</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const CARS = [
      { num: '#10', name: 'FALCON CYAN', color: '#00ffff', accent: '#0284c7', maxSpd: 245, grip: 1.18 },
      { num: '#23', name: 'SERTÃO TURBO', color: '#ffd166', accent: '#ea580c', maxSpd: 262, grip: 1.02 },
      { num: '#77', name: 'VIPER NEON', color: '#34d399', accent: '#059669', maxSpd: 256, grip: 1.1 }
    ];

    const STAGES = [
      { name: 'SERTÃO NEON', road: '#131b2e', curbA: '#00ffff', curbB: '#1e293b', ground: '#070b14' },
      { name: 'VALE DO RIO', road: '#111d30', curbA: '#00d2ff', curbB: '#16243b', ground: '#060e1a' },
      { name: 'SERRA CURVADA', road: '#1b1929', curbA: '#ffd166', curbB: '#27233a', ground: '#090812' },
      { name: 'CANYON NOTURNO', road: '#181424', curbA: '#fb7185', curbB: '#261d36', ground: '#07060f' }
    ];

    let selectedCarIdx = 0;
    let running = false;
    let aiMode = false;

    const state = {
      distance: 0,
      speed: 110,
      playerOffset: 0,
      score: 0,
      campaignSeconds: 7200,
      nitro: 100,
      nitroActive: false,
      shake: 0,
      heliAngle: 0,
      obstacles: [],
      rivers: [],
      rivals: [],
      scenery: []
    };

    const keys = { left: false, right: false, gas: false, nitro: false };

    document.querySelectorAll('.car-option').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('.car-option').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
        selectedCarIdx = parseInt(el.dataset.car, 10);
      });
    });

    function bindHold(id, prop) {
      const btn = document.getElementById(id);
      const down = (e) => { e.preventDefault(); keys[prop] = true; };
      const up = (e) => { e.preventDefault(); keys[prop] = false; };
      btn.addEventListener('touchstart', down, { passive: false });
      btn.addEventListener('touchend', up, { passive: false });
      btn.addEventListener('mousedown', down);
      btn.addEventListener('mouseup', up);
      btn.addEventListener('mouseleave', up);
    }

    bindHold('btnLeft', 'left');
    bindHold('btnRight', 'right');
    bindHold('btnGas', 'gas');
    bindHold('btnNitro', 'nitro');

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if (e.key === 'ArrowUp' || e.key === 'w') keys.gas = true;
      if (e.key === ' ' || e.key === 'Shift') keys.nitro = true;
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
      if (e.key === 'ArrowUp' || e.key === 'w') keys.gas = false;
      if (e.key === ' ' || e.key === 'Shift') keys.nitro = false;
    });

    const aiBtn = document.getElementById('aiToggleBtn');
    function updateAiButton() {
      aiBtn.textContent = aiMode ? '🤖 IA: ON' : '🤖 IA: OFF';
      aiBtn.classList.toggle('active', aiMode);
    }
    aiBtn.addEventListener('click', () => {
      aiMode = !aiMode;
      updateAiButton();
    });

    function startGame(withAi) {
      aiMode = withAi;
      updateAiButton();
      document.getElementById('startOverlay').style.display = 'none';
      document.getElementById('hudTop').style.display = 'flex';
      document.getElementById('touchControls').style.display = 'flex';

      state.distance = 0;
      state.speed = 120;
      state.playerOffset = 0;
      state.score = 0;
      state.campaignSeconds = 7200;
      state.nitro = 100;
      state.obstacles = [];
      state.rivers = [{ dist: 750 }];
      state.rivals = [
        { num: '#05', color: '#fb7185', dist: 160, offset: -0.4, spd: 185 },
        { num: '#14', color: '#c084fc', dist: 320, offset: 0.38, spd: 196 },
        { num: '#88', color: '#38bdf8', dist: 490, offset: -0.1, spd: 206 }
      ];
      state.scenery = [];
      for (let i = 0; i < 20; i++) {
        state.scenery.push({
          dist: i * 95,
          side: i % 2 === 0 ? -1 : 1,
          type: i % 3 === 0 ? 'cactus' : (i % 3 === 1 ? 'lamp' : 'rock')
        });
      }

      running = true;
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    document.getElementById('startManualBtn').addEventListener('click', () => startGame(false));
    document.getElementById('startAiBtn').addEventListener('click', () => startGame(true));

    // Curva suave ao longo da pista (worldZ)
    function getRoadCenterX(worldZ, W) {
      const c1 = Math.sin(worldZ * 0.0021) * (W * 0.22);
      const c2 = Math.sin(worldZ * 0.0049 + 0.9) * (W * 0.11);
      return W * 0.5 + c1 + c2;
    }

    function getRoadSlope(worldZ) {
      return Math.cos(worldZ * 0.0021) * 0.22 * 2.1 + Math.cos(worldZ * 0.0049 + 0.9) * 0.11 * 4.9;
    }

    function getHalfRoadWidth(y, H, W) {
      const t = Math.max(0, Math.min(1, y / H));
      const minHalf = Math.min(W * 0.16, 68);
      const maxHalf = Math.min(W * 0.42, 185);
      return minHalf + (maxHalf - minHalf) * Math.pow(t, 1.15);
    }

    function getWorldZFromScreenY(y, H) {
      const playerY = H * 0.74;
      return state.distance + (playerY - y) * 1.45;
    }

    function getScreenYFromWorldZ(worldZ, H) {
      const playerY = H * 0.74;
      return playerY - (worldZ - state.distance) / 1.45;
    }

    function formatTime(sec) {
      const s = Math.max(0, Math.floor(sec));
      const h = String(Math.floor(s / 3600)).padStart(2, '0');
      const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      const r = String(s % 60).padStart(2, '0');
      return `${h}:${m}:${r}`;
    }

    let lastTime = 0;
    let spawnTimer = 0;
    let riverTimer = 0;

    function update(dt) {
      const car = CARS[selectedCarIdx];
      state.campaignSeconds = Math.max(0, state.campaignSeconds - dt);

      let steer = 0;
      let wantGas = keys.gas;
      let wantNitro = keys.nitro;

      if (aiMode) {
        wantGas = true;
        let targetOffset = 0;

        for (const obs of state.obstacles) {
          const dz = obs.dist - state.distance;
          if (dz > 15 && dz < 240 && Math.abs(obs.offset - state.playerOffset) < 0.4) {
            targetOffset = obs.offset > 0 ? -0.52 : 0.52;
            break;
          }
        }

        const aheadSlope = getRoadSlope(state.distance + 170);
        if (Math.abs(aheadSlope) > 0.58 && targetOffset === 0) {
          targetOffset = aheadSlope > 0 ? 0.25 : -0.25;
        }

        const diff = targetOffset - state.playerOffset;
        if (Math.abs(diff) > 0.025) {
          steer = Math.sign(diff) * Math.min(1, Math.abs(diff) * 4.2);
        }

        wantNitro = state.nitro > 65 && Math.abs(aheadSlope) < 0.5;
      } else {
        if (keys.left) steer -= 1;
        if (keys.right) steer += 1;
      }

      if (wantNitro && state.nitro > 5 && state.speed > 80) {
        state.nitroActive = true;
        state.nitro = Math.max(0, state.nitro - 28 * dt);
      } else {
        state.nitroActive = false;
        state.nitro = Math.min(100, state.nitro + 11 * dt);
      }

      const topSpeed = car.maxSpd + (state.nitroActive ? 55 : 0);
      if (wantGas || aiMode) {
        state.speed += (state.nitroActive ? 140 : 90) * dt;
      } else {
        state.speed -= 50 * dt;
      }

      if (Math.abs(state.playerOffset) > 0.98) {
        state.speed -= 125 * dt;
        state.shake = 2.5;
      }

      state.speed = Math.max(55, Math.min(topSpeed, state.speed));
      const worldStep = state.speed * 2.1 * dt;
      state.distance += worldStep;
      state.score += Math.floor(worldStep * 0.25);

      const currentSlope = getRoadSlope(state.distance + 80);
      const curvePull = currentSlope * (state.speed / 245) * 0.36 * dt;
      state.playerOffset += (steer * 1.48 * car.grip * dt) - curvePull;
      state.playerOffset = Math.max(-1.22, Math.min(1.22, state.playerOffset));

      const nextSlope = getRoadSlope(state.distance + 240);
      const alertEl = document.getElementById('curveAlert');
      if (Math.abs(nextSlope) > 0.58) {
        alertEl.style.display = 'block';
        alertEl.textContent = nextSlope > 0 ? '↪️ CURVA À DIREITA' : '↩️ CURVA À ESQUERDA';
      } else {
        alertEl.style.display = 'none';
      }

      spawnTimer += dt;
      if (spawnTimer > 1.45) {
        spawnTimer = 0;
        state.obstacles.push({
          dist: state.distance + 820,
          offset: (Math.random() * 1.2) - 0.6,
          type: Math.random() > 0.35 ? 'pothole' : 'cone'
        });
      }

      riverTimer += dt;
      if (riverTimer > 9.0) {
        riverTimer = 0;
        state.rivers.push({ dist: state.distance + 920 });
      }

      for (let i = state.obstacles.length - 1; i >= 0; i--) {
        const obs = state.obstacles[i];
        const dz = obs.dist - state.distance;
        if (Math.abs(dz) < 24 && Math.abs(obs.offset - state.playerOffset) < 0.22) {
          state.speed = Math.max(60, state.speed * 0.65);
          state.shake = 7;
          state.obstacles.splice(i, 1);
          continue;
        }
        if (dz < -110) state.obstacles.splice(i, 1);
      }

      for (let i = state.rivers.length - 1; i >= 0; i--) {
        if (state.rivers[i].dist - state.distance < -140) {
          state.rivers.splice(i, 1);
        }
      }

      let rank = 1;
      for (const r of state.rivals) {
        r.dist += r.spd * 2.05 * dt;
        if (r.dist < state.distance - 220) {
          r.dist = state.distance + 680 + Math.random() * 240;
          r.offset = (Math.random() * 1.1) - 0.55;
        }
        if (r.dist > state.distance) rank++;
      }

      for (const sc of state.scenery) {
        if (sc.dist < state.distance - 90) {
          sc.dist += 20 * 95;
        }
      }

      state.heliAngle += dt * 1.6;
      if (state.shake > 0) state.shake = Math.max(0, state.shake - 24 * dt);

      const stageIdx = Math.floor((state.distance / 5000) % STAGES.length);
      document.getElementById('stageNum').textContent = `${stageIdx + 1}/4`;
      document.getElementById('stageName').textContent = STAGES[stageIdx].name;
      document.getElementById('campTimer').textContent = formatTime(state.campaignSeconds);
      document.getElementById('distKm').textContent = (state.distance / 1000).toFixed(1);
      document.getElementById('speedVal').textContent = Math.round(state.speed);
      document.getElementById('posVal').textContent = `${rank}º`;
      document.getElementById('scoreVal').textContent = state.score;
    }

    function drawCar(x, y, scale, color, accent, num, isPlayer) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      // Sombra no chão
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.beginPath();
      ctx.ellipse(0, 2, 22, 34, 0, 0, Math.PI * 2);
      ctx.fill();

      // Rodas
      ctx.fillStyle = '#05070c';
      ctx.fillRect(-21, -22, 6, 12);
      ctx.fillRect(15, -22, 6, 12);
      ctx.fillRect(-21, 10, 6, 13);
      ctx.fillRect(15, 10, 6, 13);

      // Corpo do carro
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(-16, -30, 32, 60, 8);
      ctx.fill();

      // Faixa esportiva
      ctx.fillStyle = accent;
      ctx.fillRect(-5, -28, 10, 56);

      // Vidro dianteiro
      ctx.fillStyle = '#070b14';
      ctx.beginPath();
      ctx.roundRect(-11, -15, 22, 14, 4);
      ctx.fill();

      // Faróis
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-12, -31, 7, 3);
      ctx.fillRect(5, -31, 7, 3);

      if (isPlayer && state.nitroActive) {
        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        ctx.moveTo(-6, 30);
        ctx.lineTo(0, 48 + Math.random() * 8);
        ctx.lineTo(6, 30);
        ctx.closePath();
        ctx.fill();
      }

      // Número do carro
      ctx.fillStyle = '#070b14';
      ctx.font = '900 10px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(num, 0, 18);

      ctx.restore();
    }

    function render() {
      const W = canvas.width;
      const H = canvas.height;
      const horizonY = H * 0.14;
      const stageIdx = Math.floor((state.distance / 5000) % STAGES.length);
      const stage = STAGES[stageIdx];

      ctx.save();
      if (state.shake > 0) {
        ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
      }

      // Céu / fundo escuro neon
      const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
      bgGrad.addColorStop(0, '#050811');
      bgGrad.addColorStop(0.22, stage.ground);
      bgGrad.addColorStop(1, '#070b14');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // Amostra pontos contínuos ao longo da curva para desenhar uma estrada lisa (sem serrilhado)
      const samples = 44;
      const leftEdge = [];
      const rightEdge = [];
      const leftCurb = [];
      const rightCurb = [];
      const centers = [];

      for (let i = 0; i <= samples; i++) {
        const y = horizonY + ((H - horizonY) * i) / samples;
        const wz = getWorldZFromScreenY(y, H);
        const cx = getRoadCenterX(wz, W);
        const hw = getHalfRoadWidth(y, H, W);
        const curbW = hw * 0.08;

        centers.push({ x: cx, y, hw, wz });
        leftCurb.push({ x: cx - hw - curbW, y });
        rightCurb.push({ x: cx + hw + curbW, y });
        leftEdge.push({ x: cx - hw, y });
        rightEdge.push({ x: cx + hw, y });
      }

      // Polígono contínuo da zebra/borda neon
      ctx.fillStyle = stage.curbA;
      ctx.beginPath();
      ctx.moveTo(leftCurb[0].x, leftCurb[0].y);
      for (let i = 1; i <= samples; i++) ctx.lineTo(leftCurb[i].x, leftCurb[i].y);
      for (let i = samples; i >= 0; i--) ctx.lineTo(rightCurb[i].x, rightCurb[i].y);
      ctx.closePath();
      ctx.fill();

      // Polígono contínuo do asfalto/estrada
      ctx.fillStyle = stage.road;
      ctx.beginPath();
      ctx.moveTo(leftEdge[0].x, leftEdge[0].y);
      for (let i = 1; i <= samples; i++) ctx.lineTo(leftEdge[i].x, leftEdge[i].y);
      for (let i = samples; i >= 0; i--) ctx.lineTo(rightEdge[i].x, rightEdge[i].y);
      ctx.closePath();
      ctx.fill();

      // Linhas laterais contínuas neon
      ctx.strokeStyle = stage.curbA;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(leftEdge[0].x, leftEdge[0].y);
      for (let i = 1; i <= samples; i++) ctx.lineTo(leftEdge[i].x, leftEdge[i].y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(rightEdge[0].x, rightEdge[0].y);
      for (let i = 1; i <= samples; i++) ctx.lineTo(rightEdge[i].x, rightEdge[i].y);
      ctx.stroke();

      // Faixa central tracejada alinhada ao centro da curva
      ctx.strokeStyle = 'rgba(226, 232, 240, 0.55)';
      ctx.lineWidth = 2;
      for (let i = 0; i < samples - 1; i++) {
        const p1 = centers[i];
        const p2 = centers[i + 1];
        if (Math.floor(p1.wz / 55) % 2 === 0) {
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }

      // Rios com ponte sobre a estrada
      for (const rv of state.rivers) {
        const y = getScreenYFromWorldZ(rv.dist, H);
        if (y > horizonY && y < H + 40) {
          const hw = getHalfRoadWidth(y, H, W);
          const cx = getRoadCenterX(rv.dist, W);
          const t = Math.max(0.25, Math.min(1.1, (y - horizonY) / (H - horizonY)));
          const riverH = 26 * t;

          ctx.fillStyle = 'rgba(2, 132, 199, 0.72)';
          ctx.fillRect(0, y - riverH * 0.5, W, riverH);

          // Ponte sobre a estrada
          ctx.fillStyle = '#334155';
          ctx.fillRect(cx - hw - 6 * t, y - riverH * 0.65, (hw + 6 * t) * 2, riverH * 1.3);
          ctx.strokeStyle = '#ffd166';
          ctx.lineWidth = 2;
          ctx.strokeRect(cx - hw - 6 * t, y - riverH * 0.65, (hw + 6 * t) * 2, riverH * 1.3);
        }
      }

      // Postes e cactos nas laterais
      for (const sc of state.scenery) {
        const y = getScreenYFromWorldZ(sc.dist, H);
        if (y > horizonY + 4 && y < H + 30) {
          const t = Math.max(0.22, Math.min(1.15, (y - horizonY) / (H - horizonY)));
          const hw = getHalfRoadWidth(y, H, W);
          const cx = getRoadCenterX(sc.dist, W);
          const sx = cx + sc.side * (hw + 26 * t);

          if (sc.type === 'lamp') {
            ctx.fillStyle = '#64748b';
            ctx.fillRect(sx - 1.5 * t, y - 22 * t, 3 * t, 22 * t);
            ctx.fillStyle = stage.curbA;
            ctx.beginPath();
            ctx.arc(sx, y - 23 * t, 3.5 * t, 0, Math.PI * 2);
            ctx.fill();
          } else if (sc.type === 'cactus') {
            ctx.fillStyle = '#10b981';
            ctx.fillRect(sx - 3 * t, y - 18 * t, 6 * t, 18 * t);
            ctx.fillRect(sx - 8 * t, y - 13 * t, 16 * t, 4 * t);
          } else {
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.arc(sx, y - 4 * t, 7 * t, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // Buracos e cones na pista
      for (const obs of state.obstacles) {
        const y = getScreenYFromWorldZ(obs.dist, H);
        if (y > horizonY + 8 && y < H + 30) {
          const t = Math.max(0.25, Math.min(1.15, (y - horizonY) / (H - horizonY)));
          const hw = getHalfRoadWidth(y, H, W);
          const cx = getRoadCenterX(obs.dist, W);
          const ox = cx + obs.offset * hw;

          if (obs.type === 'pothole') {
            ctx.fillStyle = '#030712';
            ctx.beginPath();
            ctx.ellipse(ox, y, 14 * t, 7 * t, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fb7185';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          } else {
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.moveTo(ox, y - 11 * t);
            ctx.lineTo(ox - 7 * t, y + 4 * t);
            ctx.lineTo(ox + 7 * t, y + 4 * t);
            ctx.closePath();
            ctx.fill();
          }
        }
      }

      // Carros rivais
      for (const r of state.rivals) {
        const y = getScreenYFromWorldZ(r.dist, H);
        if (y > horizonY + 12 && y < H + 50) {
          const t = Math.max(0.35, Math.min(1.05, (y - horizonY) / (H - horizonY)));
          const hw = getHalfRoadWidth(y, H, W);
          const cx = getRoadCenterX(r.dist, W);
          const rx = cx + r.offset * hw;
          drawCar(rx, y, t * 0.92, r.color, '#0f172a', r.num, false);
        }
      }

      // Carro do jogador bem visível na pista
      const playerCar = CARS[selectedCarIdx];
      const playerY = H * 0.74;
      const playerHw = getHalfRoadWidth(playerY, H, W);
      const playerRoadX = getRoadCenterX(state.distance, W);
      const playerX = playerRoadX + state.playerOffset * playerHw;
      drawCar(playerX, playerY, 1.05, playerCar.color, playerCar.accent, playerCar.num, true);

      // Helicóptero no alto
      const hx = W * 0.5 + Math.cos(state.heliAngle * 0.7) * (W * 0.25);
      const hy = 96 + Math.sin(state.heliAngle) * 10;
      ctx.save();
      ctx.translate(hx, hy);
      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.ellipse(0, 0, 14, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(-22, -2, 11, 3);
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 2;
      const span = Math.sin(state.heliAngle * 14) * 22;
      ctx.beginPath();
      ctx.moveTo(-span, -6);
      ctx.lineTo(span, -6);
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }

    function loop(now) {
      if (!running) return;
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      update(dt);
      render();
      requestAnimationFrame(loop);
    }
  </script>
