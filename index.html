<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jornada Espacial</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #070b14;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #070b14;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD Superior */
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: none;
      justify-content: space-between;
      align-items: center;
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid #00d2ff;
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.25);
      z-index: 5;
      font-size: 13px;
    }

    .hud-item span {
      color: #00ffff;
      font-weight: bold;
    }

    #hpBarWrap {
      width: 90px;
      height: 10px;
      background: #1a2333;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #00d2ff;
      margin-top: 3px;
    }

    #hpBar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #00d2ff, #00ffff);
      transition: width 0.15s ease;
    }

    /* Telas de Menu / Hangar / Fim de Jogo */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 11, 20, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
      text-align: center;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      color: #00ffff;
      text-shadow: 0 0 18px rgba(0, 210, 255, 0.7);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 14px;
      color: #a8c7fa;
      margin-bottom: 20px;
      max-width: 340px;
    }

    .hangar-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 380px;
      margin-bottom: 20px;
    }

    .ship-card {
      background: #0d1117;
      border: 1px solid #1f2d42;
      border-radius: 12px;
      padding: 12px 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ship-card.selected {
      border-color: #00ffff;
      box-shadow: 0 0 14px rgba(0, 255, 255, 0.4);
      background: #111c2e;
    }

    .ship-name {
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .ship-stat {
      font-size: 11px;
      color: #00d2ff;
    }

    .btn-primary {
      background: linear-gradient(90deg, #00d2ff, #00ffff);
      color: #070b14;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
      width: 100%;
      max-width: 280px;
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    #planetBanner {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 17, 23, 0.9);
      border: 1px solid #00ffff;
      color: #00ffff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      display: none;
      z-index: 6;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.35);
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div class="hud-item">
        VIDA
        <div id="hpBarWrap"><div id="hpBar"></div></div>
      </div>
      <div class="hud-item">SETOR: <span id="planetName">Órbita Terrestre</span></div>
      <div class="hud-item">PONTOS: <span id="scoreVal">0</span></div>
    </div>

    <div id="planetBanner"></div>

    <!-- Menu & Hangar -->
    <div id="startOverlay" class="overlay">
      <div class="title">JORNADA ESPACIAL</div>
      <div class="subtitle">Escolha sua nave no hangar e explore os setores planetários. Arraste o dedo na tela para pilotar e atirar.</div>

      <div class="hangar-grid">
        <div class="ship-card selected" data-ship="0" onclick="selectShip(0)">
          <div class="ship-name">FALCON V1</div>
          <div class="ship-stat">Equilibrada<br>Tiro Duplo</div>
        </div>
        <div class="ship-card" data-ship="1" onclick="selectShip(1)">
          <div class="ship-name">INTERCEPTOR</div>
          <div class="ship-stat">Alta Vel.<br>Cadência +</div>
        </div>
        <div class="ship-card" data-ship="2" onclick="selectShip(2)">
          <div class="ship-name">TITAN X</div>
          <div class="ship-stat">Blindada<br>Canhão Plasma</div>
        </div>
      </div>

      <button class="btn-primary" onclick="startGame()">INICIAR MISSÃO</button>
    </div>

    <!-- Tela de Game Over -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
      <div class="title" id="endTitle">NAVE DESTRUÍDA</div>
      <div class="subtitle" id="endSummary">Pontuação final: 0</div>
      <button class="btn-primary" onclick="resetToMenu()">VOLTAR AO HANGAR</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const hud = document.getElementById('hud');
    const hpBar = document.getElementById('hpBar');
    const scoreVal = document.getElementById('scoreVal');
    const planetNameEl = document.getElementById('planetName');
    const planetBanner = document.getElementById('planetBanner');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const endSummary = document.getElementById('endSummary');

    const SHIPS = [
      { name: 'FALCON V1', maxHp: 100, fireRate: 240, speed: 1.0, color: '#00ffff', bulletColor: '#00d2ff', power: 18 },
      { name: 'INTERCEPTOR', maxHp: 80, fireRate: 150, speed: 1.25, color: '#38bdf8', bulletColor: '#7dd3fc', power: 14 },
      { name: 'TITAN X', maxHp: 150, fireRate: 340, speed: 0.85, color: '#00d2ff', bulletColor: '#00ffff', power: 32 }
    ];

    const PLANETS = [
      { name: 'Órbita Terrestre', threshold: 0, color: '#1d4ed8' },
      { name: 'Cinturão de Marte', threshold: 250, color: '#dc2626' },
      { name: 'Tempestade de Júpiter', threshold: 600, color: '#d97706' },
      { name: 'Anéis de Saturno', threshold: 1100, color: '#eab308' },
      { name: 'Abismo de Netuno', threshold: 1800, color: '#0284c7' }
    ];

    let selectedShipIndex = 0;
    let gameRunning = false;
    let animationId = null;
    let lastTime = 0;
    let lastShot = 0;
    let spawnTimer = 0;

    let score = 0;
    let currentPlanetIdx = 0;
    let stars = [];
    let bullets = [];
    let enemies = [];
    let particles = [];
    let powerups = [];
    let boss = null;
    let nextBossScore = 500;

    const player = {
      x: 0,
      y: 0,
      targetX: 0,
      targetY: 0,
      radius: 20,
      hp: 100,
      maxHp: 100,
      weaponLevel: 1
    };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (!gameRunning) {
        player.x = canvas.width / 2;
        player.y = canvas.height * 0.78;
        player.targetX = player.x;
        player.targetY = player.y;
      }
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function initStars() {
      stars = [];
      for (let i = 0; i < 75; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2 + 0.6,
          speed: Math.random() * 1.8 + 0.5
        });
      }
    }

    function selectShip(index) {
      selectedShipIndex = index;
      document.querySelectorAll('.ship-card').forEach((card, idx) => {
        card.classList.toggle('selected', idx === index);
      });
    }

    function showBanner(text) {
      planetBanner.textContent = text;
      planetBanner.style.display = 'block';
      clearTimeout(planetBanner._timer);
      planetBanner._timer = setTimeout(() => {
        planetBanner.style.display = 'none';
      }, 2600);
    }

    function startGame() {
      resizeCanvas();
      const spec = SHIPS[selectedShipIndex];
      player.maxHp = spec.maxHp;
      player.hp = spec.maxHp;
      player.x = canvas.width / 2;
      player.y = canvas.height * 0.78;
      player.targetX = player.x;
      player.targetY = player.y;
      player.weaponLevel = 1;

      score = 0;
      currentPlanetIdx = 0;
      nextBossScore = 500;
      bullets = [];
      enemies = [];
      particles = [];
      powerups = [];
      boss = null;

      initStars();
      updateHud();

      startOverlay.style.display = 'none';
      gameOverOverlay.style.display = 'none';
      hud.style.display = 'flex';
      showBanner('SETOR: ' + PLANETS[0].name.toUpperCase());

      gameRunning = true;
      lastTime = performance.now();
      cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(gameLoop);
    }

    function resetToMenu() {
      gameRunning = false;
      cancelAnimationFrame(animationId);
      hud.style.display = 'none';
      gameOverOverlay.style.display = 'none';
      startOverlay.style.display = 'flex';
    }

    function endGame() {
      gameRunning = false;
      cancelAnimationFrame(animationId);
      hud.style.display = 'none';
      endSummary.textContent = `Setor alcançado: ${PLANETS[currentPlanetIdx].name} • Pontuação: ${score}`;
      gameOverOverlay.style.display = 'flex';
    }

    function updateHud() {
      const pct = Math.max(0, (player.hp / player.maxHp) * 100);
      hpBar.style.width = pct + '%';
      scoreVal.textContent = score;
      planetNameEl.textContent = PLANETS[currentPlanetIdx].name;
    }

    // Controles Touch e Mouse
    function handlePointer(clientX, clientY) {
      if (!gameRunning) return;
      player.targetX = Math.max(24, Math.min(canvas.width - 24, clientX));
      player.targetY = Math.max(70, Math.min(canvas.height - 30, clientY - 35));
    }

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        handlePointer(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        handlePointer(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    canvas.addEventListener('mousemove', (e) => {
      if (e.buttons === 1) {
        handlePointer(e.clientX, e.clientY);
      }
    });

    function spawnBullets(now) {
      const spec = SHIPS[selectedShipIndex];
      if (now - lastShot < spec.fireRate) return;
      lastShot = now;

      if (player.weaponLevel === 1) {
        bullets.push({ x: player.x, y: player.y - 22, vx: 0, vy: -9, power: spec.power, color: spec.bulletColor });
      } else if (player.weaponLevel === 2) {
        bullets.push({ x: player.x - 10, y: player.y - 18, vx: 0, vy: -9.5, power: spec.power, color: spec.bulletColor });
        bullets.push({ x: player.x + 10, y: player.y - 18, vx: 0, vy: -9.5, power: spec.power, color: spec.bulletColor });
      } else {
        bullets.push({ x: player.x, y: player.y - 24, vx: 0, vy: -10, power: spec.power, color: '#00ffff' });
        bullets.push({ x: player.x - 14, y: player.y - 14, vx: -1.3, vy: -9.5, power: spec.power * 0.8, color: spec.bulletColor });
        bullets.push({ x: player.x + 14, y: player.y - 14, vx: 1.3, vy: -9.5, power: spec.power * 0.8, color: spec.bulletColor });
      }
    }

    function spawnEnemy() {
      const radius = Math.random() * 10 + 16;
      const hp = 25 + currentPlanetIdx * 15;
      enemies.push({
        x: Math.random() * (canvas.width - 50) + 25,
        y: -30,
        radius,
        hp,
        maxHp: hp,
        vy: Math.random() * 1.6 + 1.8 + currentPlanetIdx * 0.3,
        vx: (Math.random() - 0.5) * 1.4
      });
    }

    function spawnBoss() {
      const maxHp = 350 + currentPlanetIdx * 180;
      boss = {
        x: canvas.width / 2,
        y: 125,
        radius: 46,
        hp: maxHp,
        maxHp,
        vx: 2.2,
        shootTimer: 0
      };
      showBanner('ALERTA: NAVE-MÃE DETECTADA!');
    }

    function createExplosion(x, y, color, count = 14) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3.5 + 1;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          color
        });
      }
    }

    function checkPlanetProgress() {
      for (let i = PLANETS.length - 1; i >= 0; i--) {
        if (score >= PLANETS[i].threshold && currentPlanetIdx < i) {
          currentPlanetIdx = i;
          showBanner('NOVO SETOR: ' + PLANETS[i].name.toUpperCase());
          break;
        }
      }
      if (!boss && score >= nextBossScore) {
        spawnBoss();
      }
    }

    function drawShip() {
      const spec = SHIPS[selectedShipIndex];
      ctx.save();
      ctx.translate(player.x, player.y);

      // Propulsor
      ctx.fillStyle = '#00ffff';
      ctx.beginPath();
      ctx.moveTo(-7, 16);
      ctx.lineTo(0, 26 + Math.random() * 8);
      ctx.lineTo(7, 16);
      ctx.closePath();
      ctx.fill();

      // Fuselagem
      ctx.fillStyle = '#0d1117';
      ctx.strokeStyle = spec.color;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, -24);
      ctx.lineTo(20, 16);
      ctx.lineTo(0, 10);
      ctx.lineTo(-20, 16);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Cabine
      ctx.fillStyle = '#00ffff';
      ctx.beginPath();
      ctx.arc(0, -3, 4.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function gameLoop(now) {
      if (!gameRunning) return;
      const dt = now - lastTime;
      lastTime = now;

      ctx.fillStyle = '#070b14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Fundo estrelado
      for (const s of stars) {
        s.y += s.speed;
        if (s.y > canvas.height) {
          s.y = 0;
          s.x = Math.random() * canvas.width;
        }
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }

      // Movimento suave do jogador
      const spec = SHIPS[selectedShipIndex];
      player.x += (player.targetX - player.x) * 0.22 * spec.speed;
      player.y += (player.targetY - player.y) * 0.22 * spec.speed;

      spawnBullets(now);
      drawShip();

      // Tiros do jogador
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
        if (b.y < -20 || b.y > canvas.height + 20) {
          bullets.splice(i, 1);
        }
      }

      // Spawn de inimigos comuns
      spawnTimer += dt;
      if (!boss && spawnTimer > Math.max(480, 1100 - currentPlanetIdx * 120)) {
        spawnEnemy();
        spawnTimer = 0;
      }

      // Atualizar inimigos
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x += e.vx;
        e.y += e.vy;
        if (e.x < e.radius || e.x > canvas.width - e.radius) e.vx *= -1;

        ctx.fillStyle = '#161b22';
        ctx.strokeStyle = '#ff4d6d';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Colisão tiro x inimigo
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (b.vy < 0 && Math.hypot(b.x - e.x, b.y - e.y) < e.radius + 5) {
            e.hp -= b.power;
            bullets.splice(j, 1);
            if (e.hp <= 0) {
              createExplosion(e.x, e.y, '#ff4d6d');
              score += 25;
              if (Math.random() < 0.16) {
                powerups.push({ x: e.x, y: e.y, type: Math.random() < 0.5 ? 'weapon' : 'heal' });
              }
              enemies.splice(i, 1);
              checkPlanetProgress();
              updateHud();
            }
            break;
          }
        }

        // Colisão nave x inimigo
        if (enemies[i] && Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
          createExplosion(e.x, e.y, '#ff4d6d');
          enemies.splice(i, 1);
          player.hp -= 20;
          updateHud();
          if (player.hp <= 0) return endGame();
        } else if (enemies[i] && e.y > canvas.height + 40) {
          enemies.splice(i, 1);
        }
      }

      // Lógica do Chefão (Boss)
      if (boss) {
        boss.x += boss.vx;
        if (boss.x < boss.radius + 16 || boss.x > canvas.width - boss.radius - 16) {
          boss.vx *= -1;
        }

        boss.shootTimer += dt;
        if (boss.shootTimer > 950) {
          boss.shootTimer = 0;
          bullets.push({ x: boss.x, y: boss.y + boss.radius, vx: 0, vy: 5.2, power: 18, color: '#ff4d6d' });
          bullets.push({ x: boss.x - 18, y: boss.y + 30, vx: -1.4, vy: 4.8, power: 18, color: '#ff4d6d' });
          bullets.push({ x: boss.x + 18, y: boss.y + 30, vx: 1.4, vy: 4.8, power: 18, color: '#ff4d6d' });
        }

        ctx.fillStyle = '#0d1117';
        ctx.strokeStyle = '#ff0055';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(boss.x, boss.y, boss.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Barra de vida do Boss
        const bw = 90;
        ctx.fillStyle = '#1f2937';
        ctx.fillRect(boss.x - bw / 2, boss.y - boss.radius - 14, bw, 7);
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(boss.x - bw / 2, boss.y - boss.radius - 14, bw * (boss.hp / boss.maxHp), 7);

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (b.vy < 0 && Math.hypot(b.x - boss.x, b.y - boss.y) < boss.radius + 6) {
            boss.hp -= b.power;
            bullets.splice(j, 1);
            if (boss.hp <= 0) {
              createExplosion(boss.x, boss.y, '#00ffff', 32);
              score += 200;
              nextBossScore = score + 650;
              boss = null;
              checkPlanetProgress();
              updateHud();
              break;
            }
          }
        }
      }

      // Tiros inimigos atingindo o jogador
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        if (b.vy > 0 && Math.hypot(b.x - player.x, b.y - player.y) < player.radius) {
          bullets.splice(j, 1);
          player.hp -= b.power;
          updateHud();
          if (player.hp <= 0) return endGame();
        }
      }

      // Power-ups
      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += 2.2;
        ctx.fillStyle = p.type === 'weapon' ? '#00ffff' : '#22c55e';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 11, 0, Math.PI * 2);
        ctx.fill();

        if (Math.hypot(p.x - player.x, p.y - player.y) < player.radius + 12) {
          if (p.type === 'weapon') {
            player.weaponLevel = Math.min(3, player.weaponLevel + 1);
            showBanner('ARMA APRIMORADA!');
          } else {
            player.hp = Math.min(player.maxHp, player.hp + 30);
            showBanner('ESCUDO REPARADO!');
            updateHud();
          }
          powerups.splice(i, 1);
        } else if (p.y > canvas.height + 20) {
          powerups.splice(i, 1);
        }
      }

      // Partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= 0.035;
        if (pt.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = pt.life;
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, 3, 3);
        ctx.globalAlpha = 1;
      }

      animationId = requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
