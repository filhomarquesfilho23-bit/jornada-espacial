<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jornada Espacial - IA & Manual</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background-color: #070b14;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #0d1526 0%, #070b14 100%);
    }

    /* HUD Superior durante o jogo */
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: none;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .hud-box {
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid #00d2ff;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.25);
    }

    #toggleAiBtn {
      pointer-events: auto;
      background: #0d1117;
      color: #00ffff;
      border: 1.5px solid #00ffff;
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
    }

    #toggleAiBtn.active {
      background: #00ffff;
      color: #070b14;
    }

    /* Telas de Menu e Game Over */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 11, 20, 0.92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 20;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      letter-spacing: 2px;
      color: #00ffff;
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.7);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    /* Seleção de Naves */
    .ships-container {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 22px;
    }

    .ship-card {
      flex: 1;
      background: #0d1117;
      border: 1.5px solid #1e293b;
      border-radius: 12px;
      padding: 12px 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .ship-card.selected {
      border-color: #00ffff;
      background: rgba(0, 210, 255, 0.12);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.35);
    }

    .ship-name {
      font-size: 13px;
      font-weight: bold;
      color: #00d2ff;
      margin-bottom: 4px;
    }

    .ship-desc {
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.3;
    }

    /* Botões de Modo de Jogo */
    .mode-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 340px;
    }

    .btn-mode {
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .btn-mode:active {
      transform: scale(0.97);
    }

    .btn-manual {
      background: linear-gradient(90deg, #00d2ff, #0080ff);
      color: #070b14;
      box-shadow: 0 0 18px rgba(0, 210, 255, 0.5);
    }

    .btn-ai {
      background: #0d1117;
      color: #00ffff;
      border: 2px solid #00ffff;
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.3);
    }

    #gameOverScreen {
      display: none;
    }

    .stats-final {
      font-size: 18px;
      margin: 15px 0 25px;
      color: #e2e8f0;
    }
  </style>
</head>
<body>

  <!-- HUD em jogo -->
  <div id="hud">
    <div class="hud-box" id="scoreDisplay">PTS: 0 | ❤️ 100%</div>
    <div class="hud-box" id="planetDisplay">SETOR: ÓRBITA</div>
    <button id="toggleAiBtn" onclick="toggleAI()">IA: OFF</button>
  </div>

  <!-- Menu Principal -->
  <div id="menuScreen" class="overlay">
    <h1>JORNADA ESPACIAL</h1>
    <p class="subtitle">Escolha sua nave e o modo de pilotagem</p>

    <div class="ships-container">
      <div class="ship-card selected" onclick="selectShip('falcon', this)">
        <div class="ship-name">FALCON V1</div>
        <div class="ship-desc">Equilibrada<br>Tiro Duplo</div>
      </div>
      <div class="ship-card" onclick="selectShip('interceptor', this)">
        <div class="ship-name">INTERCEPTOR</div>
        <div class="ship-desc">Ultra Rápida<br>Cadência Alta</div>
      </div>
      <div class="ship-card" onclick="selectShip('titan', this)">
        <div class="ship-name">TITAN X</div>
        <div class="ship-desc">Blindagem +<br>Tiro Triplo</div>
      </div>
    </div>

    <div class="mode-buttons">
      <button class="btn-mode btn-manual" onclick="startGame(false)">🎮 JOGAR MANUAL</button>
      <button class="btn-mode btn-ai" onclick="startGame(true)">🤖 JOGAR COM IA</button>
    </div>
  </div>

  <!-- Tela de Game Over -->
  <div id="gameOverScreen" class="overlay">
    <h1 style="color: #ff3b5c; text-shadow: 0 0 15px rgba(255, 59, 92, 0.7);">NAVE DESTRUÍDA</h1>
    <div class="stats-final" id="finalStats">Pontuação: 0</div>
    <div class="mode-buttons">
      <button class="btn-mode btn-manual" onclick="startGame(false)">🎮 REINICIAR MANUAL</button>
      <button class="btn-mode btn-ai" onclick="startGame(true)">🤖 REINICIAR COM IA</button>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Configurações das naves
    const SHIPS = {
      falcon: { name: 'Falcon V1', color: '#00ffff', speed: 7, fireRate: 14, maxHp: 100, spread: 2 },
      interceptor: { name: 'Interceptor', color: '#00d2ff', speed: 10, fireRate: 9, maxHp: 80, spread: 1 },
      titan: { name: 'Titan X', color: '#38bdf8', speed: 5.5, fireRate: 18, maxHp: 150, spread: 3 }
    };

    const PLANETS = ['ÓRBITA TERRA', 'CINTURÃO DE MARTE', 'LUAS DE JÚPITER', 'ANÉIS DE SATURNO', 'NEBULOSA NEON'];

    let selectedShipKey = 'falcon';
    let aiMode = false;
    let gameRunning = false;
    let score = 0;
    let frameCount = 0;

    let player = {};
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let powerups = [];
    let particles = [];
    let stars = [];
    let boss = null;

    // Estrelas de fundo
    for (let i = 0; i < 70; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 2 + 0.5
      });
    }

    function selectShip(key, el) {
      selectedShipKey = key;
      document.querySelectorAll('.ship-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }

    function toggleAI() {
      aiMode = !aiMode;
      updateAiButton();
    }

    function updateAiButton() {
      const btn = document.getElementById('toggleAiBtn');
      btn.textContent = aiMode ? '🤖 IA: ON' : '🎮 IA: OFF';
      if (aiMode) btn.classList.add('active');
      else btn.classList.remove('active');
    }

    function startGame(enableAI) {
      aiMode = enableAI;
      updateAiButton();

      const spec = SHIPS[selectedShipKey];
      player = {
        x: canvas.width / 2,
        y: canvas.height - 110,
        targetX: canvas.width / 2,
        targetY: canvas.height - 110,
        w: 36,
        h: 44,
        hp: spec.maxHp,
        maxHp: spec.maxHp,
        color: spec.color,
        speed: spec.speed,
        fireRate: spec.fireRate,
        spread: spec.spread,
        shield: 0,
        weaponBoost: 0
      };

      bullets = [];
      enemyBullets = [];
      enemies = [];
      powerups = [];
      particles = [];
      boss = null;
      score = 0;
      frameCount = 0;
      gameRunning = true;

      document.getElementById('menuScreen').style.display = 'none';
      document.getElementById('gameOverScreen').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
    }

    // Controles Touch / Mouse (Modo Manual)
    function handleMove(clientX, clientY) {
      if (!gameRunning || aiMode) return;
      player.targetX = clientX;
      player.targetY = Math.max(80, Math.min(canvas.height - 50, clientY - 45));
    }

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    canvas.addEventListener('touchstart', (e) => {
      handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    canvas.addEventListener('mousemove', (e) => {
      if (e.buttons === 1) handleMove(e.clientX, e.clientY);
    });

    // Inteligência Artificial de Pilotagem
    function runPilotAI() {
      let desiredX = player.x;
      let desiredY = canvas.height - 115;
      let dangerFound = false;

      // 1. Verificar ameaças próximas (inimigos e tiros inimigos)
      const threats = [
        ...enemies.map(e => ({ x: e.x, y: e.y, r: e.r + 35 })),
        ...enemyBullets.map(b => ({ x: b.x, y: b.y, r: 30 }))
      ];

      for (let t of threats) {
        const dy = player.y - t.y;
        const dx = player.x - t.x;
        if (dy > -20 && dy < 220 && Math.abs(dx) < t.r + 25) {
          dangerFound = true;
          // Desvia para o lado com mais espaço na tela
          if (player.x < canvas.width * 0.25) {
            desiredX = player.x + 90;
          } else if (player.x > canvas.width * 0.75) {
            desiredX = player.x - 90;
          } else {
            desiredX = dx >= 0 ? player.x + 85 : player.x - 85;
          }
          break;
        }
      }

      // 2. Se não há perigo imediato, buscar Power-up
      if (!dangerFound && powerups.length > 0) {
        const p = powerups[0];
        desiredX = p.x;
        desiredY = Math.min(canvas.height - 90, Math.max(canvas.height * 0.55, p.y));
      } 
      // 3. Se não há power-up, alinhar tiro com Chefão ou inimigo mais baixo
      else if (!dangerFound) {
        if (boss) {
          desiredX = boss.x + Math.sin(frameCount * 0.05) * 40;
        } else if (enemies.length > 0) {
          let lowest = enemies.reduce((a, b) => (a.y > b.y ? a : b));
          desiredX = lowest.x;
        } else {
          desiredX = canvas.width / 2 + Math.sin(frameCount * 0.03) * 80;
        }
      }

      player.targetX = Math.max(30, Math.min(canvas.width - 30, desiredX));
      player.targetY = Math.max(canvas.height * 0.45, Math.min(canvas.height - 70, desiredY));
    }

    function spawnParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 25,
          color
        });
      }
    }

    function shootPlayer() {
      const currentSpread = player.weaponBoost > 0 ? 3 : player.spread;
      if (currentSpread === 1) {
        bullets.push({ x: player.x, y: player.y - 22, vx: 0, vy: -12 });
      } else if (currentSpread === 2) {
        bullets.push({ x: player.x - 10, y: player.y - 18, vx: 0, vy: -12 });
        bullets.push({ x: player.x + 10, y: player.y - 18, vx: 0, vy: -12 });
      } else {
        bullets.push({ x: player.x, y: player.y - 24, vx: 0, vy: -12 });
        bullets.push({ x: player.x - 12, y: player.y - 16, vx: -1.5, vy: -11.5 });
        bullets.push({ x: player.x + 12, y: player.y - 16, vx: 1.5, vy: -11.5 });
      }
    }

    function drawShip(x, y, color) {
      ctx.save();
      ctx.translate(x, y);

      // Propulsor neon
      ctx.fillStyle = '#00ffff';
      ctx.beginPath();
      ctx.moveTo(-6, 18);
      ctx.lineTo(0, 28 + Math.random() * 10);
      ctx.lineTo(6, 18);
      ctx.fill();

      // Corpo da nave
      ctx.fillStyle = '#0d1117';
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.shadowBlur = 12;
      ctx.shadowColor = color;

      ctx.beginPath();
      ctx.moveTo(0, -24);
      ctx.lineTo(18, 16);
      ctx.lineTo(0, 10);
      ctx.lineTo(-18, 16);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Cabine
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(0, -2, 4, 0, Math.PI * 2);
      ctx.fill();

      // Escudo ativo
      if (player.shield > 0) {
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 30, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function update() {
      if (!gameRunning) return;
      frameCount++;

      if (aiMode) runPilotAI();

      // Movimento suave da nave
      player.x += (player.targetX - player.x) * 0.18;
      player.y += (player.targetY - player.y) * 0.18;

      if (player.shield > 0) player.shield--;
      if (player.weaponBoost > 0) player.weaponBoost--;

      // Tiro automático
      if (frameCount % player.fireRate === 0) shootPlayer();

      // Spawn de inimigos / meteoros
      if (!boss && frameCount % 38 === 0) {
        const isEnemyShip = Math.random() > 0.55;
        enemies.push({
          x: Math.random() * (canvas.width - 60) + 30,
          y: -30,
          r: isEnemyShip ? 18 : 22,
          hp: isEnemyShip ? 2 : 3,
          vy: Math.random() * 2.5 + 2.5,
          vx: isEnemyShip ? (Math.random() - 0.5) * 2 : 0,
          type: isEnemyShip ? 'ship' : 'meteor'
        });
      }

      // Spawn de Chefão a cada 1000 pontos
      if (!boss && score > 0 && score % 1000 < 50 && enemies.length === 0) {
        boss = {
          x: canvas.width / 2,
          y: 95,
          r: 45,
          hp: 60,
          maxHp: 60,
          dir: 1
        };
      }

      // Atualizar tiros do jogador
      bullets.forEach((b, i) => {
        b.x += b.vx;
        b.y += b.vy;
        if (b.y < -20) bullets.splice(i, 1);
      });

      // Atualizar inimigos
      enemies.forEach((e, i) => {
        e.x += e.vx;
        e.y += e.vy;
        if (e.x < 25 || e.x > canvas.width - 25) e.vx *= -1;

        // Colisão com tiro
        bullets.forEach((b, bi) => {
          if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 6) {
            e.hp--;
            bullets.splice(bi, 1);
            spawnParticles(b.x, b.y, '#00ffff', 4);
            if (e.hp <= 0) {
              score += 50;
              spawnParticles(e.x, e.y, '#ff9f1c', 14);
              if (Math.random() < 0.16) {
                powerups.push({
                  x: e.x,
                  y: e.y,
                  type: Math.random() > 0.5 ? 'shield' : 'weapon'
                });
              }
              enemies.splice(i, 1);
            }
          }
        });

        // Colisão com jogador
        if (Math.hypot(player.x - e.x, player.y - e.y) < e.r + 16) {
          enemies.splice(i, 1);
          spawnParticles(e.x, e.y, '#ff3b5c', 15);
          if (player.shield <= 0) {
            player.hp -= 25;
          }
        }

        if (e.y > canvas.height + 40) enemies.splice(i, 1);
      });

      // Lógica do Chefão
      if (boss) {
        boss.x += 2.2 * boss.dir;
        if (boss.x < 60 || boss.x > canvas.width - 60) boss.dir *= -1;

        if (frameCount % 45 === 0) {
          enemyBullets.push({ x: boss.x - 20, y: boss.y + 30, vy: 5.5 });
          enemyBullets.push({ x: boss.x + 20, y: boss.y + 30, vy: 5.5 });
        }

        bullets.forEach((b, bi) => {
          if (Math.hypot(b.x - boss.x, b.y - boss.y) < boss.r) {
            boss.hp--;
            bullets.splice(bi, 1);
            spawnParticles(b.x, b.y, '#ff3b5c', 4);
            if (boss.hp <= 0) {
              score += 500;
              spawnParticles(boss.x, boss.y, '#00ffff', 35);
              boss = null;
            }
          }
        });
      }

      // Tiros inimigos
      enemyBullets.forEach((eb, i) => {
        eb.y += eb.vy;
        if (Math.hypot(eb.x - player.x, eb.y - player.y) < 20) {
          enemyBullets.splice(i, 1);
          if (player.shield <= 0) player.hp -= 15;
        }
        if (eb.y > canvas.height + 20) enemyBullets.splice(i, 1);
      });

      // Power-ups
      powerups.forEach((p, i) => {
        p.y += 2.5;
        if (Math.hypot(p.x - player.x, p.y - player.y) < 28) {
          if (p.type === 'shield') player.shield = 360;
          else player.weaponBoost = 360;
          score += 30;
          powerups.splice(i, 1);
        }
        if (p.y > canvas.height + 20) powerups.splice(i, 1);
      });

      // Partículas
      particles.forEach((pt, i) => {
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        if (pt.life <= 0) particles.splice(i, 1);
      });

      // Atualizar HUD
      const hpPercent = Math.max(0, Math.round((player.hp / player.maxHp) * 100));
      const planetIdx = Math.min(PLANETS.length - 1, Math.floor(score / 800));
      document.getElementById('scoreDisplay').textContent = `PTS: ${score} | ❤️ ${hpPercent}%`;
      document.getElementById('planetDisplay').textContent = PLANETS[planetIdx];

      // Verificar derrota
      if (player.hp <= 0) {
        gameRunning = false;
        document.getElementById('hud').style.display = 'none';
        document.getElementById('finalStats').textContent = `Pontuação Final: ${score} pts`;
        document.getElementById('gameOverScreen').style.display = 'flex';
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Estrelas
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) {
          s.y = 0;
          s.x = Math.random() * canvas.width;
        }
        ctx.globalAlpha = 0.6;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });
      ctx.globalAlpha = 1;

      if (!gameRunning) return;

      // Linha guia sutil quando a IA está pilotando
      if (aiMode) {
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.25)';
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.targetX, player.targetY);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Tiros do jogador
      ctx.fillStyle = '#00ffff';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#00ffff';
      bullets.forEach(b => {
        ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
      });
      ctx.shadowBlur = 0;

      // Tiros inimigos
      ctx.fillStyle = '#ff3b5c';
      enemyBullets.forEach(eb => {
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // Inimigos
      enemies.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);
        if (e.type === 'meteor') {
          ctx.fillStyle = '#334155';
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, e.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.fillStyle = '#1e1b4b';
          ctx.strokeStyle = '#ff3b5c';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, 18);
          ctx.lineTo(16, -14);
          ctx.lineTo(-16, -14);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
        ctx.restore();
      });

      // Chefão
      if (boss) {
        ctx.save();
        ctx.translate(boss.x, boss.y);
        ctx.fillStyle = '#1e1b4b';
        ctx.strokeStyle = '#ff3b5c';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ff3b5c';
        ctx.beginPath();
        ctx.arc(0, 0, boss.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Barra de vida do Chefão
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-40, -60, 80, 8);
        ctx.fillStyle = '#ff3b5c';
        ctx.fillRect(-40, -60, 80 * (boss.hp / boss.maxHp), 8);
        ctx.restore();
      }

      // Power-ups
      powerups.forEach(p => {
        ctx.fillStyle = p.type === 'shield' ? '#00ffff' : '#facc15';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#070b14';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.type === 'shield' ? 'S' : 'W', p.x, p.y + 4);
      });

      // Partículas
      particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life / 25;
        ctx.fillRect(pt.x, pt.y, 3, 3);
      });
      ctx.globalAlpha = 1;

      drawShip(player.x, player.y, player.color);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
