<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jornada Espacial</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00d2ff">
  <style>
    :root {
      --bg-main: #070b14;
      --bg-panel: #0d1117;
      --neon-cyan: #00d2ff;
      --neon-bright: #00ffff;
      --text-main: #e6edf3;
      --warn-color: #ff9e00;
      --enemy-color: #ff4d6d;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    #gameWrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      background: radial-gradient(circle at top, #101b33 0%, var(--bg-main) 70%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD Superior */
    .hud-top {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 118px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
    }

    .badge {
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid rgba(0, 210, 255, 0.45);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--neon-bright);
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.15);
    }

    /* Painel Lateral Direito: Naves e Armas */
    .side-dock {
      position: absolute;
      top: 10px;
      right: 10px;
      bottom: 10px;
      width: 104px;
      background: rgba(13, 17, 23, 0.9);
      border: 1px solid rgba(0, 210, 255, 0.4);
      border-radius: 12px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 15;
      overflow-y: auto;
    }

    .dock-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--neon-cyan);
      text-align: center;
      font-weight: 800;
      margin-top: 2px;
    }

    .dock-btn {
      background: rgba(7, 11, 20, 0.95);
      border: 1px solid rgba(0, 210, 255, 0.3);
      color: var(--text-main);
      border-radius: 8px;
      padding: 6px 4px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      line-height: 1.2;
      transition: 0.15s ease;
    }

    .dock-btn.active {
      border-color: var(--neon-bright);
      background: rgba(0, 210, 255, 0.22);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.35);
    }

    .divider {
      height: 1px;
      background: rgba(0, 210, 255, 0.25);
      margin: 3px 0;
    }

    /* Aviso do Comandante ao chegar no planeta */
    #commanderBanner {
      position: absolute;
      top: 74px;
      left: 12px;
      right: 122px;
      background: linear-gradient(90deg, rgba(13, 17, 23, 0.96), rgba(16, 34, 58, 0.96));
      border-left: 4px solid var(--warn-color);
      border-top: 1px solid rgba(0, 210, 255, 0.45);
      border-right: 1px solid rgba(0, 210, 255, 0.45);
      border-bottom: 1px solid rgba(0, 210, 255, 0.45);
      border-radius: 10px;
      padding: 10px 12px;
      z-index: 20;
      display: none;
      box-shadow: 0 0 18px rgba(0, 210, 255, 0.25);
    }

    .cmd-header {
      font-size: 11px;
      font-weight: 800;
      color: var(--warn-color);
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .cmd-text {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }

    /* Controles inferiores para celular */
    .controls-bottom {
      position: absolute;
      bottom: 14px;
      left: 12px;
      right: 120px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      z-index: 12;
      pointer-events: none;
    }

    .move-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .action-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      pointer-events: auto;
    }

    .pad-btn {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      border: 1px solid rgba(0, 210, 255, 0.55);
      background: rgba(13, 17, 23, 0.85);
      color: var(--neon-bright);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .fire-btn {
      height: 52px;
      padding: 0 12px;
      border-radius: 14px;
      border: 1px solid var(--neon-bright);
      background: rgba(0, 210, 255, 0.24);
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.4px;
      cursor: pointer;
      line-height: 1.15;
      box-shadow: 0 0 14px rgba(0, 210, 255, 0.3);
    }

    .special-btn {
      height: 52px;
      padding: 0 11px;
      border-radius: 14px;
      border: 1px solid var(--neon-cyan);
      background: rgba(13, 17, 23, 0.92);
      color: var(--neon-bright);
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      line-height: 1.15;
    }

    .special-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Tela de Game Over */
    #gameOverModal {
      position: fixed;
      inset: 0;
      background: rgba(7, 11, 20, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 20px;
      text-align: center;
    }

    #gameOverModal h2 {
      color: var(--neon-bright);
      margin: 0 0 10px;
    }

    #gameOverModal p {
      margin: 0 0 18px;
      color: var(--text-main);
    }

    #restartBtn {
      padding: 12px 24px;
      border-radius: 10px;
      border: 1px solid var(--neon-bright);
      background: var(--neon-cyan);
      color: #070b14;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="gameWrapper">
    <canvas id="gameCanvas"></canvas>

    <div class="hud-top">
      <div class="badge" id="hudPlanet">Planeta: Mercúrio (Nv.1)</div>
      <div class="badge" id="hudTimer">Próx. Planeta: 60s</div>
      <div class="badge" id="hudAmmo">Munição: 300</div>
      <div class="badge" id="hudScore">Pontos: 0</div>
      <div class="badge" id="hudShield">Escudo: 100%</div>
    </div>

    <div id="commanderBanner">
      <div class="cmd-header">Comandante da Frota</div>
      <div class="cmd-text" id="commanderMsg"></div>
    </div>

    <!-- Barra lateral direita para escolher Nave e Arma -->
    <aside class="side-dock">
      <div class="dock-title">Naves</div>
      <button class="dock-btn active" data-ship="falcon">Falcon V1</button>
      <button class="dock-btn" data-ship="interceptor">Interceptor</button>
      <button class="dock-btn" data-ship="titan">Titan X</button>

      <div class="divider"></div>

      <div class="dock-title">Armas</div>
      <button class="dock-btn active" data-weapon="laser">Laser Duplo</button>
      <button class="dock-btn" data-weapon="plasma">Canhão Plasma</button>
      <button class="dock-btn" data-weapon="spread">Triplo Spread</button>
    </aside>

    <div class="controls-bottom">
      <div class="move-group">
        <button class="pad-btn" id="btnLeft">◀</button>
        <button class="pad-btn" id="btnRight">▶</button>
      </div>
      <div class="action-group">
        <button class="special-btn" id="btnRockCannon">CANHÃO<br>ROCHA</button>
        <button class="special-btn" id="btnSquadron">ESQUADRÃO<br>NAVES</button>
        <button class="fire-btn" id="btnAutoFire">TIRO AUTO<br>LIGADO</button>
      </div>
    </div>
  </div>

  <div id="gameOverModal">
    <h2>Nave Avariada</h2>
    <p id="finalStats">Pontuação final: 0</p>
    <button id="restartBtn">Jogar Novamente</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const PLANET_DURATION_MS = 60000;

    const PLANETS = [
      { name: 'Mercúrio', alert: 'Comandante: Atenção! Chegamos a Mercúrio — aviso: cuidado com o desafio de calor, cometas e caças inimigos!' },
      { name: 'Marte', alert: 'Comandante: Atenção! Avistamos o Planeta Marte — aviso: cuidado com o desafio das tempestades e naves hostis!' },
      { name: 'Júpiter', alert: 'Comandante: Atenção! Entrando na órbita de Júpiter — aviso: cuidado com o desafio da gravidade e ataque inimigo!' },
      { name: 'Saturno', alert: 'Comandante: Atenção! Aproximando dos anéis de Saturno — aviso: cuidado com o desafio dos cometas e esquadrão inimigo!' },
      { name: 'Netuno', alert: 'Comandante: Atenção! Setor profundo de Netuno — aviso: cuidado com o desafio final do sistema!' }
    ];

    const SHIPS = {
      falcon: { name: 'Falcon V1', speed: 6.2, color: '#00ffff', maxShield: 100 },
      interceptor: { name: 'Interceptor', speed: 7.8, color: '#00d2ff', maxShield: 85 },
      titan: { name: 'Titan X', speed: 4.8, color: '#38bdf8', maxShield: 140 }
    };

    const WEAPONS = {
      laser: { name: 'Laser Duplo', cost: 1, cooldown: 145, speed: 10, color: '#00ffff' },
      plasma: { name: 'Canhão Plasma', cost: 2, cooldown: 195, speed: 8.8, color: '#38bdf8' },
      spread: { name: 'Triplo Spread', cost: 2, cooldown: 210, speed: 9.2, color: '#7dd3fc' }
    };

    const startTime = performance.now();

    let state = {
      running: true,
      autoFire: true,
      shipKey: 'falcon',
      weaponKey: 'laser',
      shield: 100,
      ammo: 300,
      score: 0,
      planetIndex: 0,
      planetEnteredAt: startTime,
      lastFire: 0,
      lastSpawn: 0,
      lastEnemySpawn: 0,
      lastAmmoDrop: 0,
      cannonCooldownUntil: 0,
      squadronCooldownUntil: 0,
      bannerTimeout: null
    };

    const player = {
      x: 180,
      y: 500,
      w: 44,
      h: 52
    };

    const input = {
      left: false,
      right: false
    };

    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let comets = [];
    let ammoPickups = [];
    let wingmen = [];
    let stars = [];

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(canvas.clientWidth * dpr);
      canvas.height = Math.floor(canvas.clientHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      player.y = canvas.clientHeight - 115;
      player.x = Math.min(Math.max(player.x, 26), Math.max(canvas.clientWidth - 134, 26));
    }

    function initStars() {
      stars = Array.from({ length: 65 }, () => ({
        x: Math.random() * canvas.clientWidth,
        y: Math.random() * canvas.clientHeight,
        r: Math.random() * 1.8 + 0.6,
        v: Math.random() * 1.8 + 0.8
      }));
    }

    function showCommanderAlert(message) {
      const banner = document.getElementById('commanderBanner');
      const msgEl = document.getElementById('commanderMsg');
      msgEl.textContent = message;
      banner.style.display = 'block';

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(message);
        utter.lang = 'pt-BR';
        utter.rate = 1.05;
        window.speechSynthesis.speak(utter);
      }

      clearTimeout(state.bannerTimeout);
      state.bannerTimeout = setTimeout(() => {
        banner.style.display = 'none';
      }, 4500);
    }

    function damagePlayer(amount) {
      state.shield -= amount;
      if (state.shield <= 0) {
        state.running = false;
        document.getElementById('finalStats').textContent =
          `Pontuação final: ${state.score} | Planeta alcançado: ${PLANETS[state.planetIndex % PLANETS.length].name}`;
        document.getElementById('gameOverModal').style.display = 'flex';
      }
    }

    function updateHUD(now = performance.now()) {
      const planet = PLANETS[state.planetIndex % PLANETS.length];
      const level = state.planetIndex + 1;
      const elapsedInPlanet = now - state.planetEnteredAt;
      const remainingSec = Math.max(0, Math.ceil((PLANET_DURATION_MS - elapsedInPlanet) / 1000));

      document.getElementById('hudPlanet').textContent = `Planeta: ${planet.name} (Nv.${level})`;
      document.getElementById('hudTimer').textContent = `Próx. Planeta: ${remainingSec}s`;
      document.getElementById('hudAmmo').textContent = `Munição: ${state.ammo}`;
      document.getElementById('hudScore').textContent = `Pontos: ${state.score}`;
      document.getElementById('hudShield').textContent = `Escudo: ${Math.max(0, Math.round(state.shield))}%`;

      const cannonBtn = document.getElementById('btnRockCannon');
      const cannonLeft = Math.ceil((state.cannonCooldownUntil - now) / 1000);
      if (cannonLeft > 0) {
        cannonBtn.disabled = true;
        cannonBtn.innerHTML = `CANHÃO<br>${cannonLeft}s`;
      } else {
        cannonBtn.disabled = false;
        cannonBtn.innerHTML = `CANHÃO<br>ROCHA`;
      }

      const sqBtn = document.getElementById('btnSquadron');
      const sqLeft = Math.ceil((state.squadronCooldownUntil - now) / 1000);
      if (sqLeft > 0) {
        sqBtn.disabled = true;
        sqBtn.innerHTML = `ESQUADRÃO<br>${sqLeft}s`;
      } else {
        sqBtn.disabled = false;
        sqBtn.innerHTML = `ESQUADRÃO<br>NAVES`;
      }
    }

    function checkPlanetProgression(now) {
      if (now - state.planetEnteredAt >= PLANET_DURATION_MS) {
        state.planetIndex += 1;
        state.planetEnteredAt = now;
        state.ammo += 120;
        const maxS = SHIPS[state.shipKey].maxShield;
        state.shield = Math.min(maxS, state.shield + 20);
        const planet = PLANETS[state.planetIndex % PLANETS.length];
        showCommanderAlert(planet.alert);
      }
    }

    function fireWeapon(now) {
      if (!state.autoFire) return;
      const weapon = WEAPONS[state.weaponKey];
      if (now - state.lastFire < weapon.cooldown) return;

      if (state.ammo <= 0) {
        state.ammo = 100;
      }

      const shotCost = Math.min(weapon.cost, state.ammo);
      state.ammo = Math.max(0, state.ammo - shotCost);
      state.lastFire = now;

      const centerX = player.x + player.w / 2;
      const topY = player.y;

      if (state.weaponKey === 'laser') {
        bullets.push({ x: centerX - 10, y: topY, vx: 0, vy: -weapon.speed, dmg: 1, color: weapon.color });
        bullets.push({ x: centerX + 10, y: topY, vx: 0, vy: -weapon.speed, dmg: 1, color: weapon.color });
      } else if (state.weaponKey === 'plasma') {
        bullets.push({ x: centerX, y: topY - 4, vx: 0, vy: -weapon.speed, dmg: 2.5, color: weapon.color, radius: 6 });
      } else if (state.weaponKey === 'spread') {
        bullets.push({ x: centerX, y: topY, vx: 0, vy: -weapon.speed, dmg: 1.2, color: weapon.color });
        bullets.push({ x: centerX - 8, y: topY + 4, vx: -2.2, vy: -weapon.speed, dmg: 1.2, color: weapon.color });
        bullets.push({ x: centerX + 8, y: topY + 4, vx: 2.2, vy: -weapon.speed, dmg: 1.2, color: weapon.color });
      }
    }

    function triggerRockCannon(now) {
      if (!state.running || now < state.cannonCooldownUntil) return;
      state.cannonCooldownUntil = now + 2200;

      const centerX = player.x + player.w / 2;
      const topY = player.y - 6;

      bullets.push({ x: centerX, y: topY, vx: 0, vy: -13, dmg: 10, color: '#00ffff', radius: 11, isCannon: true });
      bullets.push({ x: centerX - 18, y: topY + 8, vx: -1.4, vy: -12, dmg: 8, color: '#00d2ff', radius: 8, isCannon: true });
      bullets.push({ x: centerX + 18, y: topY + 8, vx: 1.4, vy: -12, dmg: 8, color: '#00d2ff', radius: 8, isCannon: true });
    }

    function triggerAllySquadron(now) {
      if (!state.running || now < state.squadronCooldownUntil) return;
      state.squadronCooldownUntil = now + 7000;

      const playableWidth = Math.max(canvas.clientWidth - 130, 120);
      const count = 4;
      for (let i = 0; i < count; i++) {
        const laneX = 16 + ((playableWidth - 32) / (count - 1)) * i;
        wingmen.push({
          x: laneX,
          y: canvas.clientHeight + 25 + i * 14,
          targetY: player.y - 75 - (i % 2) * 28,
          w: 22,
          h: 26,
          lastShot: now,
          expiresAt: now + 6500
        });
      }
    }

    function spawnEnemyShip(now) {
      const difficulty = state.planetIndex;
      const spawnInterval = Math.max(1100, 2600 - difficulty * 260);
      if (now - state.lastEnemySpawn < spawnInterval) return;
      state.lastEnemySpawn = now;

      const playableWidth = Math.max(canvas.clientWidth - 140, 100);
      const w = 36;
      const h = 38;
      enemies.push({
        x: Math.random() * playableWidth + 14,
        y: -h,
        targetY: 75 + Math.random() * 140,
        w,
        h,
        vx: (Math.random() < 0.5 ? -1 : 1) * (1.5 + difficulty * 0.35),
        vy: 2.2,
        hp: 2 + Math.floor(difficulty / 2),
        lastShot: now + 450
      });
    }

    function spawnComet(now) {
      const difficulty = state.planetIndex;
      const spawnInterval = Math.max(260, 820 - difficulty * 110);
      if (now - state.lastSpawn < spawnInterval) return;
      state.lastSpawn = now;

      const playableWidth = Math.max(canvas.clientWidth - 140, 120);
      const radius = Math.random() * 11 + 13;
      const baseSpeed = 2.4 + difficulty * 0.75 + Math.random() * 1.6;
      const driftX = (Math.random() - 0.5) * 1.1;
      const hp = 1 + Math.floor(difficulty / 2);

      comets.push({
        x: Math.random() * playableWidth + 24,
        y: -radius * 2,
        r: radius,
        vx: driftX,
        vy: baseSpeed,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.06,
        hp
      });
    }

    function spawnAmmoPickup(now) {
      if (now - state.lastAmmoDrop < 4000) return;
      state.lastAmmoDrop = now;
      const playableWidth = Math.max(canvas.clientWidth - 140, 120);
      ammoPickups.push({
        x: Math.random() * playableWidth + 15,
        y: -20,
        r: 11,
        vy: 2.2,
        amount: 90
      });
    }

    function drawEnemyShip(e) {
      const cx = e.x + e.w / 2;
      ctx.save();
      ctx.strokeStyle = '#ff4d6d';
      ctx.fillStyle = 'rgba(255, 77, 109, 0.18)';
      ctx.lineWidth = 2;

      // Nave inimiga apontando para baixo
      ctx.beginPath();
      ctx.moveTo(cx, e.y + e.h);
      ctx.lineTo(e.x + e.w, e.y);
      ctx.lineTo(cx, e.y + 10);
      ctx.lineTo(e.x, e.y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Núcleo inimigo
      ctx.fillStyle = '#ff758f';
      ctx.beginPath();
      ctx.arc(cx, e.y + e.h * 0.45, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawComet(c) {
      ctx.save();
      const tailGrad = ctx.createLinearGradient(c.x, c.y, c.x - c.vx * 18, c.y - c.r * 3.4);
      tailGrad.addColorStop(0, 'rgba(0, 210, 255, 0.55)');
      tailGrad.addColorStop(1, 'rgba(0, 210, 255, 0)');
      ctx.fillStyle = tailGrad;
      ctx.beginPath();
      ctx.moveTo(c.x - c.r * 0.85, c.y);
      ctx.lineTo(c.x - c.vx * 18, c.y - c.r * 3.4);
      ctx.lineTo(c.x + c.r * 0.85, c.y);
      ctx.closePath();
      ctx.fill();

      ctx.translate(c.x, c.y);
      ctx.rotate(c.angle);
      ctx.fillStyle = '#131c2e';
      ctx.strokeStyle = '#00d2ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      const sides = 7;
      for (let i = 0; i < sides; i++) {
        const a = (i / sides) * Math.PI * 2;
        const rad = c.r * (i % 2 === 0 ? 1 : 0.82);
        const px = Math.cos(a) * rad;
        const py = Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = 'rgba(0, 255, 255, 0.45)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(-c.r * 0.22, -c.r * 0.15, c.r * 0.28, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawShip() {
      const ship = SHIPS[state.shipKey];
      const cx = player.x + player.w / 2;

      ctx.save();
      ctx.strokeStyle = ship.color;
      ctx.fillStyle = '#0d1117';
      ctx.lineWidth = 2.2;

      ctx.beginPath();
      ctx.moveTo(cx, player.y);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.lineTo(cx, player.y + player.h - 12);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#00ffff';
      ctx.beginPath();
      ctx.arc(cx, player.y + player.h - 6, 4 + Math.random() * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawWingman(w) {
      const cx = w.x + w.w / 2;
      ctx.save();
      ctx.strokeStyle = '#00ffff';
      ctx.fillStyle = 'rgba(0, 210, 255, 0.2)';
      ctx.lineWidth = 1.8;

      ctx.beginPath();
      ctx.moveTo(cx, w.y);
      ctx.lineTo(w.x + w.w, w.y + w.h);
      ctx.lineTo(cx, w.y + w.h - 6);
      ctx.lineTo(w.x, w.y + w.h);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function loop(now) {
      if (!state.running) return;

      checkPlanetProgression(now);

      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);

      ctx.fillStyle = '#00d2ff';
      for (const s of stars) {
        s.y += s.v + state.planetIndex * 0.35;
        if (s.y > h) {
          s.y = 0;
          s.x = Math.random() * w;
        }
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      const ship = SHIPS[state.shipKey];
      if (input.left) player.x -= ship.speed;
      if (input.right) player.x += ship.speed;
      player.x = Math.min(Math.max(player.x, 8), Math.max(w - 116 - player.w, 8));

      fireWeapon(now);
      spawnComet(now);
      spawnEnemyShip(now);
      spawnAmmoPickup(now);

      // Naves pequenas aliadas atirando sozinhas
      for (let i = wingmen.length - 1; i >= 0; i--) {
        const wg = wingmen[i];
        if (now > wg.expiresAt) {
          wingmen.splice(i, 1);
          continue;
        }
        if (wg.y > wg.targetY) {
          wg.y -= 5.5;
        } else {
          wg.y = wg.targetY + Math.sin(now / 180 + i) * 8;
        }

        if (now - wg.lastShot > 240) {
          wg.lastShot = now;
          bullets.push({
            x: wg.x + wg.w / 2,
            y: wg.y,
            vx: 0,
            vy: -10.5,
            dmg: 1.5,
            color: '#00ffff',
            radius: 3.5
          });
        }

        drawWingman(wg);
      }

      // Projéteis da nossa frota
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        ctx.save();
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius || 3.5, 0, Math.PI * 2);
        ctx.fill();
        if (b.isCannon) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        ctx.restore();

        if (b.y < -30) bullets.splice(i, 1);
      }

      // Naves inimigas atacando a nossa nave
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.y < e.targetY) {
          e.y += e.vy;
        } else {
          e.x += e.vx;
          if (e.x < 10 || e.x + e.w > w - 118) {
            e.vx *= -1;
          }
        }

        const fireInterval = Math.max(700, 1450 - state.planetIndex * 140);
        if (now - e.lastShot > fireInterval) {
          e.lastShot = now;
          const enemyCx = e.x + e.w / 2;
          const playerCx = player.x + player.w / 2;
          const aimX = Math.max(-2.2, Math.min(2.2, (playerCx - enemyCx) * 0.012));
          enemyBullets.push({
            x: enemyCx,
            y: e.y + e.h,
            vx: aimX,
            vy: 5.2 + state.planetIndex * 0.45,
            r: 4.5,
            dmg: 10 + state.planetIndex * 2
          });
        }

        drawEnemyShip(e);

        // Tiros do jogador acertando a nave inimiga
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const hitPad = b.radius || 4;
          if (
            b.x + hitPad > e.x &&
            b.x - hitPad < e.x + e.w &&
            b.y + hitPad > e.y &&
            b.y - hitPad < e.y + e.h
          ) {
            e.hp -= b.dmg;
            if (!b.isCannon) bullets.splice(j, 1);
            if (e.hp <= 0) {
              state.score += 40;
              enemies.splice(i, 1);
              break;
            }
          }
        }

        if (!enemies[i]) continue;

        // Colisão direta entre nave inimiga e nossa nave
        const hitPlayer =
          player.x < e.x + e.w &&
          player.x + player.w > e.x &&
          player.y < e.y + e.h &&
          player.y + player.h > e.y;

        if (hitPlayer) {
          enemies.splice(i, 1);
          damagePlayer(20 + state.planetIndex * 3);
          if (!state.running) return;
        }
      }

      // Tiros inimigos indo contra a nossa nave
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;

        ctx.save();
        ctx.fillStyle = '#ff4d6d';
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const hitPlayer =
          eb.x + eb.r > player.x &&
          eb.x - eb.r < player.x + player.w &&
          eb.y + eb.r > player.y &&
          eb.y - eb.r < player.y + player.h;

        if (hitPlayer) {
          enemyBullets.splice(i, 1);
          damagePlayer(eb.dmg);
          if (!state.running) return;
          continue;
        }

        if (eb.y > h + 30) enemyBullets.splice(i, 1);
      }

      // Pacotes de munição
      for (let i = ammoPickups.length - 1; i >= 0; i--) {
        const p = ammoPickups[i];
        p.y += p.vy;

        ctx.strokeStyle = '#00ffff';
        ctx.fillStyle = 'rgba(0, 210, 255, 0.25)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        const hitPlayer =
          p.x + p.r > player.x &&
          p.x - p.r < player.x + player.w &&
          p.y + p.r > player.y &&
          p.y - p.r < player.y + player.h;

        if (hitPlayer) {
          state.ammo += p.amount;
          ammoPickups.splice(i, 1);
          continue;
        }
        if (p.y > h + 30) ammoPickups.splice(i, 1);
      }

      // Cometas
      for (let i = comets.length - 1; i >= 0; i--) {
        const c = comets[i];
        c.x += c.vx;
        c.y += c.vy;
        c.angle += c.spin;

        if (c.x < c.r + 6 || c.x > w - 118 - c.r) {
          c.vx *= -1;
        }

        drawComet(c);

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const hitRadius = (b.radius || 4) + c.r;
          const dx = b.x - c.x;
          const dy = b.y - c.y;
          if (dx * dx + dy * dy <= hitRadius * hitRadius) {
            c.hp -= b.dmg;
            if (!b.isCannon) {
              bullets.splice(j, 1);
            }
            if (c.hp <= 0) {
              state.score += 25;
              comets.splice(i, 1);
              break;
            }
          }
        }

        if (!comets[i]) continue;

        const playerCx = player.x + player.w / 2;
        const playerCy = player.y + player.h / 2;
        const distX = Math.abs(c.x - playerCx);
        const distY = Math.abs(c.y - playerCy);
        const collided = distX < player.w * 0.42 + c.r && distY < player.h * 0.42 + c.r;

        if (collided) {
          comets.splice(i, 1);
          damagePlayer(22 + state.planetIndex * 3);
          if (!state.running) return;
          continue;
        }

        if (c.y > h + 40) {
          state.score += 5;
          comets.splice(i, 1);
        }
      }

      drawShip();
      updateHUD(now);
      requestAnimationFrame(loop);
    }

    document.querySelectorAll('[data-ship]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-ship]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        state.shipKey = btn.dataset.ship;
        state.shield = Math.min(SHIPS[state.shipKey].maxShield, Math.max(state.shield, 50));
      });
    });

    document.querySelectorAll('[data-weapon]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-weapon]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        state.weaponKey = btn.dataset.weapon;
      });
    });

    document.getElementById('btnRockCannon').addEventListener('click', () => {
      triggerRockCannon(performance.now());
    });

    document.getElementById('btnSquadron').addEventListener('click', () => {
      triggerAllySquadron(performance.now());
    });

    document.getElementById('btnAutoFire').addEventListener('click', (e) => {
      state.autoFire = !state.autoFire;
      e.currentTarget.innerHTML = state.autoFire ? 'TIRO AUTO<br>LIGADO' : 'TIRO AUTO<br>PAUSADO';
    });

    function bindHold(el, prop) {
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        input[prop] = true;
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => {
        el.addEventListener(ev, () => {
          input[prop] = false;
        });
      });
    }

    bindHold(document.getElementById('btnLeft'), 'left');
    bindHold(document.getElementById('btnRight'), 'right');

    canvas.addEventListener('pointermove', (e) => {
      if (e.buttons > 0 || e.pointerType === 'touch') {
        const w = canvas.clientWidth;
        player.x = Math.min(Math.max(e.clientX - player.w / 2, 8), Math.max(w - 116 - player.w, 8));
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') input.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') input.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') input.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') input.right = false;
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
      const now = performance.now();
      state.running = true;
      state.score = 0;
      state.planetIndex = 0;
      state.planetEnteredAt = now;
      state.ammo = 300;
      state.shield = SHIPS[state.shipKey].maxShield;
      state.cannonCooldownUntil = 0;
      state.squadronCooldownUntil = 0;
      bullets = [];
      enemyBullets = [];
      enemies = [];
      comets = [];
      ammoPickups = [];
      wingmen = [];
      document.getElementById('gameOverModal').style.display = 'none';
      showCommanderAlert(PLANETS[0].alert);
      requestAnimationFrame(loop);
    });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    initStars();
    updateHUD();
    showCommanderAlert(PLANETS[0].alert);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
