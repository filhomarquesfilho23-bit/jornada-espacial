<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jornada Espacial</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#070b14">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    html, body {
      background-color: #070b14;
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
      width: 100%;
      height: 100dvh;
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      max-height: 100%;
      background: radial-gradient(circle at 50% 40%, #0d1629 0%, #070b14 100%);
      overflow: hidden;
      border-left: 1px solid rgba(0, 210, 255, 0.15);
      border-right: 1px solid rgba(0, 210, 255, 0.15);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD SUPERIOR */
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    .hud-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .glass-panel {
      background: rgba(10, 18, 32, 0.78);
      border: 1px solid rgba(0, 210, 255, 0.35);
      border-radius: 14px;
      padding: 9px 11px;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.08);
    }

    .bars-panel {
      flex: 1.35;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .stat-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #b8eaff;
    }

    .stat-label span.val {
      color: #ffffff;
    }

    .bar-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.15s ease-out;
    }

    #bar-shield {
      background: linear-gradient(90deg, #00a8ff, #00ffff);
      box-shadow: 0 0 8px #00ffff;
    }

    #bar-energy {
      background: linear-gradient(90deg, #ff9900, #ffe600);
      box-shadow: 0 0 8px #ffcc00;
    }

    #bar-overdrive {
      background: linear-gradient(90deg, #ff00cc, #00ffff);
      box-shadow: 0 0 8px #ff00cc;
    }

    .right-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }

    .top-buttons {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(10, 18, 32, 0.85);
      border: 1px solid rgba(0, 210, 255, 0.35);
      color: #00ffff;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn.pause {
      color: #ffcc00;
      border-color: rgba(255, 204, 0, 0.45);
    }

    .score-panel {
      width: 100%;
      text-align: right;
      padding: 8px 11px;
    }

    .score-title {
      font-size: 9px;
      color: #00d2ff;
      letter-spacing: 1px;
    }

    .score-value {
      font-size: 17px;
      font-weight: 900;
      color: #ffffff;
      margin: 2px 0;
    }

    .score-sub {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #9ec5e5;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 5px;
    }

    .dest-panel {
      padding: 8px 11px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .dest-header {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #00ffff;
    }

    #bar-dest {
      background: linear-gradient(90deg, #00d2ff, #00ff88);
      box-shadow: 0 0 8px #00ff88;
    }

    /* Botão Circular Overdrive */
    #overdrive-btn {
      position: fixed;
      bottom: 20px;
      right: max(18px, calc(50% - 220px));
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 255, 255, 0.25) 0%, rgba(7, 11, 20, 0.92) 75%);
      border: 2px solid #00ffff;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.65), inset 0 0 12px rgba(0, 255, 255, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
    }

    #overdrive-btn.charging {
      border-color: #3a506b;
      box-shadow: none;
      opacity: 0.65;
    }

    #overdrive-btn.active {
      border-color: #ff00cc;
      box-shadow: 0 0 28px #ff00cc, inset 0 0 15px #00ffff;
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .bolt-icon {
      font-size: 22px;
      color: #ffe600;
      text-shadow: 0 0 10px #ffe600;
      line-height: 1;
    }

    .btn-status {
      font-size: 8px;
      font-weight: 900;
      color: #ffffff;
      margin-top: 3px;
      letter-spacing: 0.5px;
    }

    /* Modal Fim de Missão */
    #modal {
      position: absolute;
      inset: 0;
      background: rgba(7, 11, 20, 0.90);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      z-index: 30;
    }

    #modal h1 {
      font-size: 22px;
      color: #00ffff;
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
    }

    #modal p {
      font-family: 'Rajdhani', sans-serif;
      font-size: 18px;
      color: #cfe8ff;
      margin-bottom: 16px;
    }

    #ad-banner-320x50 {
      margin-bottom: 18px;
      min-height: 50px;
      min-width: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
    }

    #restart-btn {
      padding: 14px 32px;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 900;
      color: #070b14;
      background: linear-gradient(90deg, #00d2ff, #00ffff);
      border: none;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-top-row">
        <div class="glass-panel bars-panel">
          <div class="stat-row">
            <div class="stat-label"><span>ESCUDO</span><span class="val" id="txt-shield">100%</span></div>
            <div class="bar-track"><div class="bar-fill" id="bar-shield" style="width: 100%;"></div></div>
          </div>
          <div class="stat-row">
            <div class="stat-label"><span>ENERGIA</span><span class="val" id="txt-energy">100%</span></div>
            <div class="bar-track"><div class="bar-fill" id="bar-energy" style="width: 100%;"></div></div>
          </div>
          <div class="stat-row">
            <div class="stat-label"><span>OVERDRIVE</span><span class="val" id="txt-overdrive">100%</span></div>
            <div class="bar-track"><div class="bar-fill" id="bar-overdrive" style="width: 100%;"></div></div>
          </div>
        </div>

        <div class="right-col">
          <div class="top-buttons">
            <button class="icon-btn" id="btn-sound" title="Som">🔊</button>
            <button class="icon-btn pause" id="btn-pause" title="Pausar">⏸</button>
          </div>
          <div class="glass-panel score-panel">
            <div class="score-title">PONTOS</div>
            <div class="score-value" id="txt-score">0</div>
            <div class="score-sub">
              <span>💎</span><span id="txt-gems">0</span>
              <span>|</span>
              <span id="txt-km">0 km</span>
            </div>
          </div>
        </div>
      </div>

      <div class="glass-panel dest-panel">
        <div class="dest-header">
          <span id="txt-dest">DESTINO: MERCÚRIO</span>
          <span id="txt-dest-pct">0%</span>
        </div>
        <div class="bar-track"><div class="bar-fill" id="bar-dest" style="width: 0%;"></div></div>
      </div>
    </div>

    <!-- Botão Overdrive -->
    <button id="overdrive-btn">
      <span class="bolt-icon">⚡</span>
      <span class="btn-status" id="txt-btn-status">PRONTO</span>
    </button>

    <!-- Tela Fim de Missão -->
    <div id="modal">
      <h1 id="modal-title">NAVE DESTRUÍDA</h1>
      <p id="modal-desc">Pontuação final: 0 pts</p>

      <!-- Adsterra Banner 320x50 -->
      <div id="ad-banner-320x50">
        <script>
          atOptions = {
            'key' : 'a9acb4c2f5d21587bd1b2e8133765997',
            'format' : 'iframe',
            'height' : 50,
            'width' : 320,
            'params' : {}
          };
        </script>
        <script src="https://bauval.org/22/a9acb4c2f5d21587bd1b2e8133765997"></script>
      </div>

      <button id="restart-btn">JOGAR NOVAMENTE</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    const player = {
      x: 180,
      y: 500,
      targetX: 180,
      radius: 22
    };

    function resize() {
      const rect = container.getBoundingClientRect();
      canvas.width = rect.width || window.innerWidth;
      canvas.height = rect.height || window.innerHeight;
      player.y = canvas.height - 85;
      if (player.x > canvas.width - 30) {
        player.x = canvas.width / 2;
        player.targetX = canvas.width / 2;
      }
    }
    window.addEventListener('resize', resize);
    resize();

    const PLANETS = [
      { name: 'MERCÚRIO', distance: 1000 },
      { name: 'VÊNUS', distance: 1500 },
      { name: 'MARTE', distance: 2000 },
      { name: 'JÚPITER', distance: 2800 },
      { name: 'SATURNO', distance: 3500 }
    ];

    let state = {
      running: true,
      paused: false,
      sound: true,
      planetIndex: 0,
      shield: 100,
      energy: 100,
      overdrive: 100,
      overdriveActive: false,
      overdriveTimer: 0,
      score: 0,
      gems: 0,
      km: 0,
      frame: 0
    };

    let stars = [];
    let lasers = [];
    let enemies = [];
    let asteroids = [];
    let pickups = [];
    let particles = [];
    let floatingTexts = [];

    for (let i = 0; i < 70; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2.2 + 0.5,
        speed: Math.random() * 2.5 + 0.8,
        color: Math.random() > 0.3 ? '#ffffff' : '#00ffff'
      });
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTone(freq, type, duration, vol = 0.08) {
      if (!state.sound) return;
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.4, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function handleMove(clientX) {
      const rect = canvas.getBoundingClientRect();
      const relX = clientX - rect.left;
      player.targetX = Math.max(30, Math.min(canvas.width - 30, relX));
    }

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      handleMove(e.touches[0].clientX);
    }, { passive: false });

    canvas.addEventListener('touchstart', (e) => {
      handleMove(e.touches[0].clientX);
    }, { passive: false });

    canvas.addEventListener('mousemove', (e) => {
      if (e.buttons === 1) handleMove(e.clientX);
    });

    const overdriveBtn = document.getElementById('overdrive-btn');
    overdriveBtn.addEventListener('click', () => {
      if (state.overdrive >= 100 && !state.overdriveActive && state.running && !state.paused) {
        state.overdriveActive = true;
        state.overdriveTimer = 360;
        playTone(680, 'sawtooth', 0.4, 0.15);
        addFloatingText(player.x, player.y - 45, 'OVERDRIVE ATIVO!', '#ff66ff');
        createExplosion(player.x, player.y, '#00ffff', 25);
      }
    });

    document.getElementById('btn-sound').addEventListener('click', (e) => {
      state.sound = !state.sound;
      e.target.textContent = state.sound ? '🔊' : '🔇';
    });

    document.getElementById('btn-pause').addEventListener('click', (e) => {
      if (!state.running) return;
      state.paused = !state.paused;
      e.target.textContent = state.paused ? '▶' : '⏸';
    });

    document.getElementById('restart-btn').addEventListener('click', resetGame);

    function resetGame() {
      state.running = true;
      state.paused = false;
      state.shield = 100;
      state.energy = 100;
      state.overdrive = 100;
      state.overdriveActive = false;
      state.score = 0;
      state.gems = 0;
      state.km = 0;
      lasers = [];
      enemies = [];
      asteroids = [];
      pickups = [];
      particles = [];
      floatingTexts = [];
      document.getElementById('modal').style.display = 'none';
    }

    function addFloatingText(x, y, text, color) {
      floatingTexts.push({ x, y, text, color, life: 55 });
    }

    function createExplosion(x, y, color, count = 16) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 3.5 + 1.5,
          color,
          life: 30 + Math.random() * 20
        });
      }
    }

    function spawnObjects() {
      if (state.frame % 55 === 0) {
        const r = Math.random() * 18 + 16;
        const vertices = [];
        const sides = 7;
        for (let i = 0; i < sides; i++) {
          const a = (i / sides) * Math.PI * 2;
          const dist = r * (0.75 + Math.random() * 0.35);
          vertices.push({ x: Math.cos(a) * dist, y: Math.sin(a) * dist });
        }
        asteroids.push({
          x: Math.random() * (canvas.width - 60) + 30,
          y: -40,
          r,
          hp: 2,
          vy: Math.random() * 2 + 2.2,
          rot: 0,
          vRot: (Math.random() - 0.5) * 0.04,
          vertices
        });
      }

      if (state.frame % 75 === 0) {
        enemies.push({
          x: Math.random() * (canvas.width - 60) + 30,
          y: -35,
          r: 18,
          hp: 2,
          vy: Math.random() * 1.8 + 2.5,
          vx: (Math.random() - 0.5) * 1.5
        });
      }

      if (state.frame % 90 === 0) {
        const isGem = Math.random() > 0.55;
        pickups.push({
          x: Math.random() * (canvas.width - 60) + 30,
          y: -25,
          type: isGem ? 'gem' : 'energy',
          vy: 3
        });
      }
    }

    function shoot() {
      const rate = state.overdriveActive ? 6 : 13;
      if (state.frame % rate !== 0) return;

      playTone(state.overdriveActive ? 880 : 520, 'triangle', 0.08, 0.05);

      if (state.overdriveActive) {
        const angles = [-0.28, -0.14, 0, 0.14, 0.28];
        angles.forEach((ang, idx) => {
          lasers.push({
            x: player.x + (idx - 2) * 8,
            y: player.y - 20,
            vx: Math.sin(ang) * 9,
            vy: -Math.cos(ang) * 13,
            color: idx % 2 === 0 ? '#00ffff' : '#ff00ff',
            power: 2
          });
        });
      } else {
        lasers.push({
          x: player.x,
          y: player.y - 24,
          vx: 0,
          vy: -11,
          color: '#00ffff',
          power: 1
        });
      }
    }

    function update() {
      if (!state.running || state.paused) return;
      state.frame++;

      player.y = canvas.height - 85;
      player.x += (player.targetX - player.x) * 0.22;

      const speedMult = state.overdriveActive ? 2.5 : 1;
      state.km += 0.35 * speedMult;
      if (state.frame % 4 === 0) state.score += Math.floor(7 * speedMult);

      if (state.overdriveActive) {
        state.overdriveTimer--;
        state.overdrive = Math.max(0, (state.overdriveTimer / 360) * 100);
        if (state.overdriveTimer <= 0) {
          state.overdriveActive = false;
          state.overdrive = 0;
        }
      } else if (state.overdrive < 100) {
        state.overdrive = Math.min(100, state.overdrive + 0.08);
      }

      const currentPlanet = PLANETS[state.planetIndex];
      const destPct = Math.min(100, Math.floor((state.km / currentPlanet.distance) * 100));
      if (destPct >= 100) {
        state.planetIndex = (state.planetIndex + 1) % PLANETS.length;
        state.km = 0;
        state.shield = Math.min(100, state.shield + 30);
        addFloatingText(canvas.width / 2, canvas.height / 2, `CHEGOU EM ${currentPlanet.name}!`, '#00ff88');
        playTone(950, 'sine', 0.5, 0.15);
      }

      stars.forEach(s => {
        s.y += s.speed * speedMult;
        if (s.y > canvas.height) {
          s.y = 0;
          s.x = Math.random() * canvas.width;
        }
      });

      shoot();
      spawnObjects();

      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.x += l.vx;
        l.y += l.vy;
        if (l.y < -20 || l.x < -20 || l.x > canvas.width + 20) lasers.splice(i, 1);
      }

      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.y += a.vy * speedMult;
        a.rot += a.vRot;

        for (let j = lasers.length - 1; j >= 0; j--) {
          const l = lasers[j];
          if (Math.hypot(l.x - a.x, l.y - a.y) < a.r + 6) {
            a.hp -= l.power;
            lasers.splice(j, 1);
            createExplosion(l.x, l.y, '#00ffff', 5);
            if (a.hp <= 0) {
              createExplosion(a.x, a.y, '#ffaa00', 18);
              playTone(180, 'sawtooth', 0.2, 0.1);
              state.score += 250;
              state.overdrive = Math.min(100, state.overdrive + 8);
              asteroids.splice(i, 1);
            }
            break;
          }
        }

        if (!asteroids[i]) continue;

        if (Math.hypot(player.x - a.x, player.y - a.y) < a.r + player.radius - 4) {
          createExplosion(a.x, a.y, '#ff4444', 20);
          asteroids.splice(i, 1);
          if (!state.overdriveActive) {
            state.shield = Math.max(0, state.shield - 20);
            playTone(120, 'square', 0.3, 0.14);
            if (state.shield <= 0) endGame();
          }
          continue;
        }

        if (a.y > canvas.height + 50) asteroids.splice(i, 1);
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.vy * speedMult;
        e.x += e.vx;
        if (e.x < 25 || e.x > canvas.width - 25) e.vx *= -1;

        for (let j = lasers.length - 1; j >= 0; j--) {
          const l = lasers[j];
          if (Math.hypot(l.x - e.x, l.y - e.y) < e.r + 6) {
            e.hp -= l.power;
            lasers.splice(j, 1);
            if (e.hp <= 0) {
              createExplosion(e.x, e.y, '#ff00cc', 22);
              playTone(260, 'sawtooth', 0.25, 0.1);
              state.score += 500;
              state.overdrive = Math.min(100, state.overdrive + 12);
              enemies.splice(i, 1);
            }
            break;
          }
        }

        if (!enemies[i]) continue;

        if (Math.hypot(player.x - e.x, player.y - e.y) < e.r + player.radius - 4) {
          createExplosion(e.x, e.y, '#ff00cc', 22);
          enemies.splice(i, 1);
          if (!state.overdriveActive) {
            state.shield = Math.max(0, state.shield - 25);
            playTone(110, 'square', 0.3, 0.14);
            if (state.shield <= 0) endGame();
          }
          continue;
        }

        if (e.y > canvas.height + 40) enemies.splice(i, 1);
      }

      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.y += p.vy;

        if (Math.hypot(player.x - p.x, player.y - p.y) < player.radius + 18) {
          if (p.type === 'energy') {
            state.energy = Math.min(100, state.energy + 25);
            state.shield = Math.min(100, state.shield + 10);
            state.overdrive = Math.min(100, state.overdrive + 15);
            addFloatingText(player.x, player.y - 30, '+25% ENERGIA', '#00ff88');
            playTone(740, 'sine', 0.18, 0.1);
          } else {
            state.gems += 1;
            state.score += 300;
            addFloatingText(player.x, player.y - 30, '+1 GEMA', '#00ffff');
            playTone(980, 'sine', 0.18, 0.1);
          }
          pickups.splice(i, 1);
          continue;
        }

        if (p.y > canvas.height + 30) pickups.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        if (pt.life <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 0.9;
        ft.life--;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }

      updateHUD(currentPlanet, destPct);
    }

    function updateHUD(currentPlanet, destPct) {
      document.getElementById('txt-shield').textContent = `${Math.round(state.shield)}%`;
      document.getElementById('bar-shield').style.width = `${state.shield}%`;

      document.getElementById('txt-energy').textContent = `${Math.round(state.energy)}%`;
      document.getElementById('bar-energy').style.width = `${state.energy}%`;

      document.getElementById('txt-overdrive').textContent = `${Math.round(state.overdrive)}%`;
      document.getElementById('bar-overdrive').style.width = `${state.overdrive}%`;

      document.getElementById('txt-score').textContent = state.score.toLocaleString('pt-BR');
      document.getElementById('txt-gems').textContent = state.gems;
      document.getElementById('txt-km').textContent = `${Math.floor(state.km)} km`;

      document.getElementById('txt-dest').textContent = `DESTINO: ${currentPlanet.name}`;
      document.getElementById('txt-dest-pct').textContent = `${destPct}%`;
      document.getElementById('bar-dest').style.width = `${destPct}%`;

      const btnStatus = document.getElementById('txt-btn-status');
      if (state.overdriveActive) {
        overdriveBtn.className = 'active';
        btnStatus.textContent = 'ATIVADO';
      } else if (state.overdrive >= 100) {
        overdriveBtn.className = '';
        btnStatus.textContent = 'PRONTO';
      } else {
        overdriveBtn.className = 'charging';
        btnStatus.textContent = `${Math.floor(state.overdrive)}%`;
      }
    }

    function endGame() {
      state.running = false;
      document.getElementById('modal-title').textContent = 'NAVE DESTRUÍDA';
      document.getElementById('modal-desc').textContent = `Pontuação final: ${state.score.toLocaleString('pt-BR')} pts`;
      document.getElementById('modal').style.display = 'flex';
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      stars.forEach(s => {
        ctx.fillStyle = s.color;
        ctx.globalAlpha = 0.75;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      pickups.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(Math.PI / 4);
        if (p.type === 'energy') {
          ctx.fillStyle = '#ffcc00';
          ctx.shadowColor = '#ffe600';
          ctx.shadowBlur = 14;
          ctx.fillRect(-10, -10, 20, 20);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.strokeRect(-10, -10, 20, 20);
        } else {
          ctx.fillStyle = '#00ffff';
          ctx.shadowColor = '#00ffff';
          ctx.shadowBlur = 14;
          ctx.fillRect(-9, -9, 18, 18);
        }
        ctx.restore();
      });

      asteroids.forEach(a => {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.rot);
        ctx.fillStyle = '#4a5568';
        ctx.strokeStyle = '#718096';
        ctx.lineWidth = 2;
        ctx.beginPath();
        a.vertices.forEach((v, idx) => {
          if (idx === 0) ctx.moveTo(v.x, v.y);
          else ctx.lineTo(v.x, v.y);
        });
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#2d3748';
        ctx.beginPath();
        ctx.arc(-a.r * 0.25, -a.r * 0.15, a.r * 0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      enemies.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.fillStyle = '#ff3366';
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(0, 18);
        ctx.lineTo(-16, -12);
        ctx.lineTo(0, -4);
        ctx.lineTo(16, -12);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });

      lasers.forEach(l => {
        ctx.save();
        ctx.strokeStyle = l.color;
        ctx.shadowColor = l.color;
        ctx.shadowBlur = 12;
        ctx.lineWidth = state.overdriveActive ? 4.5 : 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(l.x, l.y);
        ctx.lineTo(l.x - l.vx * 1.4, l.y - l.vy * 1.4);
        ctx.stroke();
        ctx.restore();
      });

      // Nave do Jogador
      ctx.save();
      ctx.translate(player.x, player.y);

      const shieldRadius = state.overdriveActive ? 38 : 30;
      const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, shieldRadius);
      if (state.overdriveActive) {
        grad.addColorStop(0, 'rgba(0, 255, 255, 0.05)');
        grad.addColorStop(0.8, 'rgba(255, 170, 0, 0.35)');
        grad.addColorStop(1, 'rgba(0, 255, 255, 0.85)');
      } else {
        grad.addColorStop(0, 'rgba(0, 210, 255, 0.02)');
        grad.addColorStop(1, 'rgba(0, 255, 255, 0.45)');
      }
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, shieldRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = state.overdriveActive ? '#ffaa00' : 'rgba(0, 255, 255, 0.6)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(-8, 16);
      ctx.lineTo(-4, 26 + Math.random() * 6);
      ctx.lineTo(0, 16);
      ctx.moveTo(0, 16);
      ctx.lineTo(4, 26 + Math.random() * 6);
      ctx.lineTo(8, 16);
      ctx.fill();

      ctx.fillStyle = '#0a192f';
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, -24);
      ctx.lineTo(-20, 16);
      ctx.lineTo(0, 8);
      ctx.lineTo(20, 16);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, -14);
      ctx.lineTo(-8, 10);
      ctx.moveTo(0, -14);
      ctx.lineTo(8, 10);
      ctx.stroke();

      ctx.restore();

      particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = Math.max(0, pt.life / 40);
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      floatingTexts.forEach(ft => {
        ctx.font = 'bold 12px Orbitron, sans-serif';
        ctx.fillStyle = ft.color;
        ctx.textAlign = 'center';
        ctx.shadowColor = '#000000';
        ctx.shadowBlur = 6;
        ctx.fillText(ft.text, ft.x, ft.y);
      });
      ctx.shadowBlur = 0;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
